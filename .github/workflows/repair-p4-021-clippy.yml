name: Repair P4-021 telemetry Clippy

on:
  push:
    branches:
      - fix/comprehensive-secret-redaction-p4-021-0.4.0-dev.5

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the P4-021 branch
        uses: actions/checkout@v4
        with:
          ref: fix/comprehensive-secret-redaction-p4-021-0.4.0-dev.5
          fetch-depth: 0

      - name: Apply the exact Rust 1.97 Clippy correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("telemetry/daemon/src/main.rs")
          text = path.read_text()
          old = '''            query
                .backend
                .as_deref()
                .map_or(true, |backend| event.backend == backend)
'''
          new = '''            query
                .backend
                .as_deref()
                .is_none_or(|backend| event.backend == backend)
'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one P4-021 Clippy target, found {count}")
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          grep -F '.is_none_or(|backend| event.backend == backend)' telemetry/daemon/src/main.rs

      - name: Commit the source correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telemetry/daemon/src/main.rs
          git commit -m "fix(telemetry): satisfy Rust 1.97 clippy"
          git push origin HEAD:fix/comprehensive-secret-redaction-p4-021-0.4.0-dev.5
