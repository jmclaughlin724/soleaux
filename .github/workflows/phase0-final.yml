name: Soleaux Phase 0 final gate

on:
  push:
    branches:
      - native-wedge/0.4.0-dev.4
    paths:
      - UNIFIED-MCP-PROFILE.md
      - CONTEXT-PACKET-V2.md
      - contracts/phase0-identity.json
      - scripts/validate_phase0_contracts.py
      - scripts/apply_phase0_native_overlay.py
      - .ci/phase0-contracts.part-*
      - .ci/native-wedge-source.part-*
      - .ci/native-overrides/**
      - .ci/phase0-native-overrides/**
      - .github/workflows/phase0-final.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: soleaux-phase0-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Rust 1.97.1 exact Phase 0 gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v4

      - name: Validate Phase 0 contracts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf phase0-materialized native-wedge native-evidence
          mkdir -p phase0-materialized native-wedge native-evidence
          cat .ci/phase0-contracts.part-* | tr -d '\r\n' > /tmp/soleaux-phase0-contracts.tar.xz.b64
          test "$(wc -c < /tmp/soleaux-phase0-contracts.tar.xz.b64)" -eq 26360
          echo "ee4cfde3ce76b01737fa08498950af8288c9f3a585b72f452d2917d739e1e73a  /tmp/soleaux-phase0-contracts.tar.xz.b64" | sha256sum -c -
          base64 --decode /tmp/soleaux-phase0-contracts.tar.xz.b64 > /tmp/soleaux-phase0-contracts.tar.xz
          echo "6826368b15370b50f08e697e06ba9afb6b955455f2bb84cbd81088dc3bb2f564  /tmp/soleaux-phase0-contracts.tar.xz" | sha256sum -c -
          tar -xJf /tmp/soleaux-phase0-contracts.tar.xz -C phase0-materialized
          cmp contracts/phase0-identity.json phase0-materialized/contracts/phase0-identity.json
          python3 scripts/validate_phase0_contracts.py 2>&1 | tee native-evidence/phase0-contract-test.json

      - name: Materialize last green native base
        shell: bash
        run: |
          set -euo pipefail
          cat .ci/native-wedge-source.part-* | tr -d '\r\n' > /tmp/soleaux-native-base.tar.xz.b64
          test "$(wc -c < /tmp/soleaux-native-base.tar.xz.b64)" -eq 49336
          echo "c35307fd88284d43e991e4d98ae9ae569411e41afa17f29dc13a882204b1dbca  /tmp/soleaux-native-base.tar.xz.b64" | sha256sum -c -
          base64 --decode /tmp/soleaux-native-base.tar.xz.b64 > /tmp/soleaux-native-base.tar.xz
          echo "520b32d1223136b8a0dcaedd7b1438d3bb897c171b95884973e200ddf294dbfd  /tmp/soleaux-native-base.tar.xz" | sha256sum -c -
          tar -xJf /tmp/soleaux-native-base.tar.xz -C native-wedge
          if [ -d .ci/native-overrides/files ]; then
            cp -a .ci/native-overrides/files/. native-wedge/
          fi
          for patch_file in .ci/native-overrides/patches/*.patch; do
            patch -d native-wedge -p1 < "$patch_file"
          done

      - name: Apply binding Phase 0 overlay
        shell: bash
        run: |
          set -euo pipefail
          cp -a .ci/phase0-native-overrides/files/. native-wedge/
          python3 scripts/apply_phase0_native_overlay.py native-wedge | tee native-evidence/phase0-native-overlay.json
          cp UNIFIED-MCP-PROFILE.md CONTEXT-PACKET-V2.md native-wedge/
          mkdir -p native-wedge/contracts
          cp contracts/phase0-identity.json native-wedge/contracts/
          cp phase0-materialized/contracts/unified-mcp-profile-v2.json native-wedge/contracts/
          cp phase0-materialized/contracts/context-packet-v2.schema.json native-wedge/contracts/
          grep -q 'version = "0.4.0-dev.5"' native-wedge/Cargo.toml
          test -f native-wedge/daemon/mcp/src/profile.rs
          grep -q 'pub const HARD_CEILING: usize = 12;' native-wedge/daemon/mcp/src/profile.rs
          git rev-parse HEAD > native-evidence/git-head.txt
          find native-wedge -type f | sort > native-evidence/materialized-files.txt

      - name: Install native build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update 2>&1 | tee native-evidence/apt-update.txt
          sudo apt-get install -y --no-install-recommends clang cmake libclang-dev llvm-dev pkg-config protobuf-compiler 2>&1 | tee native-evidence/apt-install.txt

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native-wedge -> target

      - name: Record toolchain
        shell: bash
        run: |
          rustc --version --verbose | tee native-evidence/rustc-version.txt
          cargo --version --verbose | tee native-evidence/cargo-version.txt
          rustfmt --version | tee native-evidence/rustfmt-version.txt
          cargo clippy --version | tee native-evidence/clippy-version.txt

      - name: Generate lockfile
        working-directory: native-wedge
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile 2>&1 | tee ../native-evidence/cargo-generate-lockfile.txt
          cp Cargo.lock ../native-evidence/Cargo.lock

      - name: Format and verify
        working-directory: native-wedge
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all 2>&1 | tee ../native-evidence/cargo-fmt-apply.txt
          cargo fmt --all --check 2>&1 | tee ../native-evidence/cargo-fmt-check.txt

      - name: Check
        working-directory: native-wedge
        shell: bash
        run: cargo check --workspace --all-targets --all-features 2>&1 | tee ../native-evidence/cargo-check.txt

      - name: Clippy
        working-directory: native-wedge
        shell: bash
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings 2>&1 | tee ../native-evidence/cargo-clippy.txt

      - name: Test
        working-directory: native-wedge
        shell: bash
        run: cargo test --workspace --all-features 2>&1 | tee ../native-evidence/cargo-test.txt

      - name: Build release binaries
        working-directory: native-wedge
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --workspace --all-features 2>&1 | tee ../native-evidence/cargo-build-release.txt
          cp target/release/soleaux target/release/soleauxd ../native-evidence/

      - name: Binary smoke
        working-directory: native-wedge
        shell: bash
        run: |
          ./target/release/soleaux --help 2>&1 | tee ../native-evidence/soleaux-cli-help.txt
          ./target/release/soleauxd --help 2>&1 | tee ../native-evidence/soleauxd-help.txt

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Audit
        working-directory: native-wedge
        shell: bash
        run: cargo audit --deny warnings 2>&1 | tee ../native-evidence/cargo-audit.txt

      - name: Collect evidence
        if: always()
        shell: bash
        run: |
          set -u
          cp native-wedge/Cargo.lock native-evidence/Cargo.lock 2>/dev/null || true
          cargo metadata --manifest-path native-wedge/Cargo.toml --format-version 1 > native-evidence/cargo-metadata.json 2> native-evidence/cargo-metadata.err || true
          tar --exclude='./target' -cJf native-evidence/native-wedge-phase0-source.tar.xz -C native-wedge . 2> native-evidence/archive.err || true
          sha256sum native-evidence/* > native-evidence/SHA256SUMS 2>/dev/null || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soleaux-phase0-final-evidence
          path: native-evidence
          if-no-files-found: error
          retention-days: 14

      - name: Persist exact Phase 0 receipt
        if: always()
        continue-on-error: true
        shell: bash
        env:
          PHASE0_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          run_id = os.environ["GITHUB_RUN_ID"]
          repo = os.environ["GITHUB_REPOSITORY"]
          run_url = f"https://github.com/{repo}/actions/runs/{run_id}"
          receipt = {
              "schemaVersion": "soleaux.phase0.gate-receipt/v1",
              "sourceCommit": os.environ["GITHUB_SHA"],
              "runId": int(run_id),
              "runUrl": run_url,
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "jobStatus": os.environ["PHASE0_JOB_STATUS"],
              "artifactName": "soleaux-phase0-final-evidence",
              "artifactUrl": f"{run_url}#artifacts",
              "productVersion": "0.4.0-dev.5",
              "productionClaimAllowed": False,
          }
          Path("PHASE0-NATIVE-GATE-RECEIPT.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PHASE0-NATIVE-GATE-RECEIPT.json
          if ! git diff --cached --quiet; then
            git commit -m "Record exact Phase 0 native gate receipt"
            git push origin HEAD:native-wedge/0.4.0-dev.4
          fi
