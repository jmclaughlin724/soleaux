name: Format transcript audit validator

on:
  push:
    branches:
      - docs/transcript-gap-reconciliation-0.4.0-dev.5
    paths:
      - .github/workflows/format-transcript-audit-validator.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: format-transcript-audit-validator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/transcript-gap-reconciliation-0.4.0-dev.5
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - name: Apply the repository-locked Ruff formatter
        run: uv run --locked ruff format scripts/check_documentation_consistency.py
      - name: Commit the formatted validator and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-transcript-audit-validator.yml
          git add scripts/check_documentation_consistency.py
          git diff --cached --check
          git commit -m "docs: format the transcript audit consistency gate"
          git push origin HEAD:docs/transcript-gap-reconciliation-0.4.0-dev.5
