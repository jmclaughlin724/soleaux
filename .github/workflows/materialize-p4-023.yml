name: Materialize P4-023 truthful continuations source

on:
  push:
    branches:
      - fix/truthful-continuations-p4-023-0.4.0-dev.5
    paths:
      - .github/workflows/materialize-p4-023.yml

permissions:
  contents: write

concurrency:
  group: materialize-p4-023-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install native build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake libclang-dev llvm-dev pkg-config protobuf-compiler xz-utils

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Verify and apply reviewed source patch
        shell: bash
        run: |
          set -euo pipefail
          test -f native/daemon/mcp/src/cursor.rs
          test "$(wc -c < .ci/p4-023.patch.xz.b64)" = 17052
          echo '58d7d4659322f0696a17b25720da76ccded970ef01b08c5ee69d8c9269e7e0c1  .ci/p4-023.patch.xz.b64' | sha256sum -c -
          base64 --decode .ci/p4-023.patch.xz.b64 > /tmp/p4-023.patch.xz
          echo 'b21fe9dd4917a8686fd4c5a46389430f885b7df8de27fe990c194af7686f6de7  /tmp/p4-023.patch.xz' | sha256sum -c -
          xz -t /tmp/p4-023.patch.xz
          xz -dc /tmp/p4-023.patch.xz > /tmp/p4-023.patch
          echo 'd05e814a7dbd08df21c5b75375d91970ead0ffa8e3c545c63517989f4d832533  /tmp/p4-023.patch' | sha256sum -c -
          git apply --check /tmp/p4-023.patch
          git apply /tmp/p4-023.patch
          cargo fmt --manifest-path native/Cargo.toml --all
          grep -F 'continuation cursor snapshot is stale' native/daemon/mcp/src/cursor.rs
          grep -F 'search_continuation_is_real_disjoint_and_request_bound' native/daemon/mcp/src/lib.rs
          grep -F 'memory_pages_are_disjoint_and_cursor_is_request_bound' native/daemon/mcp/src/memory.rs
          grep -F 'pub fn workspace_snapshot_id' native/daemon/storage/src/lib.rs

      - name: Commit normal formatted source
        shell: bash
        run: |
          set -euo pipefail
          rm .ci/p4-023.patch.xz.b64
          rm .github/workflows/materialize-p4-023.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native .ci .github/workflows
          git diff --cached --check
          git commit -m 'fix(mcp): add truthful bounded continuations'
          git push origin HEAD:${{ github.ref_name }}

      - name: Compiler-guided validation of materialized source
        working-directory: native
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo check --workspace --all-targets --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test -p soleaux-mcp --all-features --locked

# Retry marker: include the new cursor module and use a valid focused Cargo invocation.
