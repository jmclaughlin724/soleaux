name: Repair P4-021 exact source

on:
  push:
    branches:
      - fix/comprehensive-secret-redaction-p4-021-0.4.0-dev.5
    paths:
      - telemetry/daemon/src/main.rs
      - .github/workflows/verify-p4-021-final.yml
      - .github/workflows/repair-p4-021-clippy.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-p4-021-${{ github.sha }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply and commit the exact Rust 1.97 Clippy correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("telemetry/daemon/src/main.rs")
          text = path.read_text(encoding="utf-8")
          old = '''            query
                .backend
                .as_deref()
                .map_or(true, |backend| event.backend == backend)
'''
          new = '''            query
                .backend
                .as_deref()
                .is_none_or(|backend| event.backend == backend)
'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one P4-021 Clippy target, found {count}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          git diff --check
          grep -F '.is_none_or(|backend| event.backend == backend)' telemetry/daemon/src/main.rs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telemetry/daemon/src/main.rs
          git commit -m "fix(telemetry): satisfy Rust 1.97 clippy"
          git push origin HEAD:fix/comprehensive-secret-redaction-p4-021-0.4.0-dev.5
