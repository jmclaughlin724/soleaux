# P5-001 fully-normalized validation trigger
name: Verify stable CLI and per-user daemon P4-014 P4-015

on:
  pull_request:
    branches:
      - main
    paths:
      - native/**
      - .github/workflows/verify-service-cli-p4-014-p4-015-final.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-service-cli-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  exact:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0

      - name: Install native build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake libclang-dev llvm-dev pkg-config protobuf-compiler \
            python3-jsonschema sqlite3

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - uses: taiki-e/install-action@cargo-audit

      - name: Verify exact source and locked product invariants
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          grep -F 'pub const IPC_SCHEMA_VERSION: &str = "soleaux.ipc/v1";' native/daemon/ipc/src/protocol.rs
          grep -F 'pub const SCHEMA_VERSION: i64 = 2;' native/daemon/state/src/database.rs
          grep -F 'pub const HARD_CEILING: usize = 12;' native/daemon/mcp/src/profile.rs
          grep -F 'pub const PRODUCTION_CLAIM_ALLOWED: bool = false;' native/daemon/mcp/src/profile.rs
          grep -F 'pub const PRODUCT_VERSION: &str = "0.4.0-dev.5";' native/daemon/mcp/src/profile.rs
          echo '89a2b783c4bd9c0ae834a5894dceb2c4abcaa8050dd0f57ed967a9c57e3a60fc  native/contracts/unified-mcp-profile-v2.json' | sha256sum -c -
          echo '3bbb53e84b0624f2a1de26bad7f2031b6a7cf0f7e892262d584347bd54b6003f  native/contracts/context-packet-v2.schema.json' | sha256sum -c -

      - name: Run complete native, CLI, IPC, and registry gate
        working-directory: native
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo check --workspace --all-targets --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked
          cargo build --release --workspace --all-features --locked
          python3 scripts/phase1_mcp_smoke.py target/release/soleaux . /tmp/phase1.json
          python3 scripts/phase2_capability_smoke.py \
            target/release/soleaux target/release/soleauxd . /tmp/phase2.json
          python3 scripts/p5_registry_smoke.py \
            target/release/soleaux target/release/soleauxd . /tmp/p5-registry.json
          cargo audit --deny warnings

      - name: Execute clean-home service lifecycle and schema-2 recovery smoke
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/soleaux-service-smoke"
          HOME_DIR="$ROOT/home"
          STATE_HOME="$ROOT/state"
          RUNTIME="$ROOT/runtime"
          CONFIG="$ROOT/config"
          BIN="$ROOT/bin"
          EVIDENCE="$ROOT/evidence"
          rm -rf "$ROOT"
          mkdir -p "$HOME_DIR" "$STATE_HOME" "$RUNTIME" "$CONFIG" "$BIN" "$EVIDENCE"
          export HOME="$HOME_DIR"
          export XDG_CONFIG_HOME="$CONFIG"
          export XDG_RUNTIME_DIR="$RUNTIME"
          export SOLEAUX_HOME="$STATE_HOME"
          export SOLEAUX_RUNTIME_DIR="$RUNTIME/soleaux"
          export SOLEAUX_INSTALL_BIN="$BIN"
          ENDPOINT="$SOLEAUX_RUNTIME_DIR/soleaux.sock"
          STATE_DB="$SOLEAUX_HOME/state/canonical.sqlite3"

          native/target/release/soleauxd ipc \
            --endpoint "$ENDPOINT" --state-db "$STATE_DB" \
            >"$EVIDENCE/daemon.stdout" 2>"$EVIDENCE/daemon.stderr" &
          DAEMON_PID=$!
          trap 'kill "$DAEMON_PID" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import os, pathlib, time
          endpoint = pathlib.Path(os.environ['SOLEAUX_RUNTIME_DIR']) / 'soleaux.sock'
          for _ in range(500):
              if endpoint.exists():
                  break
              time.sleep(0.01)
          else:
              raise SystemExit('daemon endpoint did not appear')
          PY

          native/target/release/soleaux service status > "$EVIDENCE/status.json"
          native/target/release/soleaux backup "$EVIDENCE/canonical.backup.sqlite3" > "$EVIDENCE/backup.json"
          native/target/release/soleaux export "$EVIDENCE/canonical.export.json" > "$EVIDENCE/export.json"
          native/target/release/soleaux repair > "$EVIDENCE/repair.json"
          native/target/release/soleaux service stop > "$EVIDENCE/stop.json"
          wait "$DAEMON_PID"
          trap - EXIT
          test ! -e "$ENDPOINT"

          native/target/release/soleaux restore "$EVIDENCE/canonical.backup.sqlite3" > "$EVIDENCE/restore.json"
          native/target/release/soleaux install \
            --cli native/target/release/soleaux \
            --daemon native/target/release/soleauxd \
            --no-start > "$EVIDENCE/install.json"
          test -x "$BIN/soleaux"
          test -x "$BIN/soleauxd"
          test -f "$CONFIG/systemd/user/soleaux.service"

          python3 - <<'PY'
          import json, os, pathlib, sqlite3
          root = pathlib.Path(os.environ['SOLEAUX_HOME']).parent / 'evidence'
          status = json.loads((root / 'status.json').read_text())
          backup = json.loads((root / 'backup.json').read_text())
          repair = json.loads((root / 'repair.json').read_text())
          install = json.loads((root / 'install.json').read_text())
          assert status['running'] is True
          assert backup['schemaVersion'] == 2
          assert repair['integrity'] == 'ok'
          assert repair['foreignKeyViolations'] == 0
          assert repair['auditChainValid'] is True
          assert install['productionClaimAllowed'] is False
          database = root / 'canonical.backup.sqlite3'
          connection = sqlite3.connect(f'file:{database}?mode=ro', uri=True)
          integrity = connection.execute('PRAGMA integrity_check').fetchone()[0]
          schema = connection.execute('PRAGMA user_version').fetchone()[0]
          connection.close()
          assert integrity == 'ok'
          assert schema == 2
          PY
