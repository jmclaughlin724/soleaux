name: Verify stable CLI and per-user daemon P4-014 P4-015

on:
  pull_request:
    branches:
      - main
    paths:
      - native/**
      - .github/workflows/verify-service-cli-p4-014-p4-015-final.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-service-cli-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  exact:
    runs-on: ubuntu-24.04
    timeout-minutes: 135
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0

      - name: Install native build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake libclang-dev llvm-dev pkg-config protobuf-compiler python3-jsonschema sqlite3 xz-utils

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Verify exact source, typed local IPC, CLI surface, and product invariants
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test ! -e .ci/apply-service-cli-p4-014-p4-015.py
          test ! -e .github/workflows/apply-service-cli-main.yml
          test ! -e .github/workflows/cleanup-service-cli-main.yml
          grep -F '"daemon/ipc"' native/Cargo.toml
          grep -F 'pub const IPC_SCHEMA_VERSION: &str = "soleaux.ipc/v1";' native/daemon/ipc/src/protocol.rs
          grep -F 'deny_unknown_fields' native/daemon/ipc/src/protocol.rs
          grep -F 'peer_cred()' native/daemon/ipc/src/unix.rs
          grep -F 'rustix::process::geteuid()' native/daemon/ipc/src/unix.rs
          grep -F 'Permissions::from_mode(0o600)' native/daemon/ipc/src/unix.rs
          grep -F 'JoinSet::new()' native/daemon/ipc/src/unix.rs
          grep -F 'state restore is an offline operation' native/daemon/ipc/src/server.rs
          grep -F 'NoNewPrivileges=true' native/daemon/ipc/src/service.rs
          grep -F 'PrivateTmp=true' native/daemon/ipc/src/service.rs
          grep -F 'ProtectSystem=strict' native/daemon/ipc/src/service.rs
          grep -F 'Command::Ipc' native/daemon/engine/src/main.rs
          grep -F 'SoleauxCommand::Install' native/apps/cli/src/main.rs
          grep -F 'SoleauxCommand::Service' native/apps/cli/src/main.rs
          grep -F 'SoleauxCommand::Cache' native/apps/cli/src/main.rs
          grep -F 'SoleauxCommand::Integrate' native/apps/cli/src/main.rs
          grep -F 'SoleauxCommand::Handoff' native/apps/cli/src/main.rs
          grep -F 'SoleauxCommand::Backup' native/apps/cli/src/main.rs
          grep -F 'SoleauxCommand::Restore' native/apps/cli/src/main.rs
          grep -F 'SoleauxCommand::Export' native/apps/cli/src/main.rs
          grep -F 'SoleauxCommand::Repair' native/apps/cli/src/main.rs
          grep -F 'SoleauxCommand::Uninstall' native/apps/cli/src/main.rs
          grep -F 'same_user_ipc_supports_concurrent_clients_state_operations_and_shutdown' native/daemon/ipc/src/tests.rs
          grep -F 'pub const HARD_CEILING: usize = 12;' native/daemon/mcp/src/profile.rs
          grep -F 'pub const PRODUCTION_CLAIM_ALLOWED: bool = false;' native/daemon/mcp/src/profile.rs
          grep -F 'pub const PRODUCT_VERSION: &str = "0.4.0-dev.5";' native/daemon/mcp/src/profile.rs
          echo '89a2b783c4bd9c0ae834a5894dceb2c4abcaa8050dd0f57ed967a9c57e3a60fc  native/contracts/unified-mcp-profile-v2.json' | sha256sum -c -
          echo '3bbb53e84b0624f2a1de26bad7f2031b6a7cf0f7e892262d584347bd54b6003f  native/contracts/context-packet-v2.schema.json' | sha256sum -c -

      - name: Complete IPC, service, CLI, canonical state, and native regression gate
        working-directory: native
        run: |
          set -euo pipefail
          mkdir -p ../evidence
          cargo fmt --all --check
          cargo check --workspace --all-targets --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test -p soleaux-ipc --all-features --locked | tee ../evidence/ipc-tests.txt
          cargo test -p soleaux-state --all-features --locked | tee ../evidence/canonical-state-tests.txt
          cargo test --workspace --all-features --locked | tee ../evidence/native-workspace-tests.txt
          cargo build --release --workspace --all-features --locked
          ./target/release/soleaux --version | tee ../evidence/soleaux-version.txt
          ./target/release/soleauxd --version | tee ../evidence/soleauxd-version.txt
          ./target/release/soleaux --help | tee ../evidence/soleaux-help.txt
          ./target/release/soleauxd --help | tee ../evidence/soleauxd-help.txt
          python3 scripts/phase1_mcp_smoke.py \
            target/release/soleaux . ../evidence/phase1-mcp-smoke.json
          python3 scripts/phase2_capability_smoke.py \
            target/release/soleaux target/release/soleauxd . ../evidence/phase2-capability-smoke.json
          cp target/release/soleaux ../evidence/soleaux
          cp target/release/soleauxd ../evidence/soleauxd
          if ! command -v cargo-audit >/dev/null 2>&1; then
            cargo install cargo-audit --locked
          fi
          cargo audit --deny warnings | tee ../evidence/cargo-audit.txt

      - name: Execute clean-home daemon, concurrent IPC, operations, and installation smoke
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/soleaux-service-smoke"
          HOME_DIR="$ROOT/user-home"
          STATE_HOME="$ROOT/state-home"
          RUNTIME="$ROOT/runtime"
          BIN="$ROOT/bin"
          CONFIG="$ROOT/config"
          EVIDENCE="$GITHUB_WORKSPACE/evidence/service-smoke"
          rm -rf "$ROOT" "$EVIDENCE"
          mkdir -p "$HOME_DIR" "$STATE_HOME" "$RUNTIME" "$BIN" "$CONFIG" "$EVIDENCE"
          export HOME="$HOME_DIR"
          export XDG_CONFIG_HOME="$CONFIG"
          export XDG_RUNTIME_DIR="$RUNTIME"
          export SOLEAUX_HOME="$STATE_HOME"
          export SOLEAUX_RUNTIME_DIR="$RUNTIME/soleaux"
          export SOLEAUX_INSTALL_BIN="$BIN"
          ENDPOINT="$SOLEAUX_RUNTIME_DIR/soleaux.sock"
          STATE_DB="$SOLEAUX_HOME/state/canonical.sqlite3"

          native/target/release/soleauxd ipc --endpoint "$ENDPOINT" --state-db "$STATE_DB" \
            >"$EVIDENCE/daemon.stdout" 2>"$EVIDENCE/daemon.stderr" &
          DAEMON_PID=$!
          trap 'kill "$DAEMON_PID" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import os, pathlib, time
          endpoint = pathlib.Path(os.environ['SOLEAUX_RUNTIME_DIR']) / 'soleaux.sock'
          for _ in range(500):
              if endpoint.exists():
                  break
              time.sleep(0.01)
          else:
              raise SystemExit('daemon endpoint did not appear')
          PY

          native/target/release/soleaux service status | tee "$EVIDENCE/service-status.json"
          native/target/release/soleaux cache status | tee "$EVIDENCE/cache-status.json"
          native/target/release/soleaux backup "$EVIDENCE/canonical.backup.sqlite3" \
            | tee "$EVIDENCE/backup.json"
          native/target/release/soleaux export "$EVIDENCE/canonical.export.json" \
            | tee "$EVIDENCE/export.json"
          native/target/release/soleaux repair | tee "$EVIDENCE/repair.json"

          python3 - <<'PY' | tee "$EVIDENCE/concurrent-ipc.json"
          from __future__ import annotations
          import json, os, pathlib, socket, threading, uuid

          endpoint = str(pathlib.Path(os.environ['SOLEAUX_RUNTIME_DIR']) / 'soleaux.sock')
          results = []
          errors = []
          lock = threading.Lock()
          barrier = threading.Barrier(16)
          def worker(index: int) -> None:
              request_id = str(uuid.uuid4())
              request = {
                  'schemaVersion':'soleaux.ipc/v1',
                  'requestId':request_id,
                  'method':{'name':'ping'},
              }
              try:
                  barrier.wait()
                  with socket.socket(socket.AF_UNIX, socket.SOCK_STREAM) as client:
                      client.connect(endpoint)
                      client.sendall(json.dumps(request, separators=(',',':')).encode() + b'\n')
                      data = b''
                      while not data.endswith(b'\n'):
                          chunk = client.recv(65536)
                          if not chunk:
                              break
                          data += chunk
                  response = json.loads(data)
                  assert response['schemaVersion'] == 'soleaux.ipc/v1'
                  assert response['requestId'] == request_id
                  assert response['status'] == 'ok'
                  assert response['result']['pong'] is True
                  with lock: results.append(index)
              except BaseException as error:
                  with lock: errors.append(repr(error))
          threads = [threading.Thread(target=worker,args=(index,)) for index in range(16)]
          for thread in threads: thread.start()
          for thread in threads: thread.join()
          assert not errors, errors
          assert sorted(results) == list(range(16))
          print(json.dumps({
              'schemaVersion':'soleaux.concurrent-ipc-smoke/v1',
              'clients':len(results),
              'sameUserSocket':True,
              'allSucceeded':True,
              'status':'pass',
          }, indent=2, sort_keys=True))
          PY

          set +e
          native/target/release/soleaux restore "$EVIDENCE/canonical.backup.sqlite3" \
            >"$EVIDENCE/online-restore.stdout" 2>"$EVIDENCE/online-restore.stderr"
          RESTORE_CODE=$?
          set -e
          test "$RESTORE_CODE" -ne 0
          grep -F 'stop the Soleaux service before restoring canonical state' \
            "$EVIDENCE/online-restore.stderr"

          native/target/release/soleaux service stop | tee "$EVIDENCE/service-stop.json"
          wait "$DAEMON_PID"
          trap - EXIT
          test ! -e "$ENDPOINT"
          test ! -e "$SOLEAUX_RUNTIME_DIR/soleauxd.pid"

          native/target/release/soleaux restore "$EVIDENCE/canonical.backup.sqlite3" \
            | tee "$EVIDENCE/offline-restore.json"
          native/target/release/soleaux install \
            --cli native/target/release/soleaux \
            --daemon native/target/release/soleauxd \
            --no-start | tee "$EVIDENCE/install.json"
          test -x "$BIN/soleaux"
          test -x "$BIN/soleauxd"
          test -f "$CONFIG/systemd/user/soleaux.service"
          grep -F 'NoNewPrivileges=true' "$CONFIG/systemd/user/soleaux.service"
          grep -F 'PrivateTmp=true' "$CONFIG/systemd/user/soleaux.service"
          grep -F 'ProtectSystem=strict' "$CONFIG/systemd/user/soleaux.service"
          grep -F 'UMask=0077' "$CONFIG/systemd/user/soleaux.service"

          python3 - <<'PY' | tee "$EVIDENCE/service-operations-summary.json"
          import hashlib, json, os, pathlib, sqlite3
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'evidence' / 'service-smoke'
          status = json.loads((root/'service-status.json').read_text())
          backup = json.loads((root/'backup.json').read_text())
          export = json.loads((root/'export.json').read_text())
          repair = json.loads((root/'repair.json').read_text())
          install = json.loads((root/'install.json').read_text())
          assert status['running'] is True
          assert status['installed'] is False
          assert status['detail'] == 'daemon responded to authenticated local IPC'
          assert backup['schemaVersion'] == 1
          assert export['schemaVersion'] == 'soleaux.state-export/v1'
          assert repair['integrity'] == 'ok'
          assert repair['foreignKeyViolations'] == 0
          assert repair['auditChainValid'] is True
          assert install['serviceInstalled'] is True
          assert install['serviceStarted'] is False
          assert install['productionClaimAllowed'] is False
          database = root/'canonical.backup.sqlite3'
          connection = sqlite3.connect(f'file:{database}?mode=ro', uri=True)
          integrity = connection.execute('PRAGMA integrity_check').fetchone()[0]
          schema = connection.execute('PRAGMA user_version').fetchone()[0]
          connection.close()
          assert integrity == 'ok' and schema == 1
          result = {
              'schemaVersion':'soleaux.service-cli-smoke/v1',
              'sameUserPeerCredentialCheck':True,
              'concurrentClients':16,
              'onlineRestoreRejected':True,
              'offlineRestorePassed':True,
              'gracefulShutdownRemovedEndpoint':True,
              'backupSha256':hashlib.sha256(database.read_bytes()).hexdigest(),
              'stateSchemaVersion':schema,
              'serviceManifestHardened':True,
              'productionClaimAllowed':False,
              'status':'pass',
          }
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: Validate repository documentation
        run: python3 scripts/check_documentation_consistency.py

      - name: Write exact-head receipt and checksummed evidence
        run: |
          set -euo pipefail
          mkdir -p evidence
          printf '%s\n' "$SOURCE_COMMIT" > evidence/SOURCE_COMMIT
          printf '%s\n' "$GITHUB_RUN_ID" > evidence/WORKFLOW_RUN_ID
          sha256sum native/contracts/unified-mcp-profile-v2.json > evidence/PROFILE-CONTRACT-SHA256.txt
          sha256sum native/contracts/context-packet-v2.schema.json > evidence/CONTEXT-CONTRACT-SHA256.txt
          git archive --format=tar "$SOURCE_COMMIT" | xz -T0 -9 > evidence/soleaux-service-cli-source.tar.xz
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          receipt = {
              'schemaVersion':'soleaux.phase4-task-receipt/v1',
              'tasks':['P4-014','P4-015'],
              'sourceCommit':os.environ['SOURCE_COMMIT'],
              'workflowRunId':int(os.environ['GITHUB_RUN_ID']),
              'conclusion':'success',
              'version':'0.4.0-dev.5',
              'productionClaimAllowed':False,
              'publicToolCeiling':12,
              'ipcSchema':'soleaux.ipc/v1',
              'daemonOwnsCanonicalState':True,
              'sameUserPeerCredentialCheck':True,
              'socketMode':'0600',
              'runtimeDirectoryMode':'0700',
              'concurrentClients':True,
              'offlineRestoreOnly':True,
              'perUserServiceManifests':['launchd','systemd-user','Windows Task Scheduler'],
              'stableCliOperations':['serve','install','service','doctor','ci','cache','index','integrate','handoff','backup','restore','export','repair','uninstall'],
              'lockedContracts':{
                  'unifiedMcpProfileSha256':'89a2b783c4bd9c0ae834a5894dceb2c4abcaa8050dd0f57ed967a9c57e3a60fc',
                  'contextPacketV2Sha256':'3bbb53e84b0624f2a1de26bad7f2031b6a7cf0f7e892262d584347bd54b6003f',
              },
          }
          Path('evidence/P4-014-P4-015-NATIVE-GATE-RECEIPT.json').write_text(
              json.dumps(receipt,indent=2,sort_keys=True)+'\n',encoding='utf-8'
          )
          PY
          (
            cd evidence
            find . -type f ! -name SHA256SUMS -printf '%P\0' \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - uses: actions/upload-artifact@v4
        with:
          name: soleaux-service-cli-${{ env.SOURCE_COMMIT }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
