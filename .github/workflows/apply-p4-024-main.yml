name: Apply proven P4-024 source to current mainline

on:
  push:
    branches:
      - fix/typed-postgres-validation-p4-024-main-0.4.0-dev.5
    paths:
      - .github/workflows/apply-p4-024-main.yml

permissions:
  contents: write

concurrency:
  group: apply-p4-024-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install native build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake libclang-dev llvm-dev pkg-config protobuf-compiler

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Apply the compiler-proven P4-024 Rust delta
        run: |
          set -euo pipefail
          git diff 41ef2288a1bf84f35f7542bb7e7ca1df051d60e7 af5eac128dae01003075d35273d444a3fad82fb9 -- \
            native/daemon/intelligence/src/lib.rs \
            native/daemon/mcp/src/lib.rs \
            | git apply --3way
          cargo fmt --manifest-path native/Cargo.toml --all
          git diff --check

      - name: Validate focused and complete native behavior
        working-directory: native
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo check --workspace --all-targets --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test -p soleaux-intelligence --all-features --locked postgres_analysis
          cargo test -p soleaux-mcp --all-features --locked postgres_sql
          cargo test -p soleaux-mcp --all-features --locked explicit_substitution
          cargo test --workspace --all-features --locked

      - name: Commit validated normal source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/daemon/intelligence/src/lib.rs native/daemon/mcp/src/lib.rs
          git diff --cached --check
          git commit -m 'fix(sql): return invalid PostgreSQL as typed validation data'
          git push origin HEAD:${{ github.ref_name }}
