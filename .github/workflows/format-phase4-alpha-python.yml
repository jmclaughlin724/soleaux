name: Format Phase 4 alpha Python sources

on:
  push:
    branches:
      - release/phase4-unsigned-alpha-main-0.4.0-dev.5
    paths:
      - .github/workflows/format-phase4-alpha-python.yml

permissions:
  contents: write

concurrency:
  group: format-phase4-alpha-python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7

      - name: Apply the repository formatter
        run: |
          set -euo pipefail
          uv sync --locked
          uv run --locked ruff check --fix scripts/build_unsigned_alpha.py scripts/smoke_unsigned_alpha.py
          uv run --locked ruff format scripts/build_unsigned_alpha.py scripts/smoke_unsigned_alpha.py
          uv run --locked ruff check scripts/build_unsigned_alpha.py scripts/smoke_unsigned_alpha.py
          uv run --locked ruff format --check scripts/build_unsigned_alpha.py scripts/smoke_unsigned_alpha.py
          python3 -m py_compile scripts/build_unsigned_alpha.py scripts/smoke_unsigned_alpha.py

      - name: Commit formatted permanent source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/build_unsigned_alpha.py scripts/smoke_unsigned_alpha.py
          if git diff --cached --quiet; then
            echo 'Sources were already formatted.'
            exit 0
          fi
          git diff --cached --check
          git commit -m 'style(alpha): format release packaging sources'
          git push origin HEAD:${{ github.ref_name }}
