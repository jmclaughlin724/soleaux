name: Soleaux documentation consistency

on:
  pull_request:
    paths:
      - README.md
      - PROJECT-STATUS.md
      - PROJECT-STATUS.json
      - ROADMAP.md
      - TASKS.md
      - HANDOFF.md
      - AGENTS.md
      - CHANGELOG.md
      - RELEASE-CHECKLIST.md
      - PHASE4-ALPHA-CLOSURE-RECEIPT.json
      - PHASE4-INDEPENDENT-VERIFICATION.json
      - PHASE4-CLOSURE-RECEIPT.json
      - docs/**
      - scripts/check_documentation_consistency.py
      - .github/workflows/documentation-consistency.yml
  push:
    branches:
      - main
    paths:
      - README.md
      - PROJECT-STATUS.md
      - PROJECT-STATUS.json
      - ROADMAP.md
      - TASKS.md
      - HANDOFF.md
      - AGENTS.md
      - CHANGELOG.md
      - RELEASE-CHECKLIST.md
      - PHASE4-ALPHA-CLOSURE-RECEIPT.json
      - PHASE4-INDEPENDENT-VERIFICATION.json
      - PHASE4-CLOSURE-RECEIPT.json
      - docs/**
      - scripts/check_documentation_consistency.py
      - .github/workflows/documentation-consistency.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consistency:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate documentation authority and claims
        run: python3 scripts/check_documentation_consistency.py

      - name: Build validated documentation package
        shell: bash
        env:
          PACKAGE_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          rm -rf documentation-package
          mkdir -p documentation-package/soleaux-documentation
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path

          root = Path.cwd()
          destination = root / "documentation-package" / "soleaux-documentation"
          manifest = json.loads(
              (root / "docs" / "DOCUMENTATION-MANIFEST.json").read_text(encoding="utf-8")
          )
          files = set(manifest["required"])
          files.update(
              {
                  "docs/DOCUMENTATION-MANIFEST.json",
                  "PHASE0-NATIVE-GATE-RECEIPT.json",
                  "PHASE1-NATIVE-GATE-RECEIPT.json",
                  "PHASE2-NATIVE-GATE-RECEIPT.json",
                  "PHASE2-CLOSURE-RECEIPT.json",
                  "PHASE2-INDEPENDENT-VERIFICATION.json",
                  "PHASE4-ALPHA-CLOSURE-RECEIPT.json",
                  "PHASE4-INDEPENDENT-VERIFICATION.json",
                  "PHASE4-CLOSURE-RECEIPT.json",
                  "docs/operations/BRANCH-CONSOLIDATION-2026-08-05.json",
                  "scripts/check_documentation_consistency.py",
                  ".github/workflows/documentation-consistency.yml",
                  ".github/pull_request_template.md",
              }
          )

          inventory = []
          for relative in sorted(files):
              source = root / relative
              if not source.is_file():
                  raise SystemExit(f"documentation package source missing: {relative}")
              target = destination / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target)
              inventory.append(
                  {
                      "path": relative,
                      "bytes": source.stat().st_size,
                      "sha256": hashlib.sha256(source.read_bytes()).hexdigest(),
                  }
              )

          package_manifest = {
              "schemaVersion": "soleaux.documentation-package/v2",
              "sourceCommit": os.environ["PACKAGE_SOURCE_COMMIT"],
              "version": "0.4.0-dev.5",
              "currentPhase": 5,
              "phase3Status": "deferred_reconciliation_required",
              "phase4Status": "closed",
              "phase5Status": "in_progress",
              "productionClaimAllowed": False,
              "publicToolCeiling": 12,
              "phase4Evidence": {
                  "sourceCommit": "34c394efd01c9bb5348ba38e505317e6ca4da190",
                  "mergeCommit": "f450c1a9cd2cd74d366324b5e2031e4751fb5942",
                  "workflowRunId": 31026328918,
                  "artifactId": 8939137324,
                  "artifactSha256": (
                      "9917b2dd8335b2d17cdb3f0dc15191699ec7f0d1ff431f9e3b2135e0a1f4684b"
                  ),
              },
              "lockedContracts": {
                  "unifiedMcpProfilePath": (
                      "native/contracts/unified-mcp-profile-v2.json"
                  ),
                  "unifiedMcpProfileSha256": (
                      "89a2b783c4bd9c0ae834a5894dceb2c4abcaa8050dd0f57ed967a9c57e3a60fc"
                  ),
                  "contextPacketV2Path": (
                      "native/contracts/context-packet-v2.schema.json"
                  ),
                  "contextPacketV2Sha256": (
                      "3bbb53e84b0624f2a1de26bad7f2031b6a7cf0f7e892262d584347bd54b6003f"
                  ),
              },
              "files": inventory,
          }
          (destination / "DOCUMENTATION-PACKAGE-MANIFEST.json").write_text(
              json.dumps(package_manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          (
            cd documentation-package
            zip -qr soleaux-unified-documentation-system-0.4.0-dev.5.zip soleaux-documentation
            sha256sum soleaux-unified-documentation-system-0.4.0-dev.5.zip \
              > SHA256SUMS
          )

      - name: Upload validated documentation package
        uses: actions/upload-artifact@v4
        with:
          name: soleaux-unified-documentation-system
          path: |
            documentation-package/soleaux-unified-documentation-system-0.4.0-dev.5.zip
            documentation-package/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
