name: Apply P5-001 closure documentation

on:
  push:
    branches:
      - docs/p5-001-closure
    paths:
      - .ci/p5-001-docs-sync.py
      - .github/workflows/apply-p5-001-docs.yml

permissions:
  contents: write

concurrency:
  group: apply-p5-001-docs
  cancel-in-progress: true

jobs:
  converge:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Verify exact Phase 5 implementation lineage
        run: |
          set -euo pipefail
          git merge-base --is-ancestor f231b86f581b7f3d5d081ed4b8d235a72758342a HEAD
          test "$(git rev-parse f231b86f581b7f3d5d081ed4b8d235a72758342a^{tree})" = \
               "$(git rev-parse HEAD~1^{tree})"

      - name: Apply the authoritative P5-001 closure convergence
        run: |
          set -euo pipefail
          python3 -m py_compile .ci/p5-001-docs-sync.py
          python3 .ci/p5-001-docs-sync.py
          python3 - <<'PY'
          import json
          from pathlib import Path

          for path in (
              'PROJECT-STATUS.json',
              'P5-001-CLOSURE-RECEIPT.json',
              'docs/DOCUMENTATION-MANIFEST.json',
              'docs/audits/TRANSCRIPT-GAP-REGISTRY.json',
          ):
              json.loads(Path(path).read_text(encoding='utf-8'))
          PY
          python3 scripts/check_documentation_consistency.py
          git diff --check

      - name: Commit only validated normal documentation source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm .ci/p5-001-docs-sync.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git commit -m 'docs: close P5-001 and advance to P5-002'
          mkdir -p /tmp/p5-docs-evidence
          git rev-parse HEAD > /tmp/p5-docs-evidence/SOURCE_COMMIT
          git diff-tree --no-commit-id --name-status -r HEAD \
            > /tmp/p5-docs-evidence/changed-files.txt
          cp P5-001-CLOSURE-RECEIPT.json /tmp/p5-docs-evidence/
          cp PROJECT-STATUS.json /tmp/p5-docs-evidence/
          python3 scripts/check_documentation_consistency.py \
            > /tmp/p5-docs-evidence/documentation-consistency.txt
          git push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${GITHUB_REF_NAME}"

      - name: Upload closure documentation evidence
        uses: actions/upload-artifact@v4
        with:
          name: soleaux-p5-001-docs-${{ github.run_id }}
          path: /tmp/p5-docs-evidence
          if-no-files-found: error
          retention-days: 30
