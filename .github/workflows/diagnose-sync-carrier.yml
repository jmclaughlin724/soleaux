name: Diagnose Phase 4 documentation carrier

on:
  push:
    branches:
      - docs/phase4-closure-phase5-activation-0.4.0-dev.5
    paths:
      - .github/workflows/diagnose-sync-carrier.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Print carrier sizes and checksums
        run: |
          set -euo pipefail
          wc -c .ci/sync-phase4-docs.part*
          sha256sum .ci/sync-phase4-docs.part*
          cat .ci/sync-phase4-docs.part* > /tmp/sync.b64
          wc -c /tmp/sync.b64
          sha256sum /tmp/sync.b64
