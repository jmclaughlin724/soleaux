name: Apply robust Phase 4 alpha Python normalization

on:
  push:
    branches:
      - release/phase4-unsigned-alpha-main-0.4.0-dev.5
    paths:
      - .github/workflows/repair-phase4-alpha-python-v2.yml

permissions:
  contents: write

concurrency:
  group: repair-phase4-alpha-python-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7

      - name: Normalize and verify alpha Python sources
        run: |
          set -euo pipefail
          python3 .ci/format-phase4-alpha-v2.py
          rm -f .ci/repair-alpha-workflow.py
          uv sync --locked
          uv run --locked ruff check --fix scripts/build_unsigned_alpha.py scripts/smoke_unsigned_alpha.py
          uv run --locked ruff format scripts/build_unsigned_alpha.py scripts/smoke_unsigned_alpha.py
          uv run --locked ruff check scripts/build_unsigned_alpha.py scripts/smoke_unsigned_alpha.py
          uv run --locked ruff format --check scripts/build_unsigned_alpha.py scripts/smoke_unsigned_alpha.py
          python3 -m py_compile scripts/build_unsigned_alpha.py scripts/smoke_unsigned_alpha.py

      - name: Commit normal source
        run: |
          set -euo pipefail
          rm -f .ci/format-phase4-alpha-v2.py
          rm -f .github/workflows/repair-phase4-alpha-python.yml
          rm -f .github/workflows/repair-phase4-alpha-python-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(alpha): normalize release packaging sources'
          git push origin HEAD:${{ github.ref_name }}
