name: Apply final PR38 fail-closed remediation

on:
  push:
    branches:
      - automation/pr38-remediation-final
    paths:
      - .ci/pr38-remediation.part00
      - .ci/pr38-remediation.part01
      - .ci/pr38-remediation.part02
      - .ci/pr38-remediation.tail
      - .github/workflows/apply-pr38-final-remediation.yml

permissions:
  contents: write

env:
  TARGET_BRANCH: agent/p5-002-p5-006-client-capability-matrices
  EXPECTED_TARGET: 42d2b7808182ac0da9a478d395f00f3a2c55f4a8
  CARRIER_SHA256: 114dc26a7f1294f9b16a18b9b0c83eb47b9154569e53c4e5060bb75874f87666
  GZIP_SHA256: 92dc1eeb49d307b1a2da4a955bf884d6c7df35e1e2dc66d81349fbb050bd6842
  SCRIPT_SHA256: e7e6b6bcef55fcb8cf671be48835b004cdfb8267319a18c99f9c0c3e2c2a89cb

concurrency:
  group: apply-pr38-final-remediation
  cancel-in-progress: true

jobs:
  remediate:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Verify the exact target branch
        run: |
          set -euo pipefail
          git fetch origin "${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "${EXPECTED_TARGET}"
          mkdir -p /tmp/pr38-evidence
          printf '%s\n' "${EXPECTED_TARGET}" > /tmp/pr38-evidence/BASE_COMMIT

      - name: Install native prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake libclang-dev llvm-dev pkg-config protobuf-compiler python3-jsonschema

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - uses: taiki-e/install-action@cargo-audit

      - uses: astral-sh/setup-uv@v7

      - name: Reconstruct and apply the checksummed remediation
        run: |
          set -euo pipefail
          cat \
            .ci/pr38-remediation.part00 \
            .ci/pr38-remediation.part01 \
            .ci/pr38-remediation.part02 \
            .ci/pr38-remediation.tail \
            > /tmp/pr38-remediation.py.gz.b64
          echo "${CARRIER_SHA256}  /tmp/pr38-remediation.py.gz.b64" | sha256sum -c -
          base64 -d /tmp/pr38-remediation.py.gz.b64 > /tmp/pr38-remediation.py.gz
          echo "${GZIP_SHA256}  /tmp/pr38-remediation.py.gz" | sha256sum -c -
          gzip -dc /tmp/pr38-remediation.py.gz > /tmp/pr38-remediation.py
          echo "${SCRIPT_SHA256}  /tmp/pr38-remediation.py" | sha256sum -c -
          python3 -m py_compile /tmp/pr38-remediation.py
          python3 /tmp/pr38-remediation.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/test_client_capability_matrix.py')
          text = path.read_text(encoding='utf-8')
          old = 'assert "observed=12.1.223" in result.stderr'
          new = 'assert "observed=12.1.2230" in result.stderr'
          if text.count(old) != 1:
              raise SystemExit('exact-version regression assertion drifted')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          sha256sum \
            /tmp/pr38-remediation.py.gz.b64 \
            /tmp/pr38-remediation.py.gz \
            /tmp/pr38-remediation.py \
            > /tmp/pr38-evidence/REMEDIATION-SHA256SUMS

      - name: Run matrix and Python contract gates
        run: |
          set -euo pipefail
          uv sync --locked
          uv run --locked ruff check --fix \
            native/scripts/validate_client_capability_matrix.py \
            native/scripts/probe_client_capabilities.py \
            native/scripts/p5_client_matrix_smoke.py \
            tests/test_client_capability_matrix.py
          uv run --locked ruff format \
            native/scripts/validate_client_capability_matrix.py \
            native/scripts/probe_client_capabilities.py \
            native/scripts/p5_client_matrix_smoke.py \
            tests/test_client_capability_matrix.py
          uv run --locked ruff check \
            native/scripts/validate_client_capability_matrix.py \
            native/scripts/probe_client_capabilities.py \
            native/scripts/p5_client_matrix_smoke.py \
            tests/test_client_capability_matrix.py
          uv run --locked ruff format --check \
            native/scripts/validate_client_capability_matrix.py \
            native/scripts/probe_client_capabilities.py \
            native/scripts/p5_client_matrix_smoke.py \
            tests/test_client_capability_matrix.py
          python3 -m py_compile \
            native/scripts/validate_client_capability_matrix.py \
            native/scripts/probe_client_capabilities.py \
            native/scripts/p5_client_matrix_smoke.py \
            tests/test_client_capability_matrix.py
          python3 native/scripts/validate_client_capability_matrix.py \
            --output /tmp/pr38-evidence/matrix-validation.json
          uv run --locked pytest tests/test_client_capability_matrix.py -vv \
            2>&1 | tee /tmp/pr38-evidence/focused-pytest.txt
          python3 - <<'PY'
          import yaml
          from pathlib import Path
          yaml.safe_load(Path('.github/workflows/client-capability-matrix.yml').read_text())
          PY
          python3 scripts/check_documentation_consistency.py \
            | tee /tmp/pr38-evidence/documentation-consistency.txt
          git diff --check

      - name: Run exact native and lifecycle gates
        working-directory: native
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all --check 2>&1 | tee /tmp/pr38-evidence/cargo-fmt.txt
          cargo check --workspace --all-targets --all-features --locked \
            2>&1 | tee /tmp/pr38-evidence/cargo-check.txt
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings \
            2>&1 | tee /tmp/pr38-evidence/cargo-clippy.txt
          cargo test --workspace --all-features --locked \
            2>&1 | tee /tmp/pr38-evidence/cargo-test.txt
          cargo build --release --workspace --all-features --locked \
            2>&1 | tee /tmp/pr38-evidence/cargo-build.txt
          python3 scripts/phase1_mcp_smoke.py \
            target/release/soleaux . /tmp/pr38-evidence/phase1.json
          python3 scripts/phase2_capability_smoke.py \
            target/release/soleaux target/release/soleauxd . /tmp/pr38-evidence/phase2.json
          python3 scripts/p5_client_matrix_smoke.py \
            target/release/soleaux target/release/soleauxd . /tmp/pr38-evidence/p5-client-matrix.json
          cargo audit --deny warnings \
            2>&1 | tee /tmp/pr38-evidence/cargo-audit.txt

      - name: Publish only normal non-workflow product source
        run: |
          set -euo pipefail
          files=(
            docs/testing/CLIENT-CAPABILITY-MATRIX.md
            native/contracts/client-capability-matrix-v1.json
            native/daemon/ipc/src/compatibility.rs
            native/daemon/ipc/src/registry.rs
            native/daemon/state/src/database.rs
            native/daemon/state/src/store.rs
            native/daemon/state/src/tests.rs
            native/scripts/p5_client_matrix_smoke.py
            native/scripts/probe_client_capabilities.py
            native/scripts/validate_client_capability_matrix.py
            tests/test_client_capability_matrix.py
          )
          tar -czf /tmp/pr38-overlay.tar.gz "${files[@]}"
          git fetch origin "${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "${EXPECTED_TARGET}"
          git reset --hard "refs/remotes/origin/${TARGET_BRANCH}"
          git clean -fdx
          git checkout -B "${TARGET_BRANCH}" "refs/remotes/origin/${TARGET_BRANCH}"
          tar -xzf /tmp/pr38-overlay.tar.gz
          rm -f .ci/p5-client-review-fixes.py .ci/p5-client-wave2-hardening.py
          chmod +x \
            native/scripts/p5_client_matrix_smoke.py \
            native/scripts/probe_client_capabilities.py \
            native/scripts/validate_client_capability_matrix.py
          git diff --check
          (cd native && cargo fmt --all --check)
          uv run --locked ruff check \
            native/scripts/validate_client_capability_matrix.py \
            native/scripts/probe_client_capabilities.py \
            native/scripts/p5_client_matrix_smoke.py \
            tests/test_client_capability_matrix.py
          uv run --locked ruff format --check \
            native/scripts/validate_client_capability_matrix.py \
            native/scripts/probe_client_capabilities.py \
            native/scripts/p5_client_matrix_smoke.py \
            tests/test_client_capability_matrix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${files[@]}" .ci/p5-client-review-fixes.py .ci/p5-client-wave2-hardening.py
          git diff --cached --check
          git commit -m 'fix: make external client capability admission fail closed'
          git rev-parse HEAD | tee /tmp/pr38-evidence/SOURCE_COMMIT
          git diff-tree --no-commit-id --name-status -r HEAD \
            > /tmp/pr38-evidence/changed-files.txt
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"

      - name: Upload remediation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soleaux-pr38-remediation-${{ github.run_id }}
          path: /tmp/pr38-evidence
          if-no-files-found: error
          retention-days: 30
