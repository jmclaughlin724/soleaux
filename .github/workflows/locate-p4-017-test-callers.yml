name: Locate P4-017 legacy test callers

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/locate-p4-017-test-callers.yml
  push:
    branches:
      - fix/mcp-input-schema-validation-0.4.0-dev.5
    paths:
      - .github/workflows/locate-p4-017-test-callers.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  locate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mcp-input-schema-validation-0.4.0-dev.5
          fetch-depth: 0
      - name: Capture exact locked schemas and smoke call sites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('native/contracts/unified-mcp-profile-v2.json').read_text())
          selected = {'context.compile', 'navigate', 'inspect', 'preview', 'edit', 'restart_lsp'}
          tools = {}
          for item in [*manifest['tools'], *manifest.get('optionalDefinitions', [])]:
              if item['name'] in selected:
                  tools[item['name']] = item['inputSchema']
          Path('.ci/p4-017-selected-schemas.json').write_text(
              json.dumps(tools, indent=2, sort_keys=True) + '\n'
          )
          PY
          {
            echo '===== PHASE 1 TOOL CALLS ====='
            grep -n -C 10 -E 'context.compile|navigate|inspect|preview|edit|restart_lsp' native/scripts/phase1_mcp_smoke.py || true
            echo '===== PHASE 2 TOOL CALLS ====='
            grep -n -C 10 -E 'context.compile|navigate|inspect|preview|edit|restart_lsp' native/scripts/phase2_capability_smoke.py || true
          } > .ci/p4-017-smoke-callers.txt
      - name: Commit diagnostic snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/p4-017-selected-schemas.json .ci/p4-017-smoke-callers.txt
          git commit -m "ci: capture locked P4-017 schemas and smoke callers"
          git push origin HEAD:fix/mcp-input-schema-validation-0.4.0-dev.5
