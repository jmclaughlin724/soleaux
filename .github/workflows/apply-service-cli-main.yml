name: Apply proven service CLI source to canonical mainline

on:
  push:
    branches:
      - feat/service-cli-p4-014-p4-015-main-0.4.0-dev.5
    paths:
      - .github/workflows/apply-service-cli-main.yml

permissions:
  contents: write

concurrency:
  group: apply-service-cli-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install native build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake libclang-dev llvm-dev pkg-config protobuf-compiler

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Apply compiler-proven service and CLI delta
        run: |
          set -euo pipefail
          git diff 20f2a9acdf18e8cfeb8af8e76c2a948f4c14259d 1c119815bc471f8232f7fc663a227b8eaf9524bd -- \
            native/Cargo.toml \
            native/Cargo.lock \
            native/daemon/ipc \
            native/daemon/engine/Cargo.toml \
            native/daemon/engine/src/main.rs \
            native/apps/cli/Cargo.toml \
            native/apps/cli/src/main.rs \
            native/apps/cli/src/operations.rs \
            | git apply --3way
          cargo fmt --manifest-path native/Cargo.toml --all
          cargo check --manifest-path native/Cargo.toml --workspace --all-targets --all-features
          git diff --check

      - name: Validate local IPC, stable CLI, and complete native workspace
        working-directory: native
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo check --workspace --all-targets --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test -p soleaux-ipc --all-features --locked
          cargo test -p soleaux-state --all-features --locked
          cargo test --workspace --all-features --locked
          cargo build --release --workspace --all-features --locked
          ./target/release/soleaux --help
          ./target/release/soleauxd --help
          if ! command -v cargo-audit >/dev/null 2>&1; then
            cargo install cargo-audit --locked
          fi
          cargo audit --deny warnings

      - name: Commit validated normal source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/Cargo.toml native/Cargo.lock native/daemon/ipc native/daemon/engine/Cargo.toml native/daemon/engine/src/main.rs native/apps/cli/Cargo.toml native/apps/cli/src/main.rs native/apps/cli/src/operations.rs
          git diff --cached --check
          git commit -m 'feat(service): add typed per-user daemon IPC and stable operations CLI'
          git push origin HEAD:${{ github.ref_name }}
