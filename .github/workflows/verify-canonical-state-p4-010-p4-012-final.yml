name: Verify canonical state P4-010 P4-011 P4-012

on:
  pull_request:
    branches:
      - main
    paths:
      - native/**
      - .github/workflows/verify-canonical-state-p4-010-p4-012-final.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-canonical-state-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  exact:
    runs-on: ubuntu-24.04
    timeout-minutes: 125
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0

      - name: Install native build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake libclang-dev llvm-dev pkg-config protobuf-compiler python3-jsonschema sqlite3 xz-utils

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Verify exact source, canonical ownership, and locked product identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test ! -e .ci/apply-canonical-state-repairs.py
          test ! -e .github/workflows/apply-canonical-state-p4-010-p4-012.yml
          grep -F '"daemon/state"' native/Cargo.toml
          grep -F 'pub const SCHEMA_VERSION: i64 = 2;' native/daemon/state/src/database.rs
          grep -F 'pub enum EntityKind' native/daemon/state/src/model.rs
          grep -F 'pub struct SessionPayload' native/daemon/state/src/model.rs
          grep -F 'pub struct MemoryClaimPayload' native/daemon/state/src/model.rs
          grep -F 'pub struct HandoffPayload' native/daemon/state/src/model.rs
          grep -F 'pub struct RunPayload' native/daemon/state/src/model.rs
          grep -F 'pub struct OperationLease' native/daemon/state/src/model.rs
          grep -F 'CREATE TABLE canonical_entities' native/daemon/state/src/database.rs
          grep -F 'CREATE TABLE adapter_cursors' native/daemon/state/src/database.rs
          grep -F 'CREATE TABLE retention_policies' native/daemon/state/src/database.rs
          grep -F 'CREATE TABLE operation_leases' native/daemon/state/src/database.rs
          grep -F 'CREATE TABLE state_audit' native/daemon/state/src/database.rs
          grep -F 'VACUUM INTO ?1' native/daemon/state/src/database.rs
          grep -F 'newer than supported schema' native/daemon/state/src/database.rs
          grep -F 'canonical_schema_one_migrates_to_registry_schema_two' native/daemon/state/src/tests.rs
          grep -F 'operation_leases_have_one_winner_recovery_and_exact_result_replay' native/daemon/state/src/tests.rs
          grep -F 'backup_restore_export_and_repair_preserve_integrity' native/daemon/state/src/tests.rs
          grep -F 'pub const HARD_CEILING: usize = 12;' native/daemon/mcp/src/profile.rs
          grep -F 'pub const PRODUCTION_CLAIM_ALLOWED: bool = false;' native/daemon/mcp/src/profile.rs
          grep -F 'pub const PRODUCT_VERSION: &str = "0.4.0-dev.5";' native/daemon/mcp/src/profile.rs
          echo '89a2b783c4bd9c0ae834a5894dceb2c4abcaa8050dd0f57ed967a9c57e3a60fc  native/contracts/unified-mcp-profile-v2.json' | sha256sum -c -
          echo '3bbb53e84b0624f2a1de26bad7f2031b6a7cf0f7e892262d584347bd54b6003f  native/contracts/context-packet-v2.schema.json' | sha256sum -c -

      - name: Complete canonical and native regression gate
        working-directory: native
        run: |
          set -euo pipefail
          mkdir -p ../evidence/canonical-smoke
          cargo fmt --all --check
          cargo check --workspace --all-targets --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test -p soleaux-state --all-features --locked | tee ../evidence/canonical-state-tests.txt
          cargo test --workspace --all-features --locked | tee ../evidence/native-workspace-tests.txt
          cargo run -p soleaux-state --example state_smoke --locked -- ../evidence/canonical-smoke \
            | tee ../evidence/canonical-state-runtime.txt
          cargo build --release --workspace --all-features --locked
          ./target/release/soleaux --version | tee ../evidence/soleaux-version.txt
          ./target/release/soleauxd --version | tee ../evidence/soleauxd-version.txt
          python3 scripts/phase1_mcp_smoke.py \
            target/release/soleaux . ../evidence/phase1-mcp-smoke.json
          python3 scripts/phase2_capability_smoke.py \
            target/release/soleaux target/release/soleauxd . ../evidence/phase2-capability-smoke.json
          cp target/release/soleaux ../evidence/soleaux
          cp target/release/soleauxd ../evidence/soleauxd
          if ! command -v cargo-audit >/dev/null 2>&1; then
            cargo install cargo-audit --locked
          fi
          cargo audit --deny warnings | tee ../evidence/cargo-audit.txt

      - name: Independently inspect canonical SQLite state and recovery outputs
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee evidence/canonical-state-independent-inspection.json
          import hashlib
          import json
          import pathlib
          import sqlite3

          root = pathlib.Path('evidence/canonical-smoke')
          report = json.loads((root / 'canonical-state-smoke.json').read_text(encoding='utf-8'))
          assert report['schemaVersion'] == 'soleaux.canonical-state-smoke/v1'
          assert report['databaseSchemaVersion'] == 2
          assert report['status'] == 'pass'
          assert report['auditChainValid'] is True
          assert report['entityCount'] == 2
          assert report['linkCount'] == 1
          assert report['operationCount'] == 1
          assert report['operationState'] == 'completed'
          assert report['operationAttempt'] == 1
          assert report['replayedResult']['status'] == 'complete'
          assert report['restoredSessionTitle'] == 'Canonical state smoke'
          assert report['snapshotEntityCount'] == 2
          assert report['snapshotAuditCount'] >= 5
          assert report['restoredIntegrity'] == 'ok'

          expected_tables = {
              'canonical_entities',
              'entity_links',
              'adapter_cursors',
              'retention_policies',
              'tombstones',
              'operation_leases',
              'state_audit',
          }
          databases = {}
          for name in (
              'canonical-state.sqlite3',
              'canonical-state.backup.sqlite3',
              'canonical-state.restored.sqlite3',
          ):
              path = root / name
              assert path.is_file() and path.stat().st_size > 0
              connection = sqlite3.connect(f'file:{path}?mode=ro', uri=True)
              integrity = connection.execute('PRAGMA integrity_check').fetchone()[0]
              schema_version = connection.execute('PRAGMA user_version').fetchone()[0]
              foreign_key_violations = connection.execute('PRAGMA foreign_key_check').fetchall()
              tables = {
                  row[0]
                  for row in connection.execute(
                      "SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%'"
                  )
              }
              entity_count = connection.execute(
                  'SELECT COUNT(*) FROM canonical_entities'
              ).fetchone()[0]
              audit_count = connection.execute(
                  'SELECT COUNT(*) FROM state_audit'
              ).fetchone()[0]
              operation = connection.execute(
                  "SELECT state, result_json FROM operation_leases WHERE operation_key='smoke:operation'"
              ).fetchone()
              connection.close()
              assert integrity == 'ok'
              assert schema_version == 2
              assert not foreign_key_violations
              assert expected_tables.issubset(tables)
              assert entity_count == 2
              assert audit_count >= 5
              assert operation and operation[0] == 'completed'
              assert json.loads(operation[1])['status'] == 'complete'
              databases[name] = {
                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                  'bytes': path.stat().st_size,
                  'schemaVersion': schema_version,
                  'integrity': integrity,
                  'entityCount': entity_count,
                  'auditCount': audit_count,
              }

          result = {
              'schemaVersion': 'soleaux.canonical-state-inspection/v1',
              'databaseCount': len(databases),
              'databases': databases,
              'exactOperationReplay': True,
              'backupRestorePreservedState': True,
              'foreignKeysValid': True,
              'status': 'pass',
          }
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: Validate repository documentation
        run: python3 scripts/check_documentation_consistency.py

      - name: Write exact-head receipt and checksummed evidence
        run: |
          set -euo pipefail
          mkdir -p evidence
          printf '%s\n' "$SOURCE_COMMIT" > evidence/SOURCE_COMMIT
          printf '%s\n' "$GITHUB_RUN_ID" > evidence/WORKFLOW_RUN_ID
          sha256sum native/contracts/unified-mcp-profile-v2.json > evidence/PROFILE-CONTRACT-SHA256.txt
          sha256sum native/contracts/context-packet-v2.schema.json > evidence/CONTEXT-CONTRACT-SHA256.txt
          git archive --format=tar "$SOURCE_COMMIT" | xz -T0 -9 > evidence/soleaux-canonical-state-source.tar.xz
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = {
              'schemaVersion': 'soleaux.phase4-task-receipt/v1',
              'tasks': ['P4-010', 'P4-011', 'P4-012'],
              'sourceCommit': os.environ['SOURCE_COMMIT'],
              'workflowRunId': int(os.environ['GITHUB_RUN_ID']),
              'conclusion': 'success',
              'version': '0.4.0-dev.5',
              'productionClaimAllowed': False,
              'publicToolCeiling': 12,
              'canonicalStateSchemaVersion': 2,
              'canonicalEntityKinds': 20,
              'serializedWriter': True,
              'readOnlyConnections': True,
              'optimisticRevisions': True,
              'adapterCursors': True,
              'retentionAndTombstones': True,
              'operationLeases': True,
              'expiredOperationRecovery': True,
              'exactCompletedResultReplay': True,
              'hashChainedAudit': True,
              'backupRestoreRepair': True,
              'newerSchemaRefusal': True,
              'lockedContracts': {
                  'unifiedMcpProfileSha256': '89a2b783c4bd9c0ae834a5894dceb2c4abcaa8050dd0f57ed967a9c57e3a60fc',
                  'contextPacketV2Sha256': '3bbb53e84b0624f2a1de26bad7f2031b6a7cf0f7e892262d584347bd54b6003f',
              },
          }
          Path('evidence/P4-010-P4-011-P4-012-NATIVE-GATE-RECEIPT.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
          (
            cd evidence
            find . -type f ! -name SHA256SUMS -printf '%P\0' \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - uses: actions/upload-artifact@v4
        with:
          name: soleaux-canonical-state-${{ env.SOURCE_COMMIT }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
