name: Validate P4-023 repairs on repository macOS class

on:
  push:
    branches:
      - fix/truthful-continuations-p4-023-0.4.0-dev.5
    paths:
      - .github/workflows/repair-p4-023-macos-v3.yml

permissions:
  contents: write

concurrency:
  group: repair-p4-023-macos-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install native build prerequisites
        run: brew install protobuf

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Apply normal-source repair
        run: |
          set -euo pipefail
          python3 .ci/apply-p4-023-macos.py
          cargo fmt --manifest-path native/Cargo.toml --all

      - name: Validate complete native workspace on macOS
        working-directory: native
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo check --workspace --all-targets --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked

      - name: Commit validated normal source
        run: |
          set -euo pipefail
          rm .ci/apply-p4-023-macos.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/daemon/mcp/src/memory.rs native/daemon/mcp/src/lib.rs .ci/apply-p4-023-macos.py
          git diff --cached --check
          git commit -m 'fix(mcp): canonicalize memory roots across platforms'
          git push origin HEAD:${{ github.ref_name }}
