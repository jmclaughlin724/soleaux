name: Diagnose PR40 pinned Claude package

on:
  issue_comment:
    types:
      - created

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.issue.pull_request && github.event.issue.number == 40 && github.event.comment.body == '/diagnose-pr40-claude-package'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p5-client-matrix-post-merge-remediation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Inspect and install the exact verified artifact
        run: |
          set -euo pipefail
          mkdir -p /tmp/diagnostic/extracted
          python3 native/scripts/verify_pinned_client_artifact.py \
            --platform claude_code --download-dir /tmp/claude-pack \
            --output /tmp/diagnostic/artifact.json
          archive="$(python3 -c 'import json; print(json.load(open("/tmp/diagnostic/artifact.json"))["artifactPath"])')"
          tar -tzf "$archive" | sort > /tmp/diagnostic/archive-list.txt
          tar -xzf "$archive" -C /tmp/diagnostic/extracted
          cp /tmp/diagnostic/extracted/package/package.json /tmp/diagnostic/package.json
          npm install --global "$archive" 2>&1 | tee /tmp/diagnostic/npm-install.txt
          command -v claude | tee /tmp/diagnostic/command-path.txt
          readlink -f "$(command -v claude)" | tee /tmp/diagnostic/resolved-path.txt
          file "$(readlink -f "$(command -v claude)")" | tee /tmp/diagnostic/file.txt
          claude --version 2>&1 | tee /tmp/diagnostic/version.txt
          python3 native/scripts/probe_client_capabilities.py \
            --platform claude_code --binary claude \
            --output /tmp/diagnostic/probe.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr40-claude-package-diagnostic-${{ github.run_id }}
          path: /tmp/diagnostic
          if-no-files-found: error
          retention-days: 30
