name: Apply P4-017 MCP input-schema validation

on:
  pull_request:
    branches:
      - main
    paths:
      - .ci/p4-017-schema.part-*
      - .ci/apply-p4-017.py
      - .github/workflows/apply-p4-017.yml
  push:
    branches:
      - fix/mcp-input-schema-validation-0.4.0-dev.5
    paths:
      - .ci/p4-017-schema.part-*
      - .ci/apply-p4-017.py
      - .github/workflows/apply-p4-017.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-p4-017-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mcp-input-schema-validation-0.4.0-dev.5
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Apply the hash-bound P4-017 source package
        run: python3 .ci/apply-p4-017.py

      - name: Format and run focused native gates
        working-directory: native
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all --check
          cargo check -p soleaux-mcp --all-targets --all-features --locked
          cargo clippy -p soleaux-mcp --all-targets --all-features --locked -- -D warnings
          cargo test -p soleaux-mcp --all-features --locked schema
          cargo test -p soleaux-mcp --all-features --locked invalid_tool_arguments
          cargo test -p soleaux-mcp --all-features --locked json_rpc_invalid_tool_arguments
          cargo test -p soleaux-mcp --all-features --locked locked_tool_input_schemas

      - name: Commit normal source and remove the one-shot carrier
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .ci/p4-017-schema.part-*
          git rm .ci/apply-p4-017.py
          git rm .github/workflows/apply-p4-017.yml
          git add native/daemon/mcp/src/lib.rs native/daemon/mcp/src/schema.rs
          git diff --cached --check
          git commit -m "fix(mcp): enforce locked tool input schemas before dispatch"
          git push origin HEAD:fix/mcp-input-schema-validation-0.4.0-dev.5
