name: Soleaux Phase 0 source diagnostic

on:
  push:
    branches:
      - native-wedge/0.4.0-dev.4
    paths:
      - .github/workflows/phase0-source-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    name: Reconstruct reviewed native source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and capture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source-diagnostic
          cat \
            .ci/native-wedge-dev5-source.part-00 \
            .ci/native-wedge-dev5-source.repair-01a \
            .ci/native-wedge-dev5-source.repair-01b0 \
            .ci/native-wedge-dev5-source.repair-01b1 \
            .ci/native-wedge-dev5-source.repair-01b2 \
            .ci/native-wedge-dev5-source.repair-01b3 \
            .ci/native-wedge-dev5-source.repair-01b4 \
            .ci/native-wedge-dev5-source.repair-01b5 \
            .ci/native-wedge-dev5-source.repair-01b6 \
            .ci/native-wedge-dev5-source.repair-01b7 \
            .ci/native-wedge-dev5-source.repair-01b8 \
            .ci/native-wedge-dev5-source.repair-01b9 \
            .ci/native-wedge-dev5-source.repair-01c \
            .ci/native-wedge-dev5-source.repair-01d \
            .ci/native-wedge-dev5-source.part-02 \
            .ci/native-wedge-dev5-source.part-03 \
            .ci/native-wedge-dev5-source.part-04 \
            | tr -d '\r\n' > source-diagnostic/native-source.b64
          wc -c source-diagnostic/native-source.b64 | tee source-diagnostic/byte-count.txt
          sha256sum source-diagnostic/native-source.b64 | tee source-diagnostic/base64-sha256.txt
          base64 --decode source-diagnostic/native-source.b64 > source-diagnostic/native-source.tar.xz
          sha256sum source-diagnostic/native-source.tar.xz | tee source-diagnostic/archive-sha256.txt
          xz --test source-diagnostic/native-source.tar.xz 2>&1 | tee source-diagnostic/xz-test.txt
          mkdir source-diagnostic/extracted
          tar -xJf source-diagnostic/native-source.tar.xz -C source-diagnostic/extracted
          find source-diagnostic/extracted -type f -print | sort > source-diagnostic/extracted-files.txt

      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: soleaux-phase0-source-diagnostic
          path: source-diagnostic
          if-no-files-found: error
          retention-days: 2
