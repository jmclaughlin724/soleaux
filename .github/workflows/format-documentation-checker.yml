name: Format documentation checker

on:
  push:
    branches:
      - agent/p5-001-workspace-client-registry
    paths:
      - .github/workflows/format-documentation-checker.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: astral-sh/setup-uv@v7

      - name: Apply the pinned repository formatter
        run: |
          set -euo pipefail
          uv sync --locked
          uv run --locked ruff check --fix scripts/check_documentation_consistency.py
          uv run --locked ruff format scripts/check_documentation_consistency.py
          uv run --locked ruff check scripts/check_documentation_consistency.py
          uv run --locked ruff format --check scripts/check_documentation_consistency.py
          python3 scripts/check_documentation_consistency.py

      - name: Commit formatter output only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/check_documentation_consistency.py
          git diff --cached --check
          git commit -m 'style: format documentation checker'
          git push origin HEAD:${{ github.ref_name }}
