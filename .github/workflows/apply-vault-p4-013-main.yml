name: Apply encrypted vault P4-013 to canonical mainline

on:
  push:
    branches:
      - feat/encrypted-vault-policy-p4-013-main-0.4.0-dev.5
    paths:
      - .github/workflows/apply-vault-p4-013-main.yml

permissions:
  contents: write

concurrency:
  group: apply-vault-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install native build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake libclang-dev llvm-dev pkg-config protobuf-compiler

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Generate combined canonical-state and vault lockfile
        working-directory: native
        run: |
          set -euo pipefail
          cargo check --workspace --all-targets --all-features
          cargo fmt --all
          git diff --check

      - name: Validate encryption policy and full native workspace
        working-directory: native
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo check --workspace --all-targets --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test -p soleaux-vault --all-features --locked
          cargo test -p soleaux-state --all-features --locked
          cargo test --workspace --all-features --locked
          if ! command -v cargo-audit >/dev/null 2>&1; then
            cargo install cargo-audit --locked
          fi
          cargo audit --deny warnings

      - name: Commit compiler-proven combined source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/Cargo.lock native/daemon/vault native/Cargo.toml
          git diff --cached --check
          git commit -m 'feat(vault): add encrypted artifacts and deny-by-default policy'
          git push origin HEAD:${{ github.ref_name }}
