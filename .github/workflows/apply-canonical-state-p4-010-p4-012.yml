name: Apply canonical durable state P4-010 P4-012

on:
  push:
    branches:
      - feat/canonical-state-p4-010-p4-012-0.4.0-dev.5
    paths:
      - .github/workflows/apply-canonical-state-p4-010-p4-012.yml

permissions:
  contents: write

concurrency:
  group: apply-canonical-state-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install native build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake libclang-dev llvm-dev pkg-config protobuf-compiler

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Apply deterministic source repairs and update lockfile
        run: |
          set -euo pipefail
          python3 -m py_compile .ci/apply-canonical-state-repairs.py
          python3 .ci/apply-canonical-state-repairs.py
          cargo fmt --manifest-path native/Cargo.toml --all
          cargo check --manifest-path native/Cargo.toml --workspace --all-targets --all-features
          git diff --check

      - name: Validate canonical model, leases, recovery, and full workspace
        working-directory: native
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo check --workspace --all-targets --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test -p soleaux-state --all-features --locked
          cargo test --workspace --all-features --locked

      - name: Commit compiler-proven normal source
        run: |
          set -euo pipefail
          rm .ci/apply-canonical-state-repairs.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/Cargo.toml native/Cargo.lock native/daemon/state .ci/apply-canonical-state-repairs.py
          git diff --cached --check
          git commit -m 'feat(state): add canonical durable session and operation model'
          git push origin HEAD:${{ github.ref_name }}
