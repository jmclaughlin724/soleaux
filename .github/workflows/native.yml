name: Native

on:
  pull_request:
    paths:
      - "native/**"
      - ".github/workflows/native.yml"
  push:
    branches: [main]
    paths:
      - "native/**"
      - ".github/workflows/native.yml"

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Rust 1.97.1 native gate (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - name: Install native build prerequisites
        working-directory: .
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake libclang-dev llvm-dev pkg-config protobuf-compiler python3-jsonschema
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo fmt --all --check
      - run: cargo check --workspace --all-targets --all-features --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - run: cargo build --release --workspace --all-features --locked
      - name: Twelve-tool MCP smoke
        run: python3 scripts/phase1_mcp_smoke.py target/release/soleaux . /tmp/phase1-smoke.json
      - name: Capability smoke
        run: python3 scripts/phase2_capability_smoke.py target/release/soleaux target/release/soleauxd . /tmp/phase2-smoke.json
      - run: cargo audit --deny warnings

  macos:
    name: Rust 1.97.1 native gate (macOS arm64)
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - name: Install native build prerequisites
        working-directory: .
        run: brew install protobuf
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - run: cargo check --workspace --all-targets --all-features --locked
      - run: cargo test --workspace --all-features --locked
      - run: cargo build --release --workspace --all-features --locked
      - name: MCP smokes
        run: |
          python3 -m pip install --user --break-system-packages jsonschema
          python3 scripts/phase1_mcp_smoke.py target/release/soleaux . /tmp/phase1-smoke.json
          python3 scripts/phase2_capability_smoke.py target/release/soleaux target/release/soleauxd . /tmp/phase2-smoke.json
