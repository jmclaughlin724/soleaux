name: Materialize Phase 4 durable alpha foundation

on:
  push:
    branches:
      - feat/phase4-durable-alpha-foundation-0.4.0-dev.5
    paths:
      - .ci/phase4-foundation-parts/**
      - .github/workflows/materialize-phase4-foundation.yml

permissions:
  contents: write

concurrency:
  group: materialize-phase4-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install native build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake libclang-dev llvm-dev pkg-config protobuf-compiler

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Reconstruct, verify, and normalize source
        run: |
          set -euo pipefail
          cat .ci/phase4-foundation-parts/[0-9][0-9] | base64 --decode > /tmp/phase4-foundation-files.tar.gz
          echo '4b8b6cd0dbd36220632ccd913470a601bb80bff18ccaed1a09526e92b427ac3e  /tmp/phase4-foundation-files.tar.gz' | sha256sum -c -
          tar -xzf /tmp/phase4-foundation-files.tar.gz
          test -f native/daemon/control/src/lib.rs
          test -f native/daemon/control/src/state.rs
          test -f native/daemon/control/src/artifact.rs
          test -f native/daemon/control/src/ipc.rs
          test -f native/apps/cli/src/main.rs
          cargo fmt --manifest-path native/Cargo.toml --all
          cargo metadata --manifest-path native/Cargo.toml --format-version 1 >/dev/null
          git diff --check

      - name: Commit normal source before compiler validation
        run: |
          set -euo pipefail
          rm -rf .ci/phase4-foundation-parts
          rm .github/workflows/materialize-phase4-foundation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A native .ci .github/workflows/materialize-phase4-foundation.yml
          git diff --cached --check
          git commit -m 'feat(control): add durable native alpha control plane'
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git push origin HEAD:${{ github.ref_name }}

      - name: Validate exact committed source
        working-directory: native
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          cargo fmt --all --check
          cargo check --workspace --all-targets --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test -p soleaux-control --all-features --locked
          cargo test --workspace --all-features --locked
          cargo build --release --workspace --all-features --locked
          ./target/release/soleaux --version
          ./target/release/soleauxd --version
