name: Finish P4-013 encrypted vault foundation

on:
  push:
    branches:
      - ops/finish-phase4-foundation-20260805
    paths:
      - .github/workflows/finish-vault-p4-013.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: finish-p4-013-vault
  cancel-in-progress: false

env:
  REPOSITORY: jmclaughlin724/soleaux
  TARGET_BRANCH: feat/encrypted-vault-policy-p4-013-main-0.4.0-dev.5
  TARGET_PR: "28"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    outputs:
      source_commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Install native prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake libclang-dev llvm-dev pkg-config protobuf-compiler python3-jsonschema xz-utils

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Normalize source mechanically and persist only if needed
        run: |
          set -euo pipefail
          cargo fmt --manifest-path native/Cargo.toml --all
          git diff --check
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add native
            git commit -m 'style(vault): normalize exact-gate source'
            git push origin HEAD:${TARGET_BRANCH}
          fi

      - name: Record exact source
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify source ownership and locked identity
        run: |
          set -euo pipefail
          test ! -e .ci/apply-vault-p4-013.py
          test ! -e .github/workflows/apply-vault-p4-013-main.yml
          grep -F '"daemon/vault"' native/Cargo.toml
          grep -F 'ring = "0.17.14"' native/daemon/vault/Cargo.toml
          grep -F 'CHACHA20_POLY1305' native/daemon/vault/src/vault.rs
          grep -F 'soleaux.artifact-envelope/v1' native/daemon/vault/src/vault.rs
          grep -F 'derive_workspace_key' native/daemon/vault/src/keyring.rs
          grep -F 'find-generic-password' native/daemon/vault/src/keyring.rs
          grep -F 'secret-tool' native/daemon/vault/src/keyring.rs
          grep -F 'ProtectedData]::Protect' native/daemon/vault/src/keyring.rs
          grep -F 'PolicyEffect::Deny' native/daemon/vault/src/policy.rs
          grep -F 'validate_attenuation' native/daemon/vault/src/policy.rs
          grep -F 'pub const HARD_CEILING: usize = 12;' native/daemon/mcp/src/profile.rs
          grep -F 'pub const PRODUCTION_CLAIM_ALLOWED: bool = false;' native/daemon/mcp/src/profile.rs
          grep -F 'pub const PRODUCT_VERSION: &str = "0.4.0-dev.5";' native/daemon/mcp/src/profile.rs
          echo '89a2b783c4bd9c0ae834a5894dceb2c4abcaa8050dd0f57ed967a9c57e3a60fc  native/contracts/unified-mcp-profile-v2.json' | sha256sum -c -
          echo '3bbb53e84b0624f2a1de26bad7f2031b6a7cf0f7e892262d584347bd54b6003f  native/contracts/context-packet-v2.schema.json' | sha256sum -c -

      - name: Execute complete native and vault gate
        working-directory: native
        run: |
          set -euo pipefail
          mkdir -p ../evidence/vault-smoke
          cargo fmt --all --check
          cargo check --workspace --all-targets --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test -p soleaux-vault --all-features --locked | tee ../evidence/vault-tests.txt
          cargo test -p soleaux-state --all-features --locked | tee ../evidence/state-tests.txt
          cargo test --workspace --all-features --locked | tee ../evidence/workspace-tests.txt
          cargo run -p soleaux-vault --example vault_smoke --locked -- ../evidence/vault-smoke \
            | tee ../evidence/vault-runtime.txt
          cargo build --release --workspace --all-features --locked
          ./target/release/soleaux --version | tee ../evidence/soleaux-version.txt
          ./target/release/soleauxd --version | tee ../evidence/soleauxd-version.txt
          python3 scripts/phase1_mcp_smoke.py target/release/soleaux . ../evidence/phase1-mcp-smoke.json
          python3 scripts/phase2_capability_smoke.py \
            target/release/soleaux target/release/soleauxd . ../evidence/phase2-capability-smoke.json
          cp target/release/soleaux ../evidence/soleaux
          cp target/release/soleauxd ../evidence/soleauxd
          if ! command -v cargo-audit >/dev/null 2>&1; then
            cargo install cargo-audit --locked
          fi
          cargo audit --deny warnings | tee ../evidence/cargo-audit.txt

      - name: Independently inspect generated ciphertext and policy result
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee evidence/vault-independent-inspection.json
          import hashlib, json, pathlib
          root = pathlib.Path('evidence/vault-smoke')
          report = json.loads((root / 'vault-smoke.json').read_text(encoding='utf-8'))
          assert report['schemaVersion'] == 'soleaux.vault-smoke/v1'
          assert report['status'] == 'pass'
          assert report['productionClaimAllowed'] is False
          assert report['plaintextAbsentAtRest'] is True
          assert report['metadataRedactions'] >= 2
          assert report['workspaceIsolation'] is True
          assert report['tamperRejected'] is True
          assert report['previousKeyVersion'] == 1
          assert report['currentKeyVersion'] == 2
          assert report['rotatedArtifacts'] == 1
          assert report['defaultPolicyEffect'] == 'deny'
          assert report['approvalRequiredEffect'] == 'approval_required'
          assert report['approvedPolicyEffect'] == 'allow'
          content_hash = report['contentHash']
          envelope = root / 'vault' / 'workspaces' / report['workspaceId'] / content_hash[:2] / f'{content_hash}.sxv'
          keyring = root / 'development-keyring.json'
          encrypted = envelope.read_bytes()
          assert encrypted.startswith(b'SLXVAULT')
          assert b'Soleaux encrypted artifact smoke payload' not in encrypted
          keys = json.loads(keyring.read_text(encoding='utf-8'))
          assert keys['schemaVersion'] == 'soleaux.vault-keyring/v1'
          assert keys['currentVersion'] == 2
          assert sorted(keys['keys']) == ['1', '2']
          print(json.dumps({
              'schemaVersion':'soleaux.vault-independent-verification/v1',
              'envelopeBytes':len(encrypted),
              'envelopeSha256':hashlib.sha256(encrypted).hexdigest(),
              'plaintextAbsent':True,
              'keyVersions':[1,2],
              'workspaceIsolation':True,
              'tamperRejected':True,
              'denyByDefault':True,
              'approvalBound':True,
              'status':'pass',
          }, indent=2, sort_keys=True))
          PY

      - name: Validate documentation
        run: python3 scripts/check_documentation_consistency.py

      - name: Build exact evidence package
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          set -euo pipefail
          printf '%s\n' "$SOURCE_COMMIT" > evidence/SOURCE_COMMIT
          printf '%s\n' "$GITHUB_RUN_ID" > evidence/WORKFLOW_RUN_ID
          sha256sum native/contracts/unified-mcp-profile-v2.json > evidence/PROFILE-CONTRACT-SHA256.txt
          sha256sum native/contracts/context-packet-v2.schema.json > evidence/CONTEXT-CONTRACT-SHA256.txt
          git archive --format=tar "$SOURCE_COMMIT" | xz -T0 -9 > evidence/soleaux-vault-source.tar.xz
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          receipt = {
              'schemaVersion':'soleaux.phase4-task-receipt/v1',
              'task':'P4-013',
              'sourceCommit':os.environ['SOURCE_COMMIT'],
              'workflowRunId':int(os.environ['GITHUB_RUN_ID']),
              'conclusion':'success',
              'version':'0.4.0-dev.5',
              'productionClaimAllowed':False,
              'publicToolCeiling':12,
              'contentAddressedArtifacts':True,
              'authenticatedEncryption':'ChaCha20-Poly1305',
              'workspaceSeparatedKeys':True,
              'versionedKeyRotation':True,
              'metadataRedaction':True,
              'tamperRejection':True,
              'osKeyProtectionSources':['macOS Keychain','Linux Secret Service','Windows DPAPI'],
              'denyByDefaultPolicy':True,
              'riskAndSensitivityBounds':True,
              'approvalBinding':True,
              'capabilityAttenuation':True,
          }
          Path('evidence/P4-013-NATIVE-GATE-RECEIPT.json').write_text(
              json.dumps(receipt,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY
          (
            cd evidence
            find . -type f ! -name SHA256SUMS -printf '%P\0' | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - uses: actions/upload-artifact@v4
        with:
          name: soleaux-p4-013-${{ steps.source.outputs.commit }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30

  verify:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: soleaux-p4-013-${{ needs.build.outputs.source_commit }}
          path: evidence
      - name: Independently verify uploaded artifact
        env:
          SOURCE_COMMIT: ${{ needs.build.outputs.source_commit }}
        run: |
          set -euo pipefail
          cd evidence
          sha256sum -c SHA256SUMS
          test "$(cat SOURCE_COMMIT)" = "$SOURCE_COMMIT"
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path('.')
          receipt=json.loads((root/'P4-013-NATIVE-GATE-RECEIPT.json').read_text())
          inspection=json.loads((root/'vault-independent-inspection.json').read_text())
          assert receipt['sourceCommit'] == pathlib.Path('SOURCE_COMMIT').read_text().strip()
          assert receipt['conclusion'] == 'success'
          assert receipt['productionClaimAllowed'] is False
          assert receipt['publicToolCeiling'] == 12
          assert inspection['status'] == 'pass'
          assert inspection['plaintextAbsent'] is True
          assert inspection['tamperRejected'] is True
          PY
          chmod +x soleaux soleauxd
          test "$(./soleaux --version)" = 'soleaux 0.4.0-dev.5'
          test "$(./soleauxd --version)" = 'soleauxd 0.4.0-dev.5'
          xz -t soleaux-vault-source.tar.xz

  merge:
    needs: [build, verify]
    runs-on: ubuntu-24.04
    steps:
      - name: Squash merge independently verified PR
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ needs.build.outputs.source_commit }}
        run: |
          set -euo pipefail
          CURRENT=$(gh pr view "$TARGET_PR" --repo "$REPOSITORY" --json headRefOid --jq .headRefOid)
          test "$CURRENT" = "$SOURCE_COMMIT"
          gh api --method PUT "repos/$REPOSITORY/pulls/$TARGET_PR/merge" \
            -f merge_method=squash \
            -f sha="$SOURCE_COMMIT" \
            -f commit_title='feat(vault): add encrypted artifacts and deny-by-default policy (#28)' \
            -f commit_message='P4-013 exact native, ciphertext, key-rotation, policy, artifact, audit, MCP, and independent verification gates passed. Version remains 0.4.0-dev.5; public MCP ceiling remains 12; productionClaimAllowed remains false.'
