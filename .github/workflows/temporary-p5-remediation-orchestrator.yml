name: Temporary P5 client remediation orchestrator

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temporary-p5-remediation-orchestrator.yml

permissions:
  contents: write

env:
  BASE_COMMIT: c51265a3927f3b163b9cac686e0572b47da48b8c
  TARGET_BRANCH: fix/p5-client-matrix-post-merge-remediation
  TARGET_EXPECTED_HEAD: 89449be776c96a36a3ef52d6f262493bbdf7d692
  REVIEW_SOURCE_BRANCH: automation/p5-client-review-closure
  CARRIER_B64_SHA256: fcd9a9f59d4fe8885591a207962f42cc20611de60c783292564da7bc452d4f37
  CARRIER_GZIP_SHA256: 0a8b4e4a6738d9307c63fe7baa6de9d926d1a3cd7d23ad68e558839f2f8ffe27
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: temporary-p5-client-remediation
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_COMMIT }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Reconstruct reviewed closure and normalize normal source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_COMMIT"
          git fetch origin "$REVIEW_SOURCE_BRANCH:refs/remotes/origin/$REVIEW_SOURCE_BRANCH"
          for part in 00 01 02 03; do
            git show "origin/$REVIEW_SOURCE_BRANCH:.ci/p5-client-review-overlay.part$part" \
              > "/tmp/part$part"
          done
          cat /tmp/part00 /tmp/part01 /tmp/part02 /tmp/part03 > /tmp/carrier.b64
          echo "$CARRIER_B64_SHA256  /tmp/carrier.b64" | sha256sum -c -
          base64 -d /tmp/carrier.b64 > /tmp/carrier.tar.gz
          echo "$CARRIER_GZIP_SHA256  /tmp/carrier.tar.gz" | sha256sum -c -
          tar -xzf /tmp/carrier.tar.gz
          git show "origin/$REVIEW_SOURCE_BRANCH:.ci/p5-client-overlay-hotfix.py" \
            > /tmp/p5-client-overlay-hotfix.py
          python3 -m py_compile \
            .ci/apply-p5-client-review-closure.py \
            /tmp/p5-client-overlay-hotfix.py
          python3 .ci/apply-p5-client-review-closure.py | tee /tmp/package-provenance.json
          python3 /tmp/p5-client-overlay-hotfix.py
          rm -f \
            .ci/apply-p5-client-review-closure.py \
            .ci/p5-client-review-fixes.py \
            .ci/p5-client-wave2-hardening.py \
            .github/workflows/p5-client-review-fixes.yml \
            .github/workflows/p5-client-wave2-hardening.yml \
            .github/workflows/p5-claude-package-integrity.yml
          uv sync --locked
          uv run --locked ruff format \
            native/scripts/probe_client_capabilities.py \
            native/scripts/validate_client_capability_matrix.py \
            native/scripts/verify_pinned_client_artifact.py \
            native/scripts/p5_client_matrix_smoke.py \
            tests/test_client_capability_matrix.py
          uv run --locked ruff check --fix \
            native/scripts/probe_client_capabilities.py \
            native/scripts/validate_client_capability_matrix.py \
            native/scripts/verify_pinned_client_artifact.py \
            native/scripts/p5_client_matrix_smoke.py \
            tests/test_client_capability_matrix.py
          uv run --locked ruff format --check \
            native/scripts/probe_client_capabilities.py \
            native/scripts/validate_client_capability_matrix.py \
            native/scripts/verify_pinned_client_artifact.py \
            native/scripts/p5_client_matrix_smoke.py \
            tests/test_client_capability_matrix.py
          (cd native && cargo fmt --all)
          python3 native/scripts/validate_client_capability_matrix.py
          python3 -m py_compile \
            native/scripts/probe_client_capabilities.py \
            native/scripts/validate_client_capability_matrix.py \
            native/scripts/verify_pinned_client_artifact.py \
            native/scripts/p5_client_matrix_smoke.py \
            tests/test_client_capability_matrix.py
          git diff --check
      - name: Package exact source overlay
        run: |
          set -euo pipefail
          cat > /tmp/delete-paths.txt <<'EOF'
          .ci/p5-client-review-fixes.py
          .ci/p5-client-wave2-hardening.py
          .github/workflows/p5-client-review-fixes.yml
          .github/workflows/p5-client-wave2-hardening.yml
          .github/workflows/p5-claude-package-integrity.yml
          .github/workflows/materialize-p5-client-remediation.yml
          EOF
          files=(
            .github/workflows/client-capability-matrix.yml
            docs/testing/CLIENT-CAPABILITY-MATRIX.md
            native/contracts/client-capability-matrix-v1.json
            native/daemon/ipc/src/compatibility.rs
            native/daemon/ipc/src/registry.rs
            native/daemon/state/src/database.rs
            native/daemon/state/src/store.rs
            native/scripts/p5_client_matrix_smoke.py
            native/scripts/probe_client_capabilities.py
            native/scripts/validate_client_capability_matrix.py
            native/scripts/verify_pinned_client_artifact.py
            tests/test_client_capability_matrix.py
          )
          tar -czf /tmp/final-overlay.tar.gz "${files[@]}"
          sha256sum /tmp/final-overlay.tar.gz > /tmp/final-overlay.sha256
          git diff --name-status "$BASE_COMMIT" -- "${files[@]}" > /tmp/prepared-changed-files.txt
      - uses: actions/upload-artifact@v4
        with:
          name: p5-client-remediation-overlay-${{ github.run_id }}
          path: |
            /tmp/final-overlay.tar.gz
            /tmp/final-overlay.sha256
            /tmp/delete-paths.txt
            /tmp/prepared-changed-files.txt
            /tmp/package-provenance.json
          if-no-files-found: error
          retention-days: 30

  validate:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        lane: [python, rust, lifecycle, evidence]
    name: Pre-commit ${{ matrix.lane }} lane
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_COMMIT }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: p5-client-remediation-overlay-${{ github.run_id }}
          path: /tmp/overlay
      - name: Apply exact overlay
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_COMMIT"
          tar -xzf /tmp/overlay/final-overlay.tar.gz
          while IFS= read -r path; do rm -f "$path"; done < /tmp/overlay/delete-paths.txt
          git diff --check
      - uses: actions/setup-node@v4
        if: matrix.lane == 'python' || matrix.lane == 'evidence'
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        if: matrix.lane == 'python'
        with:
          version: 11.4.0
      - uses: astral-sh/setup-uv@v7
        if: matrix.lane == 'python' || matrix.lane == 'evidence'
      - name: Install native prerequisites
        if: matrix.lane == 'rust' || matrix.lane == 'lifecycle'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake libclang-dev llvm-dev pkg-config protobuf-compiler python3-jsonschema
      - uses: dtolnay/rust-toolchain@master
        if: matrix.lane == 'rust' || matrix.lane == 'lifecycle'
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: taiki-e/install-action@cargo-audit
        if: matrix.lane == 'lifecycle'
      - name: Python, schema, and documentation
        if: matrix.lane == 'python'
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          uv sync --locked
          uv run --locked ruff check .
          uv run --locked ruff format --check .
          uv run --locked pyright
          python3 native/scripts/validate_client_capability_matrix.py
          python3 scripts/check_documentation_consistency.py
          uv run --locked pytest \
            tests/test_client_capability_matrix.py \
            tests/test_attach.py \
            tests/test_no_regex.py \
            tests/test_packaged_guidance.py -q | tee /tmp/lane.txt
      - name: Complete Rust state and compatibility
        if: matrix.lane == 'rust'
        working-directory: native
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo check --workspace --all-targets --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked | tee /tmp/lane.txt
      - name: Release lifecycle and audit
        if: matrix.lane == 'lifecycle'
        working-directory: native
        run: |
          set -euo pipefail
          cargo build --release --workspace --all-features --locked
          python3 scripts/phase1_mcp_smoke.py target/release/soleaux . /tmp/phase1.json
          python3 scripts/phase2_capability_smoke.py target/release/soleaux target/release/soleauxd . /tmp/phase2.json
          python3 scripts/p5_registry_smoke.py target/release/soleaux target/release/soleauxd . /tmp/p5-registry.json
          python3 scripts/p5_client_matrix_smoke.py target/release/soleaux target/release/soleauxd . /tmp/p5-client-matrix.json
          cargo audit --deny warnings | tee /tmp/lane.txt
      - name: Immutable artifact and workflow evidence
        if: matrix.lane == 'evidence'
        run: |
          set -euo pipefail
          uv sync --locked
          python3 native/scripts/validate_client_capability_matrix.py | tee /tmp/lane.txt
          python3 native/scripts/verify_pinned_client_artifact.py --platform claude_code --output /tmp/claude.json
          python3 native/scripts/verify_pinned_client_artifact.py --platform codex --output /tmp/codex.json
          python3 native/scripts/verify_pinned_client_artifact.py --platform opencode --output /tmp/opencode.json
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          path = Path('.github/workflows/client-capability-matrix.yml')
          data = yaml.safe_load(path.read_text(encoding='utf-8'))
          assert data['name'] == 'Client capability matrix'
          text = path.read_text(encoding='utf-8')
          assert 'ref: ${{ env.SOURCE_COMMIT }}' in text
          assert 'curl https://cursor.com/install | bash' not in text
          assert 'native/**' in text
          PY
      - name: Normalize lane evidence
        if: always()
        run: |
          touch /tmp/lane.txt
          printf '%s\n' '${{ matrix.lane }}' > /tmp/lane-name.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p5-client-precommit-${{ matrix.lane }}-${{ github.run_id }}
          path: |
            /tmp/lane.txt
            /tmp/lane-name.txt
            /tmp/phase1.json
            /tmp/phase2.json
            /tmp/p5-registry.json
            /tmp/p5-client-matrix.json
            /tmp/claude.json
            /tmp/codex.json
            /tmp/opencode.json
          if-no-files-found: warn
          retention-days: 30

  publish:
    needs: [prepare, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      source_commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: p5-client-remediation-overlay-${{ github.run_id }}
          path: /tmp/overlay
      - name: Commit validated normal source
        id: commit
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_EXPECTED_HEAD"
          tar -xzf /tmp/overlay/final-overlay.tar.gz
          while IFS= read -r path; do rm -f "$path"; done < /tmp/overlay/delete-paths.txt
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: close P5 client capability security and provenance gaps'
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          git push origin "HEAD:$TARGET_BRANCH"

  exact_verify:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        lane: [python, rust, lifecycle, evidence]
    name: Exact-commit ${{ matrix.lane }} lane
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.source_commit }}
          fetch-depth: 0
      - name: Assert exact source identity
        run: test "$(git rev-parse HEAD)" = '${{ needs.publish.outputs.source_commit }}'
      - uses: actions/setup-node@v4
        if: matrix.lane == 'python' || matrix.lane == 'evidence'
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        if: matrix.lane == 'python'
        with:
          version: 11.4.0
      - uses: astral-sh/setup-uv@v7
        if: matrix.lane == 'python' || matrix.lane == 'evidence'
      - name: Install native prerequisites
        if: matrix.lane == 'rust' || matrix.lane == 'lifecycle'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake libclang-dev llvm-dev pkg-config protobuf-compiler python3-jsonschema
      - uses: dtolnay/rust-toolchain@master
        if: matrix.lane == 'rust' || matrix.lane == 'lifecycle'
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: taiki-e/install-action@cargo-audit
        if: matrix.lane == 'lifecycle'
      - name: Python, schema, and documentation
        if: matrix.lane == 'python'
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          uv sync --locked
          uv run --locked ruff check .
          uv run --locked ruff format --check .
          uv run --locked pyright
          python3 native/scripts/validate_client_capability_matrix.py
          python3 scripts/check_documentation_consistency.py
          uv run --locked pytest \
            tests/test_client_capability_matrix.py \
            tests/test_attach.py \
            tests/test_no_regex.py \
            tests/test_packaged_guidance.py -q | tee /tmp/lane.txt
      - name: Complete Rust state and compatibility
        if: matrix.lane == 'rust'
        working-directory: native
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo check --workspace --all-targets --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked | tee /tmp/lane.txt
      - name: Release lifecycle and audit
        if: matrix.lane == 'lifecycle'
        working-directory: native
        run: |
          set -euo pipefail
          cargo build --release --workspace --all-features --locked
          python3 scripts/phase1_mcp_smoke.py target/release/soleaux . /tmp/phase1.json
          python3 scripts/phase2_capability_smoke.py target/release/soleaux target/release/soleauxd . /tmp/phase2.json
          python3 scripts/p5_registry_smoke.py target/release/soleaux target/release/soleauxd . /tmp/p5-registry.json
          python3 scripts/p5_client_matrix_smoke.py target/release/soleaux target/release/soleauxd . /tmp/p5-client-matrix.json
          cargo audit --deny warnings | tee /tmp/lane.txt
      - name: Immutable artifact and workflow evidence
        if: matrix.lane == 'evidence'
        run: |
          set -euo pipefail
          uv sync --locked
          python3 native/scripts/validate_client_capability_matrix.py | tee /tmp/lane.txt
          python3 native/scripts/verify_pinned_client_artifact.py --platform claude_code --output /tmp/claude.json
          python3 native/scripts/verify_pinned_client_artifact.py --platform codex --output /tmp/codex.json
          python3 native/scripts/verify_pinned_client_artifact.py --platform opencode --output /tmp/opencode.json
      - name: Normalize exact evidence
        if: always()
        run: |
          touch /tmp/lane.txt
          printf '%s\n' '${{ matrix.lane }}' > /tmp/lane-name.txt
          printf '%s\n' '${{ needs.publish.outputs.source_commit }}' > /tmp/source-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p5-client-exact-${{ matrix.lane }}-${{ github.run_id }}
          path: |
            /tmp/lane.txt
            /tmp/lane-name.txt
            /tmp/source-commit.txt
            /tmp/phase1.json
            /tmp/phase2.json
            /tmp/p5-registry.json
            /tmp/p5-client-matrix.json
            /tmp/claude.json
            /tmp/codex.json
            /tmp/opencode.json
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    needs: [publish, exact_verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: p5-client-exact-*
          path: /tmp/evidence
      - name: Bind exact parallel evidence
        run: |
          set -euo pipefail
          find /tmp/evidence -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/SHA256SUMS
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          receipt = {
              'schemaVersion': 'soleaux.p5-client-remediation/v1',
              'sourceCommit': '${{ needs.publish.outputs.source_commit }}',
              'baseCommit': os.environ['BASE_COMMIT'],
              'workstreams': ['python', 'rust', 'lifecycle', 'evidence'],
              'externalMutationAdmission': 'denied_pending_daemon_authenticated_receipt',
              'productionClaimAllowed': False,
              'publicToolCeiling': 12,
              'status': 'pass',
          }
          Path('/tmp/RECEIPT.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: soleaux-p5-client-remediation-${{ github.run_id }}
          path: |
            /tmp/evidence
            /tmp/SHA256SUMS
            /tmp/RECEIPT.json
          if-no-files-found: error
          retention-days: 30

  cleanup:
    needs: aggregate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove the one-shot orchestrator
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temporary-p5-remediation-orchestrator.yml
          git commit -m 'chore: remove completed P5 remediation orchestrator'
          git push origin HEAD:main
