name: Soleaux Phase 2 exact final gate
# Exact replacement-carrier gate trigger.

on:
  push:
    branches:
      - phase2/native-lineage-a-0.4.0-dev.5
    paths:
      - .ci/phase2-overlay-v3.part-*
      - .ci/run-phase2-gate.sh
      - scripts/apply_phase2_repairs.py
      - .github/workflows/phase2-final.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: soleaux-phase2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Rust 1.97.1 exact Phase 2 gate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v4

      - name: Install native build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phase2-evidence
          sudo apt-get update 2>&1 | tee phase2-evidence/apt-update.txt
          sudo apt-get install -y --no-install-recommends \
            clang cmake libclang-dev llvm-dev pkg-config protobuf-compiler python3-jsonschema \
            2>&1 | tee phase2-evidence/apt-install.txt

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Execute exact Phase 2 gate
        shell: bash
        run: bash .ci/run-phase2-gate.sh

      - name: Collect exact evidence
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p phase2-evidence
          cp phase2-source/Cargo.lock phase2-evidence/Cargo.lock 2>/dev/null || true
          cp phase2-source/contracts/unified-mcp-profile-v2.json phase2-evidence/ 2>/dev/null || true
          cp phase2-source/contracts/context-packet-v2.schema.json phase2-evidence/ 2>/dev/null || true
          cargo metadata --manifest-path phase2-source/Cargo.toml --format-version 1 \
            > phase2-evidence/cargo-metadata.json \
            2> phase2-evidence/cargo-metadata.err || true
          if [ -d phase2-source ] && [ ! -f phase2-evidence/soleaux-phase2-source.tar.xz ]; then
            tar --exclude='./target' -cJf phase2-evidence/soleaux-phase2-source.tar.xz \
              -C phase2-source . 2> phase2-evidence/archive.err || true
          else
            : > phase2-evidence/archive.err
          fi
          find phase2-evidence -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z | xargs -0 sha256sum > phase2-evidence/SHA256SUMS 2>/dev/null || true

      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soleaux-phase2-final-evidence
          path: phase2-evidence
          if-no-files-found: error
          retention-days: 14

      - name: Persist exact Phase 2 receipt
        if: always()
        continue-on-error: true
        shell: bash
        env:
          PHASE2_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          run_id = os.environ['GITHUB_RUN_ID']
          repo = os.environ['GITHUB_REPOSITORY']
          run_url = f'https://github.com/{repo}/actions/runs/{run_id}'
          receipt = {
              'schemaVersion': 'soleaux.phase2.gate-receipt/v1',
              'sourceCommit': os.environ['GITHUB_SHA'],
              'runId': int(run_id),
              'runUrl': run_url,
              'workflow': os.environ['GITHUB_WORKFLOW'],
              'jobStatus': os.environ['PHASE2_JOB_STATUS'],
              'artifactName': 'soleaux-phase2-final-evidence',
              'artifactUrl': f'{run_url}#artifacts',
              'productVersion': '0.4.0-dev.5',
              'productionClaimAllowed': False,
              'publicToolCeiling': 12,
              'phase3Started': False,
          }
          Path('PHASE2-NATIVE-GATE-RECEIPT.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PHASE2-NATIVE-GATE-RECEIPT.json
          if ! git diff --cached --quiet; then
            git commit -m "Record exact Phase 2 native gate receipt"
            git push origin HEAD:phase2/native-lineage-a-0.4.0-dev.5
          fi
