name: Remove completed service applicator workflows

on:
  push:
    branches:
      - feat/service-cli-p4-014-p4-015-main-0.4.0-dev.5
    paths:
      - .github/workflows/cleanup-service-cli-main.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Remove one-shot workflows and commit normal source only
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-service-cli-main.yml
          rm -f .github/workflows/cleanup-service-cli-main.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows
          git diff --cached --check
          git commit -m 'chore: remove completed service applicator workflows'
          git push origin HEAD:${{ github.ref_name }}
