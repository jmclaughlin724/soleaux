name: Repair Phase 4 alpha package scripts

on:
  push:
    branches:
      - release/phase4-unsigned-alpha-main-0.4.0-dev.5
    paths:
      - .ci/repair-alpha-packager.py
      - .github/workflows/repair-alpha-packager.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Correct the generated uninstall script
        run: |
          set -euo pipefail
          python3 -m py_compile .ci/repair-alpha-packager.py
          python3 .ci/repair-alpha-packager.py
          python3 -m py_compile scripts/build_unsigned_alpha.py scripts/smoke_unsigned_alpha.py
          rm .ci/repair-alpha-packager.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/build_unsigned_alpha.py scripts/smoke_unsigned_alpha.py .ci/repair-alpha-packager.py
          git diff --cached --check
          git commit -m 'fix(alpha): use the stable uninstall flag contract'
          git push origin HEAD:${{ github.ref_name }}
