name: Build Soleaux macOS GUI installer

on:
  push:
    branches:
      - release/macos-gui-installer-0.4.0-dev.5
    paths:
      - scripts/build-macos-gui-installer.sh
      - .github/workflows/build-macos-gui-installer.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  SOURCE_COMMIT: 34c394efd01c9bb5348ba38e505317e6ca4da190

jobs:
  build-installer:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Verify exact source lineage
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$SOURCE_COMMIT")" = "$SOURCE_COMMIT"
          test "$(uname -m)" = "arm64"

      - name: Install native prerequisites
        run: |
          set -euo pipefail
          brew update
          brew install cmake llvm pkg-config protobuf
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
          echo "LLVM_CONFIG_PATH=$(brew --prefix llvm)/bin/llvm-config" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$(brew --prefix protobuf)/lib/pkgconfig:$(brew --prefix llvm)/lib/pkgconfig" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Apply deterministic macOS portability normalization
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "native/daemon/vault/src/keyring.rs",
              '''use std::{
              collections::BTreeMap,
              fs,
              io::Write,
              path::{Path, PathBuf},
              process::{Command, Stdio},
              sync::{Arc, Mutex},
          };
          ''',
              '''use std::{
              collections::BTreeMap,
              fs,
              path::{Path, PathBuf},
              process::Command,
              sync::{Arc, Mutex},
          };
          #[cfg(target_os = "linux")]
          use std::{io::Write, process::Stdio};
          ''',
              "keyring platform imports",
          )
          replace_once(
              "native/daemon/ipc/src/paths.rs",
              '''        return Ok(user_home()?
              .join("Library")
              .join("Application Support")
              .join("Soleaux"));
          ''',
              '''        Ok(user_home()?
              .join("Library")
              .join("Application Support")
              .join("Soleaux"))
          ''',
              "macOS Soleaux home expression",
          )
          replace_once(
              "native/daemon/ipc/src/paths.rs",
              '''        return Ok(user_home()?
              .join("Library")
              .join("LaunchAgents")
              .join("com.soleaux.daemon.plist"));
          ''',
              '''        Ok(user_home()?
              .join("Library")
              .join("LaunchAgents")
              .join("com.soleaux.daemon.plist"))
          ''',
              "macOS LaunchAgent expression",
          )
          replace_once(
              "native/daemon/ipc/src/service.rs",
              '''        return Ok(format!(
              "<?xml version=\\"1.0\\" encoding=\\"UTF-8\\"?>\\n<!DOCTYPE plist PUBLIC \\"-//Apple//DTD PLIST 1.0//EN\\" \\"http://www.apple.com/DTDs/PropertyList-1.0.dtd\\">\\n<plist version=\\"1.0\\"><dict>\\n<key>Label</key><string>com.soleaux.daemon</string>\\n<key>ProgramArguments</key><array><string>{}</string><string>ipc</string><string>--endpoint</string><string>{}</string><string>--state-db</string><string>{}</string></array>\\n<key>RunAtLoad</key><true/>\\n<key>KeepAlive</key><true/>\\n<key>ProcessType</key><string>Interactive</string>\\n<key>StandardOutPath</key><string>{}</string>\\n<key>StandardErrorPath</key><string>{}</string>\\n</dict></plist>\\n",
              xml_escape(&daemon),
              xml_escape(&endpoint),
              xml_escape(&state),
              xml_escape(&log),
              xml_escape(&log),
          ));
          ''',
              '''        Ok(format!(
              "<?xml version=\\"1.0\\" encoding=\\"UTF-8\\"?>\\n<!DOCTYPE plist PUBLIC \\"-//Apple//DTD PLIST 1.0//EN\\" \\"http://www.apple.com/DTDs/PropertyList-1.0.dtd\\">\\n<plist version=\\"1.0\\"><dict>\\n<key>Label</key><string>com.soleaux.daemon</string>\\n<key>ProgramArguments</key><array><string>{}</string><string>ipc</string><string>--endpoint</string><string>{}</string><string>--state-db</string><string>{}</string></array>\\n<key>RunAtLoad</key><true/>\\n<key>KeepAlive</key><true/>\\n<key>ProcessType</key><string>Interactive</string>\\n<key>StandardOutPath</key><string>{}</string>\\n<key>StandardErrorPath</key><string>{}</string>\\n</dict></plist>\\n",
              xml_escape(&daemon),
              xml_escape(&endpoint),
              xml_escape(&state),
              xml_escape(&log),
              xml_escape(&log),
          ))
          ''',
              "macOS LaunchAgent manifest expression",
          )
          replace_once(
              "native/daemon/ipc/src/service.rs",
              '''        return Ok(());
              ''',
              '''        Ok(())
              ''',
              "macOS service start expression",
          )
          replace_once(
              "native/daemon/ipc/src/service.rs",
              '''        return Ok(());
              ''',
              '''        Ok(())
              ''',
              "macOS service stop expression",
          )
          PY
          (cd native && cargo fmt --all)
          git diff --check

      - name: Build verified Apple Silicon binaries
        working-directory: native
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo check --workspace --all-targets --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked
          cargo build --release --workspace --all-features --locked
          file target/release/soleaux target/release/soleauxd
          file target/release/soleaux | grep -q 'arm64'
          file target/release/soleauxd | grep -q 'arm64'
          target/release/soleaux --version
          target/release/soleauxd --version
          target/release/soleaux --help >/dev/null
          target/release/soleauxd --help >/dev/null

      - name: Build double-clickable PKG and DMG
        run: |
          set -euo pipefail
          chmod +x scripts/build-macos-gui-installer.sh
          SOURCE_COMMIT="$SOURCE_COMMIT+macos-portability-normalization" \
            scripts/build-macos-gui-installer.sh \
            "$GITHUB_WORKSPACE" \
            "$GITHUB_WORKSPACE/native/target/release" \
            "$GITHUB_WORKSPACE/dist/macos-installer"

      - name: Verify installer structure and unattended installation
        run: |
          set -euo pipefail
          OUTPUT="$GITHUB_WORKSPACE/dist/macos-installer"
          PKG="$OUTPUT/Soleaux-0.4.0-dev.5-macOS-Apple-Silicon.pkg"
          DMG="$OUTPUT/Soleaux-0.4.0-dev.5-macOS-Apple-Silicon-Installer.dmg"
          test -s "$PKG"
          test -s "$DMG"
          hdiutil verify "$DMG"
          pkgutil --payload-files "$PKG" | grep -q 'usr/local/bin/soleaux'
          pkgutil --payload-files "$PKG" | grep -q 'usr/local/bin/soleauxd'
          pkgutil --payload-files "$PKG" | grep -q 'Applications/Uninstall Soleaux.app'
          (
            cd "$OUTPUT"
            shasum -a 256 -c SHA256SUMS
          )
          sudo installer -pkg "$PKG" -target /
          /usr/local/bin/soleaux --version
          /usr/local/bin/soleauxd --version
          test -d '/Applications/Uninstall Soleaux.app'
          sudo rm -f /usr/local/bin/soleaux /usr/local/bin/soleauxd
          sudo rm -rf /usr/local/share/soleaux '/Applications/Uninstall Soleaux.app'
          sudo pkgutil --forget com.soleaux.runtime >/dev/null 2>&1 || true

      - name: Upload macOS installer package
        uses: actions/upload-artifact@v4
        with:
          name: Soleaux-0.4.0-dev.5-macOS-Apple-Silicon-GUI-Installer
          path: dist/macos-installer
          if-no-files-found: error
          retention-days: 30
