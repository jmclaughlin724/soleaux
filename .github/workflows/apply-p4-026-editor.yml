name: Apply P4-026 atomic editor preview claim integration

on:
  push:
    branches:
      - fix/atomic-preview-claim-p4-026-0.4.0-dev.5
    paths:
      - .github/workflows/apply-p4-026-editor.yml

permissions:
  contents: write

concurrency:
  group: apply-p4-026-editor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install native build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake libclang-dev llvm-dev pkg-config protobuf-compiler

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Apply editor integration
        run: |
          set -euo pipefail
          python3 -m py_compile .ci/apply-p4-026-editor.py
          python3 .ci/apply-p4-026-editor.py
          cargo fmt --manifest-path native/Cargo.toml --all
          git diff --check

      - name: Validate editor claims and complete native workspace
        working-directory: native
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo check --workspace --all-targets --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test -p soleaux-storage --all-features --locked preview_claims
          cargo test -p soleaux-mcp --all-features --locked editor::tests
          cargo test --workspace --all-features --locked

      - name: Commit validated normal source
        run: |
          set -euo pipefail
          rm .ci/apply-p4-026-editor.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/daemon/mcp/src/editor.rs .ci/apply-p4-026-editor.py
          git diff --cached --check
          git commit -m 'fix(editor): claim previews atomically before side effects'
          git push origin HEAD:${{ github.ref_name }}
