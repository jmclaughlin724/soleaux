name: Apply encrypted artifact vault and policy P4-013

on:
  push:
    branches:
      - feat/encrypted-vault-policy-p4-013-0.4.0-dev.5
    paths:
      - .github/workflows/apply-vault-p4-013.yml

permissions:
  contents: write

concurrency:
  group: apply-vault-p4-013-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install native build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake libclang-dev llvm-dev pkg-config protobuf-compiler

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Apply deterministic vault integration and update lockfile
        run: |
          set -euo pipefail
          python3 -m py_compile .ci/apply-vault-p4-013.py
          python3 .ci/apply-vault-p4-013.py
          cargo fmt --manifest-path native/Cargo.toml --all
          cargo check --manifest-path native/Cargo.toml --workspace --all-targets --all-features
          git diff --check

      - name: Validate encryption policy and full native workspace
        working-directory: native
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo check --workspace --all-targets --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test -p soleaux-vault --all-features --locked
          cargo test --workspace --all-features --locked
          cargo audit --deny warnings

      - name: Commit compiler-proven normal source
        run: |
          set -euo pipefail
          rm .ci/apply-vault-p4-013.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/Cargo.toml native/Cargo.lock native/daemon/vault .ci/apply-vault-p4-013.py
          git diff --cached --check
          git commit -m 'feat(vault): add encrypted artifacts and deny-by-default policy'
          git push origin HEAD:${{ github.ref_name }}
