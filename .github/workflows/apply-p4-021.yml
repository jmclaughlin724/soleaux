name: Apply P4-021 comprehensive secret redaction

on:
  push:
    branches:
      - fix/comprehensive-secret-redaction-p4-021-0.4.0-dev.5
    paths:
      - native/daemon/redaction/**
      - .ci/apply-p4-021.py
      - .ci/run-p4-021.py
      - .github/workflows/apply-p4-021.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-p4-021-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/comprehensive-secret-redaction-p4-021-0.4.0-dev.5
          fetch-depth: 0

      - name: Install native build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake libclang-dev llvm-dev pkg-config protobuf-compiler python3-jsonschema

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Apply the scoped source changes
        run: python3 .ci/run-p4-021.py

      - name: Format and update lockfiles
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path native/Cargo.toml --all
          cargo check --manifest-path native/Cargo.toml --workspace --all-targets --all-features
          cargo fmt --manifest-path telemetry/daemon/Cargo.toml --all
          cargo check --manifest-path telemetry/daemon/Cargo.toml

      - name: Run focused native redaction gates
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path native/Cargo.toml --all --check
          cargo check --manifest-path native/Cargo.toml --workspace --all-targets --all-features --locked
          cargo clippy --manifest-path native/Cargo.toml --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --manifest-path native/Cargo.toml -p soleaux-redaction --all-features --locked
          cargo test --manifest-path native/Cargo.toml -p soleaux-intelligence --all-features --locked redactor
          cargo test --manifest-path native/Cargo.toml -p soleaux-intelligence --all-features --locked context_v2_redacts
          cargo test --manifest-path native/Cargo.toml -p soleaux-mcp --all-features --locked public_envelopes_redact
          cargo fmt --manifest-path telemetry/daemon/Cargo.toml --all --check
          cargo check --manifest-path telemetry/daemon/Cargo.toml --all-targets --locked
          cargo test --manifest-path telemetry/daemon/Cargo.toml --locked telemetry_redacts

      - name: Commit normal source and remove the one-shot applicator
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .ci/apply-p4-021.py
          git rm .ci/run-p4-021.py
          git rm .github/workflows/apply-p4-021.yml
          git add \
            native/Cargo.toml \
            native/Cargo.lock \
            native/daemon/redaction \
            native/daemon/intelligence/Cargo.toml \
            native/daemon/intelligence/src/context.rs \
            native/daemon/intelligence/src/context_v2.rs \
            native/daemon/mcp/Cargo.toml \
            native/daemon/mcp/src/envelope.rs \
            native/daemon/mcp/src/lib.rs \
            telemetry/daemon/Cargo.toml \
            telemetry/daemon/Cargo.lock \
            telemetry/daemon/src/main.rs
          git diff --cached --check
          git commit -m "fix(security): centralize comprehensive secret redaction"
          git push origin HEAD:fix/comprehensive-secret-redaction-p4-021-0.4.0-dev.5
