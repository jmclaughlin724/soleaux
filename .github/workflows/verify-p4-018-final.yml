name: Finalize P4-018 source review

on:
  push:
    branches:
      - fix/stale-index-read-freshness-0.4.0-dev.5
    paths:
      - .github/workflows/verify-p4-018-final.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stale-index-read-freshness-0.4.0-dev.5
          fetch-depth: 0

      - name: Minimize the registry lock scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("native/daemon/mcp/src/lib.rs")
          text = path.read_text(encoding="utf-8")
          old = (
              '        *self.registry.write().expect("registry lock poisoned") =\n'
              '            scan_registry(self.root(), &self.index)?;\n'
              '        Ok(report)\n'
          )
          new = (
              '        let registry = scan_registry(self.root(), &self.index)?;\n'
              '        *self.registry.write().expect("registry lock poisoned") = registry;\n'
              '        Ok(report)\n'
          )
          if text.count(old) != 1:
              raise SystemExit(f"registry assignment match count: {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          grep -n 'let registry = scan_registry' native/daemon/mcp/src/lib.rs

      - name: Commit the normal source correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/apply-p4-018-final-review.yml
          git add native/daemon/mcp/src/lib.rs
          git diff --cached --check
          git commit -m "fix(index): minimize registry lock scope"
          git push origin HEAD:fix/stale-index-read-freshness-0.4.0-dev.5
