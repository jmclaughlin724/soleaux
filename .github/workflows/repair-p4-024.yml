name: Apply and validate P4-024 typed PostgreSQL results

on:
  push:
    branches:
      - fix/typed-postgres-validation-p4-024-0.4.0-dev.5
    paths:
      - .github/workflows/repair-p4-024.yml

permissions:
  contents: write

concurrency:
  group: repair-p4-024-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install native build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake libclang-dev llvm-dev pkg-config protobuf-compiler

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Apply typed validation implementation and regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          intelligence = Path('native/daemon/intelligence/src/lib.rs')
          text = intelligence.read_text(encoding='utf-8')

          old_struct = '''    pub relations: Vec<String>,
    pub statement_count: usize,
    pub engine: String,
'''
          new_struct = '''    pub relations: Vec<String>,
    pub statement_count: usize,
    pub errors: Vec<String>,
    pub engine: String,
'''
          if text.count(old_struct) != 1:
              raise SystemExit('P4-024 PostgresAnalysis struct target drifted')
          text = text.replace(old_struct, new_struct, 1)

          old_parse = '''pub fn analyze_postgres_sql(source: &str) -> Result<PostgresAnalysis> {
    let parsed = pg_query::parse(source).context("PostgreSQL parser rejected the statement")?;
    let normalized = pg_query::normalize(source).context("normalizing PostgreSQL SQL")?;
'''
          new_parse = '''pub fn analyze_postgres_sql(source: &str) -> Result<PostgresAnalysis> {
    let parsed = match pg_query::parse(source) {
        Ok(parsed) => parsed,
        Err(error) => {
            return Ok(PostgresAnalysis {
                valid: false,
                normalized: String::new(),
                fingerprint: String::new(),
                relations: Vec::new(),
                statement_count: 0,
                errors: vec![error.to_string()],
                engine: "pg_query/libpg_query".into(),
                engine_version: PG_QUERY_ENGINE_VERSION.into(),
            });
        }
    };
    let normalized = pg_query::normalize(source).context("normalizing PostgreSQL SQL")?;
'''
          if text.count(old_parse) != 1:
              raise SystemExit('P4-024 parser target drifted')
          text = text.replace(old_parse, new_parse, 1)

          old_valid = '''        relations,
        statement_count: parsed.protobuf.stmts.len(),
        engine: "pg_query/libpg_query".into(),
'''
          new_valid = '''        relations,
        statement_count: parsed.protobuf.stmts.len(),
        errors: Vec::new(),
        engine: "pg_query/libpg_query".into(),
'''
          if text.count(old_valid) != 1:
              raise SystemExit('P4-024 valid analysis target drifted')
          text = text.replace(old_valid, new_valid, 1)

          old_test = '''    #[test]
    fn postgres_analysis_uses_native_postgres_parser() {
        let result = analyze_postgres_sql("select * from public.users where id = 42").unwrap();
        assert!(result.valid);
        assert!(result.relations.iter().any(|name| name.contains("users")));
        assert!(!result.fingerprint.is_empty());
    }
'''
          new_test = '''    #[test]
    fn postgres_analysis_uses_native_postgres_parser() {
        let result = analyze_postgres_sql("select * from public.users where id = 42").unwrap();
        assert!(result.valid);
        assert!(result.relations.iter().any(|name| name.contains("users")));
        assert!(!result.fingerprint.is_empty());
        assert!(result.errors.is_empty());
    }

    #[test]
    fn postgres_analysis_returns_invalid_sql_as_typed_data() {
        let result = analyze_postgres_sql("select from where").unwrap();
        assert!(!result.valid);
        assert!(result.normalized.is_empty());
        assert!(result.fingerprint.is_empty());
        assert!(result.relations.is_empty());
        assert_eq!(result.statement_count, 0);
        assert!(!result.errors.is_empty());
    }
'''
          if text.count(old_test) != 1:
              raise SystemExit('P4-024 intelligence test target drifted')
          intelligence.write_text(text.replace(old_test, new_test, 1), encoding='utf-8')

          mcp = Path('native/daemon/mcp/src/lib.rs')
          text = mcp.read_text(encoding='utf-8')
          if text.count('            "errors": [],\n') != 1:
              raise SystemExit('P4-024 MCP errors target drifted')
          text = text.replace('            "errors": [],\n', '            "errors": analysis.errors,\n', 1)
          old_trust = '        metadata.trust = "verified_sql_structure".to_string();\n'
          new_trust = '''        metadata.trust = if analysis.valid {
            "verified_sql_structure"
        } else {
            "verified_validation_result"
        }
        .to_string();
'''
          if text.count(old_trust) != 1:
              raise SystemExit('P4-024 trust target drifted')
          text = text.replace(old_trust, new_trust, 1)

          old_mcp_test = '''    #[tokio::test]
    async fn context_compile_returns_v2_typed_packet() {
'''
          new_mcp_test = '''    #[tokio::test]
    async fn invalid_postgres_sql_returns_a_successful_typed_validation_result() {
        let temp = tempdir().expect("tempdir");
        fs::write(
            temp.path().join("Cargo.toml"),
            "[package]\\nname='fixture'\\nversion='0.1.0'\\n",
        )
        .expect("fixture");
        let server = PublicMcpServer::with_store(temp.path(), temp.path().join("index.sqlite3"))
            .expect("server")
            .substitute_tool("restart_lsp", OPTIONAL_POSTGRES)
            .expect("substitution");
        server.prepare().await.expect("prepare");
        let envelope = server
            .call_async(OPTIONAL_POSTGRES, &json!({"sql":"select from where"}))
            .await
            .expect("typed validation result");
        assert_eq!(envelope.status, "ok");
        assert_eq!(envelope.data.get("valid").and_then(Value::as_bool), Some(false));
        assert_eq!(
            envelope.data.get("statement_count").and_then(Value::as_u64),
            Some(0)
        );
        assert!(
            envelope
                .data
                .get("errors")
                .and_then(Value::as_array)
                .is_some_and(|errors| !errors.is_empty())
        );
        assert_eq!(envelope.metadata.trust, "verified_validation_result");
    }

    #[tokio::test]
    async fn context_compile_returns_v2_typed_packet() {
'''
          if text.count(old_mcp_test) != 1:
              raise SystemExit('P4-024 MCP test insertion target drifted')
          mcp.write_text(text.replace(old_mcp_test, new_mcp_test, 1), encoding='utf-8')
          PY
          cargo fmt --manifest-path native/Cargo.toml --all

      - name: Validate typed PostgreSQL behavior
        working-directory: native
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo check --workspace --all-targets --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test -p soleaux-intelligence --all-features --locked postgres_analysis
          cargo test -p soleaux-mcp --all-features --locked postgres_sql
          cargo test -p soleaux-mcp --all-features --locked explicit_substitution

      - name: Commit normal validated source
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-p4-024.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/daemon/intelligence/src/lib.rs native/daemon/mcp/src/lib.rs .github/workflows/repair-p4-024.yml
          git diff --cached --check
          git commit -m 'fix(sql): return invalid PostgreSQL as typed validation data'
          git push origin HEAD:${{ github.ref_name }}
