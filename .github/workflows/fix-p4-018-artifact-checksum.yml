name: Repair P4-018 artifact checksum path

on:
  push:
    branches:
      - fix/stale-index-read-freshness-0.4.0-dev.5
    paths:
      - .github/workflows/fix-p4-018-artifact-checksum.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-p4-018-artifact-checksum-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stale-index-read-freshness-0.4.0-dev.5
          fetch-depth: 0

      - name: Make embedded checksums portable after artifact extraction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/verify-p4-018-final.yml")
          text = path.read_text(encoding="utf-8")
          old = (
              "          sha256sum evidence/P4-018-RECEIPT.json > "
              "evidence/SHA256SUMS\n"
          )
          new = (
              "          (\n"
              "            cd evidence\n"
              "            sha256sum P4-018-RECEIPT.json > SHA256SUMS\n"
              "          )\n"
          )
          if text.count(old) != 1:
              raise SystemExit(f"expected one checksum command, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          grep -A3 'cd evidence' .github/workflows/verify-p4-018-final.yml

      - name: Commit normal workflow and remove this one-shot repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-p4-018-artifact-checksum.yml
          git add .github/workflows/verify-p4-018-final.yml
          git diff --cached --check
          git commit -m "ci: make P4-018 artifact checksums extraction-safe"
          git push origin HEAD:fix/stale-index-read-freshness-0.4.0-dev.5
