name: Apply proven P4-026 source to current mainline

on:
  push:
    branches:
      - fix/atomic-preview-claim-p4-026-main-0.4.0-dev.5
    paths:
      - .github/workflows/apply-p4-026-main.yml

permissions:
  contents: write

concurrency:
  group: apply-p4-026-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install native build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake libclang-dev llvm-dev pkg-config protobuf-compiler

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Apply compiler-proven storage and editor deltas
        run: |
          set -euo pipefail
          git diff 6bc4f8cacb2d465c066c71c026b65e857ca07681 2a354a0e9dd9ca5dd33953c3a1d77a810fc90709 -- \
            native/daemon/storage/src/lib.rs \
            | git apply --3way
          git diff d50dddef983d74a2cb4537ae460374de0b3b4e1c 27037fde62f702de011242fc5b6484eb2126c36f -- \
            native/daemon/mcp/src/editor.rs \
            | git apply --3way
          cargo fmt --manifest-path native/Cargo.toml --all
          git diff --check

      - name: Validate atomic preview claims and full native workspace
        working-directory: native
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo check --workspace --all-targets --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test -p soleaux-storage --all-features --locked preview_claims
          cargo test -p soleaux-storage --all-features --locked schema_two_database
          cargo test -p soleaux-mcp --all-features --locked editor::tests
          cargo test --workspace --all-features --locked

      - name: Commit validated normal source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/daemon/storage/src/lib.rs native/daemon/mcp/src/editor.rs
          git diff --cached --check
          git commit -m 'fix(editor): claim previews atomically before side effects'
          git push origin HEAD:${{ github.ref_name }}
