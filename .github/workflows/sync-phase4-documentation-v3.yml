name: Apply corrected Phase 4 documentation synchronization

on:
  push:
    branches:
      - docs/phase4-closure-phase5-activation-0.4.0-dev.5
    paths:
      - .github/workflows/sync-phase4-documentation-v3.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: sync-phase4-documentation-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synchronize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PHASE4_SOURCE_COMMIT: 34c394efd01c9bb5348ba38e505317e6ca4da190
      PHASE4_MERGE_COMMIT: f450c1a9cd2cd74d366324b5e2031e4751fb5942
      PHASE4_WORKFLOW_RUN_ID: '31026328918'
      PHASE4_ARTIFACT_ID: '8939137324'
      PHASE4_ARTIFACT_SHA256: 9917b2dd8335b2d17cdb3f0dc15191699ec7f0d1ff431f9e3b2135e0a1f4684b
      PHASE4_EVIDENCE_DIR: phase4-evidence
      BRANCH_CLEANUP_RUN_ID: '31029393215'
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7

      - name: Reverify the exact Phase 4 evidence
        run: |
          set -euo pipefail
          rm -rf phase4-evidence phase4-artifact.zip
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/jmclaughlin724/soleaux/actions/artifacts/${PHASE4_ARTIFACT_ID}/zip" \
            -o phase4-artifact.zip
          echo "${PHASE4_ARTIFACT_SHA256}  phase4-artifact.zip" | sha256sum -c -
          unzip -t phase4-artifact.zip
          mkdir phase4-evidence
          unzip -q phase4-artifact.zip -d phase4-evidence
          (cd phase4-evidence && sha256sum -c SHA256SUMS)
          cmp phase4-evidence/soleaux-alpha-a.tar.xz phase4-evidence/soleaux-alpha-b.tar.xz
          phase4-evidence/extracted/soleaux-0.4.0-dev.5-linux-x86_64/bin/soleaux --version
          phase4-evidence/extracted/soleaux-0.4.0-dev.5-linux-x86_64/bin/soleauxd --version
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path('phase4-evidence')
          receipt = json.loads((root / 'PHASE4-ALPHA-CLOSURE-RECEIPT.json').read_text())
          operations = json.loads((root / 'alpha-operations/summary.json').read_text())
          package_a = json.loads((root / 'alpha-a.json').read_text())
          package_b = json.loads((root / 'alpha-b.json').read_text())
          assert receipt['sourceCommit'] == os.environ['PHASE4_SOURCE_COMMIT']
          assert receipt['workflowRunId'] == int(os.environ['PHASE4_WORKFLOW_RUN_ID'])
          assert receipt['conclusion'] == 'success'
          assert receipt['productionClaimAllowed'] is False
          assert receipt['publicToolCeiling'] == 12
          assert operations['status'] == 'pass'
          assert all(operations[key] is True for key in (
              'installedFromExtractedArchive', 'daemonRestarted', 'doctorPassed',
              'backupPassed', 'exportPassed', 'repairPassed', 'restorePassed',
              'uninstallPassed', 'statePreserved',
          ))
          assert package_a['archiveSha256'] == package_b['archiveSha256']
          assert package_a['archiveSha256'] == receipt['archiveSha256']
          PY

      - name: Reconstruct the checksummed synchronizer
        run: |
          set -euo pipefail
          cat .ci/sync-phase4-docs.part[0-9][0-9] > .ci/sync-phase4-docs.py.gz.b64
          echo '07c4a2d02c6850e95c64325a1a277e9d57a6183992b920454d432c6587f59d1b  .ci/sync-phase4-docs.py.gz.b64' | sha256sum -c -
          base64 -d .ci/sync-phase4-docs.py.gz.b64 > .ci/sync-phase4-docs.py.gz
          echo '89473f66f430211ba3ce15ccf242333d7317c4e13116d32b0968af8c75b32a0d  .ci/sync-phase4-docs.py.gz' | sha256sum -c -
          gzip -dc .ci/sync-phase4-docs.py.gz > .ci/sync_phase4_docs.py
          echo 'f8fc09a2543436adbae28fef74b5a33a6803cb2c27569b77de2ed70d8e7eec8a  .ci/sync_phase4_docs.py' | sha256sum -c -
          python3 -m py_compile .ci/sync_phase4_docs.py

      - name: Record completed branch consolidation
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          cat > /tmp/deleted-branches.txt <<'EOF'
          audit/transcript-reconciliation-0.4.0-dev.5
          bootstrap/p4-010-after-correctness
          bootstrap/p4-011-after-schema
          bootstrap/p4-012-after-runtime
          bootstrap/p4-018-after-p4-017
          bootstrap/p4-019-after-freshness-and-lsp
          bootstrap/p4-020-idempotency-audit
          bootstrap/p4-021-after-idempotency
          bootstrap/p4-022-after-redaction
          bootstrap/p4-024-after-coverage
          bootstrap/p4-026-after-sql
          docs/p4-017-p4-020-receipt-sync
          docs/transcript-gap-reconciliation-0.4.0-dev.5
          docs/transcript-gap-roadmap-final-0.4.0-dev.5
          feat/encrypted-vault-policy-p4-013-main-0.4.0-dev.5
          feat/operation-coordinator-p4-012-0.4.0-dev.5
          feat/service-cli-p4-014-p4-015-main-0.4.0-dev.5
          fix/comprehensive-secret-redaction-p4-021-0.4.0-dev.5
          fix/editor-transactional-rollback-0.4.0-dev.5
          fix/gateway-quoted-backend-identifiers-0.4.0-dev.5
          fix/operation-idempotency-p4-020-0.4.0-dev.5
          fix/stale-index-read-freshness-0.4.0-dev.5
          fix/transactional-provisioning-p4-022-0.4.0-dev.5
          ops/phase4-wave1-verifier-0.4.0-dev.5
          ops/phase4-wave2-verifier-0.4.0-dev.5
          ops/sync-phase4-receipts-0.4.0-dev.5
          release/phase4-unsigned-alpha-main-0.4.0-dev.5
          EOF
          : > /tmp/retained-branches.txt
          while IFS= read -r ref; do
            branch="${ref#refs/remotes/origin/}"
            case "$branch" in
              HEAD|main|docs/phase4-closure-phase5-activation-0.4.0-dev.5)
                continue
                ;;
            esac
            printf '%s\n' "$branch" >> /tmp/retained-branches.txt
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin | sort)
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          def lines(path: str) -> list[str]:
              return sorted(
                  line.strip()
                  for line in Path(path).read_text(encoding='utf-8').splitlines()
                  if line.strip()
              )

          report = {
              'schemaVersion': 'soleaux.branch-consolidation/v1',
              'asOfDate': '2026-08-05',
              'canonicalBranch': 'main',
              'basedOnMain': 'f450c1a9cd2cd74d366324b5e2031e4751fb5942',
              'cleanupWorkflowRunId': int(os.environ['BRANCH_CLEANUP_RUN_ID']),
              'deletedFullyMergedBranches': lines('/tmp/deleted-branches.txt'),
              'retainedUniqueCommitBranches': lines('/tmp/retained-branches.txt'),
              'excludedDuringRun': [
                  'main',
                  'docs/phase4-closure-phase5-activation-0.4.0-dev.5',
              ],
              'policy': (
                  'Delete only branch tips proven ancestors of main; retain every '
                  'branch with unique commits as non-authoritative archival lineage.'
              ),
              'productionClaimAllowed': False,
              'status': 'pass',
          }
          path = Path('docs/operations/BRANCH-CONSOLIDATION-2026-08-05.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

      - name: Synchronize, correct contract ownership, and validate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('docs/experiments/phase3/STATUS.json')
          value = json.loads(path.read_text(encoding='utf-8'))
          value['status'] = 'deferred_reconciliation_required'
          value['phase3Started'] = False
          value['productionClaimAllowed'] = False
          value.setdefault('runAuthorization', {})['allowed'] = False
          value['note'] = (
              'Deferred claims gate. It remains mandatory before quantified efficacy '
              'claims or a reviewed production-claim change, but does not block Phase 5.'
          )
          path.write_text(json.dumps(value, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          python3 .ci/sync_phase4_docs.py
          python3 - <<'PY'
          import json
          from pathlib import Path

          checker = Path('scripts/check_documentation_consistency.py')
          text = checker.read_text(encoding='utf-8')
          text = text.replace(
              'sha256("contracts/unified-mcp-profile-v2.json")',
              'sha256("native/contracts/unified-mcp-profile-v2.json")',
          ).replace(
              'sha256("contracts/context-packet-v2.schema.json")',
              'sha256("native/contracts/context-packet-v2.schema.json")',
          )
          checker.write_text(text, encoding='utf-8')

          status_path = Path('PROJECT-STATUS.json')
          status = json.loads(status_path.read_text(encoding='utf-8'))
          status['lockedContracts']['unifiedMcpProfile']['path'] = (
              'native/contracts/unified-mcp-profile-v2.json'
          )
          status['lockedContracts']['contextPacketV2']['path'] = (
              'native/contracts/context-packet-v2.schema.json'
          )
          status_path.write_text(
              json.dumps(status, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
          rm -f .ci/sync-phase4-docs.part[0-9][0-9] \
            .ci/sync-phase4-docs.py.gz.b64 \
            .ci/sync-phase4-docs.py.gz \
            .ci/sync_phase4_docs.py
          uv sync --locked
          uv run --locked ruff check --fix scripts/check_documentation_consistency.py
          uv run --locked ruff format scripts/check_documentation_consistency.py
          uv run --locked ruff check scripts/check_documentation_consistency.py
          uv run --locked ruff format --check scripts/check_documentation_consistency.py
          python3 scripts/check_documentation_consistency.py
          python3 - <<'PY'
          import json
          from pathlib import Path

          for path in Path('.').rglob('*.json'):
              if any(part in {'.git', '.venv', 'node_modules', 'phase4-evidence'} for part in path.parts):
                  continue
              json.loads(path.read_text(encoding='utf-8'))
          PY
          git diff --check

      - name: Commit the synchronized documentation authority
        run: |
          set -euo pipefail
          rm -rf phase4-evidence phase4-artifact.zip
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs: close Phase 4 and activate Phase 5'
          git push origin HEAD:${{ github.ref_name }}
