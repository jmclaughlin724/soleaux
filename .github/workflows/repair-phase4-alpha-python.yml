name: Normalize Phase 4 alpha Python sources

on:
  push:
    branches:
      - release/phase4-unsigned-alpha-main-0.4.0-dev.5
    paths:
      - .github/workflows/repair-phase4-alpha-python.yml

permissions:
  contents: write

concurrency:
  group: repair-phase4-alpha-python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7

      - name: Repair permanent alpha sources and remove temporary carrier
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          build = Path('scripts/build_unsigned_alpha.py')
          text = build.read_text(encoding='utf-8')

          replacements = [
              (
                  '        "workspaceMembers": sorted(id_to_key[str(value)] for value in metadata.get("workspace_members", [])),\n',
                  '        "workspaceMembers": sorted(\n'
                  '            id_to_key[str(value)]\n'
                  '            for value in metadata.get("workspace_members", [])\n'
                  '        ),\n',
                  'workspace members',
              ),
              (
                  '        if member.isdir():\n'
                  '            member.mode = 0o755\n'
                  '        elif member.name.endswith(("/bin/soleaux", "/bin/soleauxd", "/install.sh", "/uninstall.sh")):\n'
                  '            member.mode = 0o755\n',
                  '        executable_suffixes = (\n'
                  '            "/bin/soleaux",\n'
                  '            "/bin/soleauxd",\n'
                  '            "/install.sh",\n'
                  '            "/uninstall.sh",\n'
                  '        )\n'
                  '        if member.isdir() or member.name.endswith(executable_suffixes):\n'
                  '            member.mode = 0o755\n',
                  'tar modes',
              ),
              (
                  'def add_sorted(archive: tarfile.TarFile, root: pathlib.Path, package_name: str, epoch: int) -> None:\n'
                  '    archive.add(root, arcname=package_name, recursive=False, filter=tar_filter(epoch))\n'
                  '    for path in sorted(root.rglob("*"), key=lambda candidate: candidate.relative_to(root).as_posix()):\n',
                  'def add_sorted(\n'
                  '    archive: tarfile.TarFile,\n'
                  '    root: pathlib.Path,\n'
                  '    package_name: str,\n'
                  '    epoch: int,\n'
                  ') -> None:\n'
                  '    archive.add(root, arcname=package_name, recursive=False, filter=tar_filter(epoch))\n'
                  '    paths = sorted(\n'
                  '        root.rglob("*"),\n'
                  '        key=lambda candidate: candidate.relative_to(root).as_posix(),\n'
                  '    )\n'
                  '    for path in paths:\n',
                  'sorted archive traversal',
              ),
              (
                  '    if len(source_commit) != 40 or any(character not in "0123456789abcdef" for character in source_commit):\n',
                  '    invalid_commit = len(source_commit) != 40 or any(\n'
                  '        character not in "0123456789abcdef" for character in source_commit\n'
                  '    )\n'
                  '    if invalid_commit:\n',
                  'source commit validation',
              ),
              (
                  'Run `./install.sh` to copy `soleaux` and `soleauxd` into `${{SOLEAUX_INSTALL_BIN:-$HOME/.local/bin}}` and write a per-user service manifest. The installer does not mutate Claude, Codex, OpenCode, Cursor, or other vendor-native stores.\n\n'
                  'Run `soleaux service start` after reviewing the generated per-user service manifest. Use `soleaux doctor`, `soleaux service status`, `soleaux backup`, `soleaux export`, and `soleaux repair` for operational checks.\n\n'
                  'Run `./uninstall.sh` to call `soleaux uninstall --preserve-state true`. State removal requires an explicit separate decision.\n',
                  'Run `./install.sh` to copy `soleaux` and `soleauxd` into\n'
                  '`${{SOLEAUX_INSTALL_BIN:-$HOME/.local/bin}}` and write a per-user service manifest.\n'
                  'The installer does not mutate Claude, Codex, OpenCode, Cursor, or other\n'
                  'vendor-native stores.\n\n'
                  'Run `soleaux service start` after reviewing the generated per-user service\n'
                  'manifest. Use `soleaux doctor`, `soleaux service status`, `soleaux backup`,\n'
                  '`soleaux export`, and `soleaux repair` for operational checks.\n\n'
                  'Run `./uninstall.sh` to call `soleaux uninstall`. State removal requires an\n'
                  'explicit separate decision.\n',
                  'installation guidance',
              ),
          ]
          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'alpha packager target drifted for {label}: {count}')
              text = text.replace(old, new, 1)
          build.write_text(text, encoding='utf-8')

          smoke = Path('scripts/smoke_unsigned_alpha.py')
          text = smoke.read_text(encoding='utf-8')
          replacements = [
              (
                  '        raise RuntimeError(\n'
                  '            f"{name} failed with {result.returncode}: {result.stderr.strip() or result.stdout.strip()}"\n'
                  '        )\n',
                  '        detail = result.stderr.strip() or result.stdout.strip()\n'
                  '        raise RuntimeError(\n'
                  '            f"{name} failed with {result.returncode}: {detail}"\n'
                  '        )\n',
                  'command failure formatting',
              ),
              (
                  '    except subprocess.TimeoutExpired:\n'
                  '        process.kill()\n'
                  '        code = process.wait(timeout=10)\n'
                  '        raise RuntimeError(f"daemon did not stop after graceful IPC shutdown; killed with {code}")\n',
                  '    except subprocess.TimeoutExpired as error:\n'
                  '        process.kill()\n'
                  '        code = process.wait(timeout=10)\n'
                  '        raise RuntimeError(\n'
                  '            "daemon did not stop after graceful IPC shutdown; "\n'
                  '            f"killed with {code}"\n'
                  '        ) from error\n',
                  'timeout chaining',
              ),
          ]
          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'alpha smoke target drifted for {label}: {count}')
              text = text.replace(old, new, 1)
          smoke.write_text(text, encoding='utf-8')

          Path('.ci/repair-alpha-workflow.py').unlink(missing_ok=True)
          PY

          uv sync --locked
          uv run --locked ruff check --fix scripts/build_unsigned_alpha.py scripts/smoke_unsigned_alpha.py
          uv run --locked ruff format scripts/build_unsigned_alpha.py scripts/smoke_unsigned_alpha.py
          uv run --locked ruff check scripts/build_unsigned_alpha.py scripts/smoke_unsigned_alpha.py
          uv run --locked ruff format --check scripts/build_unsigned_alpha.py scripts/smoke_unsigned_alpha.py
          python3 -m py_compile scripts/build_unsigned_alpha.py scripts/smoke_unsigned_alpha.py

      - name: Commit normal source
        run: |
          set -euo pipefail
          rm .github/workflows/repair-phase4-alpha-python.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/build_unsigned_alpha.py scripts/smoke_unsigned_alpha.py \
            .ci/repair-alpha-workflow.py .github/workflows/repair-phase4-alpha-python.yml
          git diff --cached --check
          git commit -m 'fix(alpha): normalize release packaging sources'
          git push origin HEAD:${{ github.ref_name }}
