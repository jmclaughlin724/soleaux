name: Export exact PR38 source

on:
  push:
    branches:
      - automation/pr38-source-export
    paths:
      - .github/workflows/export-pr38-source.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 42d2b7808182ac0da9a478d395f00f3a2c55f4a8
          fetch-depth: 0
      - name: Package exact source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "42d2b7808182ac0da9a478d395f00f3a2c55f4a8"
          mkdir -p /tmp/pr38-source
          git archive --format=tar.gz --prefix=soleaux-pr38/ HEAD > /tmp/pr38-source/soleaux-pr38-source.tar.gz
          sha256sum /tmp/pr38-source/soleaux-pr38-source.tar.gz > /tmp/pr38-source/SHA256SUMS
          git rev-parse HEAD > /tmp/pr38-source/SOURCE_COMMIT
      - uses: actions/upload-artifact@v4
        with:
          name: soleaux-pr38-source-${{ github.run_id }}
          path: /tmp/pr38-source
          if-no-files-found: error
          retention-days: 7
