name: Soleaux Phase 1 final gate

on:
  push:
    branches:
      - native-wedge/0.4.0-dev.4
    paths:
      - .ci/phase1-overlay.part-*
      - .github/workflows/phase1-final.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: soleaux-phase1-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Rust 1.97.1 exact Phase 1 gate
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v4

      - name: Validate immutable Phase 0 contracts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf phase0-materialized phase1-base phase1-overlay phase1-source phase1-evidence
          mkdir -p phase0-materialized phase1-base phase1-overlay phase1-source phase1-evidence
          cat .ci/phase0-contracts.part-* | tr -d '\r\n' > /tmp/soleaux-phase0-contracts.tar.xz.b64
          test "$(wc -c < /tmp/soleaux-phase0-contracts.tar.xz.b64)" -eq 26360
          echo "ee4cfde3ce76b01737fa08498950af8288c9f3a585b72f452d2917d739e1e73a  /tmp/soleaux-phase0-contracts.tar.xz.b64" | sha256sum -c -
          base64 --decode /tmp/soleaux-phase0-contracts.tar.xz.b64 > /tmp/soleaux-phase0-contracts.tar.xz
          echo "6826368b15370b50f08e697e06ba9afb6b955455f2bb84cbd81088dc3bb2f564  /tmp/soleaux-phase0-contracts.tar.xz" | sha256sum -c -
          tar -xJf /tmp/soleaux-phase0-contracts.tar.xz -C phase0-materialized
          cmp contracts/phase0-identity.json phase0-materialized/contracts/phase0-identity.json
          python3 scripts/validate_phase0_contracts.py 2>&1 | tee phase1-evidence/phase0-contract-test.json

      - name: Materialize exact Phase 0 native source
        shell: bash
        run: |
          set -euo pipefail
          cat .ci/native-wedge-source.part-* | tr -d '\r\n' > /tmp/soleaux-native-base.tar.xz.b64
          test "$(wc -c < /tmp/soleaux-native-base.tar.xz.b64)" -eq 49336
          echo "c35307fd88284d43e991e4d98ae9ae569411e41afa17f29dc13a882204b1dbca  /tmp/soleaux-native-base.tar.xz.b64" | sha256sum -c -
          base64 --decode /tmp/soleaux-native-base.tar.xz.b64 > /tmp/soleaux-native-base.tar.xz
          echo "520b32d1223136b8a0dcaedd7b1438d3bb897c171b95884973e200ddf294dbfd  /tmp/soleaux-native-base.tar.xz" | sha256sum -c -
          tar -xJf /tmp/soleaux-native-base.tar.xz -C phase1-base
          if [ -d .ci/native-overrides/files ]; then
            cp -a .ci/native-overrides/files/. phase1-base/
          fi
          for patch_file in .ci/native-overrides/patches/*.patch; do
            patch -d phase1-base -p1 < "$patch_file"
          done
          cp -a .ci/phase0-native-overrides/files/. phase1-base/
          python3 scripts/apply_phase0_native_overlay.py phase1-base \
            2>&1 | tee phase1-evidence/phase0-native-overlay.json
          cp UNIFIED-MCP-PROFILE.md CONTEXT-PACKET-V2.md phase1-base/
          mkdir -p phase1-base/contracts
          cp contracts/phase0-identity.json phase1-base/contracts/
          cp phase0-materialized/contracts/unified-mcp-profile-v2.json phase1-base/contracts/
          cp phase0-materialized/contracts/context-packet-v2.schema.json phase1-base/contracts/
          cp -a phase1-base/. phase1-source/

      - name: Apply hash-bound Phase 1 overlay
        shell: bash
        run: |
          set -euo pipefail
          cat .ci/phase1-overlay.part-* | tr -d '\r\n' > /tmp/soleaux-phase1-overlay.tar.xz.b64
          test "$(wc -c < /tmp/soleaux-phase1-overlay.tar.xz.b64)" -eq 73704
          echo "a91adcb4d1d0f66ef51758eadba5f9cec487144dd93a18e266b4d5dd5a6a5cff  /tmp/soleaux-phase1-overlay.tar.xz.b64" | sha256sum -c -
          base64 --decode /tmp/soleaux-phase1-overlay.tar.xz.b64 > /tmp/soleaux-phase1-overlay.tar.xz
          test "$(wc -c < /tmp/soleaux-phase1-overlay.tar.xz)" -eq 55276
          echo "9123894a9fd470aecd830de4d46513cf36bc50a8839c05b7512d99ce77d95d32  /tmp/soleaux-phase1-overlay.tar.xz" | sha256sum -c -
          tar -xJf /tmp/soleaux-phase1-overlay.tar.xz -C phase1-overlay
          cp -a phase1-overlay/files/. phase1-source/
          if [ -s phase1-overlay/delete-paths.txt ]; then
            while IFS= read -r relative_path; do
              test -n "$relative_path" || continue
              rm -rf -- "phase1-source/$relative_path"
            done < phase1-overlay/delete-paths.txt
          fi
          git rev-parse HEAD | tee phase1-evidence/git-head.txt
          find phase1-source -type f | sort > phase1-evidence/materialized-files.txt
          cp phase1-overlay/changed-files.txt phase1-evidence/phase1-changed-files.txt

      - name: Verify binding contracts and exact public profile source
        shell: bash
        run: |
          set -euo pipefail
          cd phase1-source
          grep -q 'version = "0.4.0-dev.5"' Cargo.toml
          echo "89a2b783c4bd9c0ae834a5894dceb2c4abcaa8050dd0f57ed967a9c57e3a60fc  contracts/unified-mcp-profile-v2.json" | sha256sum -c -
          echo "3bbb53e84b0624f2a1de26bad7f2031b6a7cf0f7e892262d584347bd54b6003f  contracts/context-packet-v2.schema.json" | sha256sum -c -
          python3 - <<'PY' | tee ../phase1-evidence/contract-source-check.json
          import json
          from pathlib import Path

          expected = [
              'context.compile', 'code.search', 'memory.search', 'get_symbols',
              'registry.list', 'registry.read', 'repo_info', 'navigate',
              'inspect', 'preview', 'edit', 'restart_lsp',
          ]
          profile = json.loads(Path('contracts/unified-mcp-profile-v2.json').read_text())
          assert profile['productVersion'] == '0.4.0-dev.5'
          assert profile['productionClaimAllowed'] is False
          assert profile['hardCeiling'] == 12
          assert profile['defaultProfile'] == expected
          assert profile['optionalTools'] == [
              'parse_and_validate_postgres_sql',
              'turborepo.packages',
              'next.get_routes',
          ]
          source = Path('daemon/mcp/src/lib.rs').read_text()
          assert 'pub const PUBLIC_ROOT_TOOL_COUNT: usize = profile::HARD_CEILING;' in source
          assert 'enable_optional_tool' not in source
          assert 'context.compile' in source
          assert 'restart_lsp' in source
          print(json.dumps({
              'status': 'pass',
              'canonical_tools': expected,
              'hard_ceiling': 12,
              'production_claim_allowed': False,
          }, sort_keys=True))
          PY

      - name: Install native build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update 2>&1 | tee phase1-evidence/apt-update.txt
          sudo apt-get install -y --no-install-recommends \
            clang cmake libclang-dev llvm-dev pkg-config protobuf-compiler python3-jsonschema \
            2>&1 | tee phase1-evidence/apt-install.txt

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: phase1-source -> target

      - name: Record toolchain
        shell: bash
        run: |
          rustc --version --verbose | tee phase1-evidence/rustc-version.txt
          cargo --version --verbose | tee phase1-evidence/cargo-version.txt
          rustfmt --version | tee phase1-evidence/rustfmt-version.txt
          cargo clippy --version | tee phase1-evidence/clippy-version.txt
          python3 -c 'import jsonschema; print(jsonschema.__version__)' | tee phase1-evidence/jsonschema-version.txt

      - name: Generate lockfile
        working-directory: phase1-source
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile 2>&1 | tee ../phase1-evidence/cargo-generate-lockfile.txt
          cp Cargo.lock ../phase1-evidence/Cargo.lock

      - name: Format and verify
        working-directory: phase1-source
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all 2>&1 | tee ../phase1-evidence/cargo-fmt-apply.txt
          cargo fmt --all --check 2>&1 | tee ../phase1-evidence/cargo-fmt-check.txt

      - name: Check
        working-directory: phase1-source
        shell: bash
        run: |
          set -euo pipefail
          cargo check --workspace --all-targets --all-features 2>&1 | tee ../phase1-evidence/cargo-check.txt

      - name: Clippy
        working-directory: phase1-source
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --workspace --all-targets --all-features -- -D warnings 2>&1 | tee ../phase1-evidence/cargo-clippy.txt

      - name: Test
        working-directory: phase1-source
        shell: bash
        run: |
          set -euo pipefail
          cargo test --workspace --all-features 2>&1 | tee ../phase1-evidence/cargo-test.txt

      - name: Build release binaries
        working-directory: phase1-source
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --workspace --all-features 2>&1 | tee ../phase1-evidence/cargo-build-release.txt
          cp target/release/soleaux target/release/soleauxd ../phase1-evidence/

      - name: Binary smoke
        working-directory: phase1-source
        shell: bash
        run: |
          set -euo pipefail
          ./target/release/soleaux --help 2>&1 | tee ../phase1-evidence/soleaux-cli-help.txt
          ./target/release/soleauxd --help 2>&1 | tee ../phase1-evidence/soleauxd-help.txt
          ./target/release/soleaux --version 2>&1 | tee ../phase1-evidence/soleaux-version.txt
          ./target/release/soleauxd --version 2>&1 | tee ../phase1-evidence/soleauxd-version.txt

      - name: Exact MCP and Context Packet V2 smoke
        working-directory: phase1-source
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/phase1_mcp_smoke.py \
            target/release/soleaux \
            . \
            ../phase1-evidence/phase1-mcp-smoke.json \
            2>&1 | tee ../phase1-evidence/phase1-mcp-smoke.txt

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Audit
        working-directory: phase1-source
        shell: bash
        run: |
          set -euo pipefail
          cargo audit --deny warnings 2>&1 | tee ../phase1-evidence/cargo-audit.txt

      - name: Collect evidence
        if: always()
        shell: bash
        run: |
          set -u
          cp phase1-source/Cargo.lock phase1-evidence/Cargo.lock 2>/dev/null || true
          cp phase1-source/contracts/unified-mcp-profile-v2.json phase1-evidence/ 2>/dev/null || true
          cp phase1-source/contracts/context-packet-v2.schema.json phase1-evidence/ 2>/dev/null || true
          cargo metadata --manifest-path phase1-source/Cargo.toml --format-version 1 \
            > phase1-evidence/cargo-metadata.json \
            2> phase1-evidence/cargo-metadata.err || true
          tar --exclude='./target' -cJf phase1-evidence/soleaux-phase1-source.tar.xz \
            -C phase1-source . 2> phase1-evidence/archive.err || true
          find phase1-evidence -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z | xargs -0 sha256sum > phase1-evidence/SHA256SUMS 2>/dev/null || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soleaux-phase1-final-evidence
          path: phase1-evidence
          if-no-files-found: error
          retention-days: 14

      - name: Persist exact Phase 1 receipt
        if: always()
        continue-on-error: true
        shell: bash
        env:
          PHASE1_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          run_id = os.environ['GITHUB_RUN_ID']
          repo = os.environ['GITHUB_REPOSITORY']
          run_url = f'https://github.com/{repo}/actions/runs/{run_id}'
          receipt = {
              'schemaVersion': 'soleaux.phase1.gate-receipt/v1',
              'sourceCommit': os.environ['GITHUB_SHA'],
              'runId': int(run_id),
              'runUrl': run_url,
              'workflow': os.environ['GITHUB_WORKFLOW'],
              'jobStatus': os.environ['PHASE1_JOB_STATUS'],
              'artifactName': 'soleaux-phase1-final-evidence',
              'artifactUrl': f'{run_url}#artifacts',
              'productVersion': '0.4.0-dev.5',
              'productionClaimAllowed': False,
              'publicToolCeiling': 12,
          }
          Path('PHASE1-NATIVE-GATE-RECEIPT.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PHASE1-NATIVE-GATE-RECEIPT.json
          if ! git diff --cached --quiet; then
            git commit -m "Record exact Phase 1 native gate receipt"
            git push origin HEAD:native-wedge/0.4.0-dev.4
          fi
