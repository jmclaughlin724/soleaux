name: Client capability matrix

on:
  pull_request:
    branches:
      - main
    paths:
      - native/**
      - tests/test_client_capability_matrix.py
      - docs/testing/CLIENT-CAPABILITY-MATRIX.md
      - .github/workflows/client-capability-matrix.yml
  push:
    branches:
      - main
    paths:
      - native/**
      - tests/test_client_capability_matrix.py
      - docs/testing/CLIENT-CAPABILITY-MATRIX.md
      - .github/workflows/client-capability-matrix.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: client-capability-matrix-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  contract:
    name: Matrix contract and Rust admission
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Verify exact source
        run: test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
      - name: Validate matrix and admission policy
        run: |
          set -euo pipefail
          uv sync --locked
          mkdir -p /tmp/p5-capability-contract
          python3 native/scripts/validate_client_capability_matrix.py \
            --output /tmp/p5-capability-contract/matrix-validation.json
          uv run --locked pytest tests/test_client_capability_matrix.py -q \
            | tee /tmp/p5-capability-contract/python-tests.txt
          cd native
          cargo fmt --all --check
          cargo check -p soleaux-ipc --all-targets --locked
          cargo clippy -p soleaux-ipc --all-targets --locked -- -D warnings
          cargo test -p soleaux-ipc --locked \
            | tee /tmp/p5-capability-contract/rust-tests.txt
      - uses: actions/upload-artifact@v4
        with:
          name: p5-capability-contract-${{ env.SOURCE_COMMIT }}
          path: /tmp/p5-capability-contract
          if-no-files-found: error
          retention-days: 30

  claude-code:
    name: Claude Code 2.1.223 exact probe
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify and probe exact package
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          mkdir -p /tmp/p5-capability-claude-code
          python3 native/scripts/validate_client_capability_matrix.py \
            --platform claude_code \
            --output /tmp/p5-capability-claude-code/matrix-validation.json
          python3 native/scripts/verify_pinned_client_artifact.py \
            --platform claude_code \
            --output /tmp/p5-capability-claude-code/artifact-verification.json
          npm install --global @anthropic-ai/claude-code@2.1.223
          python3 native/scripts/probe_client_capabilities.py \
            --platform claude_code \
            --binary claude \
            --output /tmp/p5-capability-claude-code/probe.json
      - uses: actions/upload-artifact@v4
        with:
          name: p5-capability-claude-code-${{ env.SOURCE_COMMIT }}
          path: /tmp/p5-capability-claude-code
          if-no-files-found: error
          retention-days: 30

  claude-desktop:
    name: Claude Desktop documented surface
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0
      - name: Validate documentation-only contract
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          mkdir -p /tmp/p5-capability-claude-desktop
          python3 native/scripts/validate_client_capability_matrix.py \
            --platform claude_desktop \
            --output /tmp/p5-capability-claude-desktop/matrix-validation.json
          python3 native/scripts/probe_client_capabilities.py \
            --platform claude_desktop \
            --documentation-only \
            --output /tmp/p5-capability-claude-desktop/probe.json
      - uses: actions/upload-artifact@v4
        with:
          name: p5-capability-claude-desktop-${{ env.SOURCE_COMMIT }}
          path: /tmp/p5-capability-claude-desktop
          if-no-files-found: error
          retention-days: 30

  codex:
    name: Codex 0.146.1 exact app-server probe
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify and probe exact package
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          mkdir -p /tmp/p5-capability-codex
          python3 native/scripts/validate_client_capability_matrix.py \
            --platform codex \
            --output /tmp/p5-capability-codex/matrix-validation.json
          python3 native/scripts/verify_pinned_client_artifact.py \
            --platform codex \
            --output /tmp/p5-capability-codex/artifact-verification.json
          npm install --global @openai/codex@0.146.1
          python3 native/scripts/probe_client_capabilities.py \
            --platform codex \
            --binary codex \
            --output /tmp/p5-capability-codex/probe.json
      - uses: actions/upload-artifact@v4
        with:
          name: p5-capability-codex-${{ env.SOURCE_COMMIT }}
          path: /tmp/p5-capability-codex
          if-no-files-found: error
          retention-days: 30

  opencode:
    name: OpenCode 1.18.14 exact HTTP surface probe
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0
      - name: Download matrix-pinned artifact and probe it
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          mkdir -p /tmp/opencode-bin /tmp/p5-capability-opencode
          python3 native/scripts/validate_client_capability_matrix.py \
            --platform opencode \
            --output /tmp/p5-capability-opencode/matrix-validation.json
          python3 native/scripts/verify_pinned_client_artifact.py \
            --platform opencode \
            --output /tmp/p5-capability-opencode/artifact-verification.json
          python3 - <<'PY' > /tmp/opencode-asset.env
          import json
          from pathlib import Path
          matrix = json.loads(Path('native/contracts/client-capability-matrix-v1.json').read_text())
          version = next(p for p in matrix['platforms'] if p['id'] == 'opencode')['versions'][0]
          asset = version['linuxX64Asset']
          print(f"URL={asset['url']}")
          print(f"SHA256={asset['sha256']}")
          PY
          . /tmp/opencode-asset.env
          curl -fsSL "$URL" -o /tmp/opencode.tar.gz
          echo "$SHA256  /tmp/opencode.tar.gz" | sha256sum -c -
          tar -xzf /tmp/opencode.tar.gz -C /tmp/opencode-bin
          chmod +x /tmp/opencode-bin/opencode
          python3 native/scripts/probe_client_capabilities.py \
            --platform opencode \
            --binary /tmp/opencode-bin/opencode \
            --output /tmp/p5-capability-opencode/probe.json
      - uses: actions/upload-artifact@v4
        with:
          name: p5-capability-opencode-${{ env.SOURCE_COMMIT }}
          path: /tmp/p5-capability-opencode
          if-no-files-found: error
          retention-days: 30

  cursor:
    name: Cursor documentation-only safe mode
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0
      - name: Validate immutable documented surface
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          mkdir -p /tmp/p5-capability-cursor
          python3 native/scripts/validate_client_capability_matrix.py \
            --platform cursor \
            --output /tmp/p5-capability-cursor/matrix-validation.json
          python3 native/scripts/probe_client_capabilities.py \
            --platform cursor \
            --documentation-only \
            --output /tmp/p5-capability-cursor/probe.json
      - uses: actions/upload-artifact@v4
        with:
          name: p5-capability-cursor-${{ env.SOURCE_COMMIT }}
          path: /tmp/p5-capability-cursor
          if-no-files-found: error
          retention-days: 30

  generic-mcp:
    name: Generic MCP conformance and read-only admission
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0
      - name: Install native build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake libclang-dev llvm-dev pkg-config protobuf-compiler python3-jsonschema
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - name: Build and run exact conformance smokes
        working-directory: native
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          mkdir -p /tmp/p5-capability-generic-mcp
          cargo build --release --workspace --all-features --locked
          python3 scripts/phase1_mcp_smoke.py \
            target/release/soleaux . \
            /tmp/p5-capability-generic-mcp/phase1-mcp.json
          python3 scripts/p5_client_matrix_smoke.py \
            target/release/soleaux target/release/soleauxd . \
            /tmp/p5-capability-generic-mcp/client-matrix.json
      - uses: actions/upload-artifact@v4
        with:
          name: p5-capability-generic-mcp-${{ env.SOURCE_COMMIT }}
          path: /tmp/p5-capability-generic-mcp
          if-no-files-found: error
          retention-days: 30

  aggregate:
    name: Aggregate exact P5-002 through P5-006 evidence
    needs:
      - contract
      - claude-code
      - claude-desktop
      - codex
      - opencode
      - cursor
      - generic-mcp
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: p5-capability-*-${{ env.SOURCE_COMMIT }}
          path: /tmp/p5-capability-evidence
          merge-multiple: false
      - name: Validate and bind every independent workstream
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path('/tmp/p5-capability-evidence')
          reports = {}
          for platform in ('claude_code', 'claude_desktop', 'codex', 'opencode', 'cursor'):
              directory = next(root.glob(f'p5-capability-{platform.replace("_", "-")}-*'))
              report = json.loads((directory / 'probe.json').read_text())
              assert report['status'] == 'pass', (platform, report)
              assert report['writeCapable'] is False, platform
              reports[platform] = {
                  'clientVersion': report['clientVersion'],
                  'matrixVersion': report['matrixVersion'],
                  'writeCapable': False,
                  'probeEvidenceSha256': report['probe']['evidenceSha256'],
              }

          contract_dir = next(root.glob('p5-capability-contract-*'))
          generic_dir = next(root.glob('p5-capability-generic-mcp-*'))
          contract = json.loads((contract_dir / 'matrix-validation.json').read_text())
          generic = json.loads((generic_dir / 'client-matrix.json').read_text())
          phase1 = json.loads((generic_dir / 'phase1-mcp.json').read_text())
          assert contract['status'] == 'pass'
          assert generic['status'] == 'pass'
          assert generic['productionClaimAllowed'] is False
          assert generic['publicToolCeiling'] == 12
          assert phase1['status'] == 'pass'

          matrix_path = Path('native/contracts/client-capability-matrix-v1.json')
          matrix_sha = hashlib.sha256(matrix_path.read_bytes()).hexdigest()
          assert matrix_sha == contract['matrixSha256']
          result = {
              'schemaVersion': 'soleaux.p5-client-capability-evidence/v2',
              'sourceCommit': os.environ['SOURCE_COMMIT'],
              'tasks': ['P5-002', 'P5-003', 'P5-004', 'P5-005', 'P5-006'],
              'matrixSha256': matrix_sha,
              'platforms': reports,
              'genericMcpHost': {
                  'clientVersion': 'mcp-2025-11-25',
                  'writeCapable': False,
                  'phase1Mcp': 'pass',
                  'registrySafeMode': 'pass',
              },
              'externalMutationAdmission': 'denied_pending_daemon_authenticated_receipt',
              'publicToolCeiling': 12,
              'productionClaimAllowed': False,
              'status': 'pass',
          }
          output = root / 'P5-002-P5-006-CAPABILITY-MATRIX-EVIDENCE.json'
          output.write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          print(json.dumps(result, sort_keys=True))
          PY
          find /tmp/p5-capability-evidence -type f -print0 \
            | sort -z | xargs -0 sha256sum \
            > /tmp/p5-capability-evidence/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: soleaux-p5-client-capability-matrix-${{ github.run_id }}
          path: /tmp/p5-capability-evidence
          if-no-files-found: error
          retention-days: 30
