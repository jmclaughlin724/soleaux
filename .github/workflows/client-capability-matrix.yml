name: Client capability matrix

on:
  pull_request:
    branches:
      - main
    paths:
      - native/**
      - docs/testing/CLIENT-CAPABILITY-MATRIX.md
      - .github/workflows/client-capability-matrix.yml
  push:
    branches:
      - main
    paths:
      - native/**
      - docs/testing/CLIENT-CAPABILITY-MATRIX.md
      - .github/workflows/client-capability-matrix.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
  MATRIX: native/contracts/client-capability-matrix-v1.json

concurrency:
  group: p5-client-capability-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - name: Verify exact source and fail-closed contract
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          uv sync --locked
          uv run --locked ruff check \
            native/scripts/validate_client_capability_matrix.py \
            native/scripts/probe_client_capabilities.py \
            native/scripts/p5_client_matrix_smoke.py \
            native/scripts/verify_pinned_client_artifact.py \
            tests/test_client_capability_matrix.py
          uv run --locked ruff format --check \
            native/scripts/validate_client_capability_matrix.py \
            native/scripts/probe_client_capabilities.py \
            native/scripts/p5_client_matrix_smoke.py \
            native/scripts/verify_pinned_client_artifact.py \
            tests/test_client_capability_matrix.py
          python3 -m py_compile \
            native/scripts/validate_client_capability_matrix.py \
            native/scripts/probe_client_capabilities.py \
            native/scripts/p5_client_matrix_smoke.py \
            native/scripts/verify_pinned_client_artifact.py \
            tests/test_client_capability_matrix.py
          python3 native/scripts/validate_client_capability_matrix.py \
            --output /tmp/client-matrix-validation.json
          python3 native/scripts/validate_client_capability_matrix.py --self-test \
            --output /tmp/client-matrix-validator-self-test.json
          uv run --locked pytest tests/test_client_capability_matrix.py -q \
            > /tmp/client-probe-self-test.json
      - uses: actions/upload-artifact@v4
        with:
          name: p5-client-contract-${{ env.SOURCE_COMMIT }}
          path: |
            /tmp/client-matrix-validation.json
            /tmp/client-matrix-validator-self-test.json
            /tmp/client-probe-self-test.json
          if-no-files-found: error
          retention-days: 30

  claude-code:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify exact immutable package and probe Claude Code
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          python3 native/scripts/validate_client_capability_matrix.py \
            --platform claude_code --output /tmp/claude-validation.json
          python3 native/scripts/verify_pinned_client_artifact.py \
            --platform claude_code --download-dir /tmp/claude-pack \
            --output /tmp/claude-artifact.json
          CLAUDE_ARCHIVE="$(python3 -c 'import json; print(json.load(open("/tmp/claude-artifact.json"))["artifactPath"])')"
          npm install --global "$CLAUDE_ARCHIVE" --ignore-scripts
          python3 native/scripts/probe_client_capabilities.py \
            --platform claude_code --binary claude \
            --output /tmp/claude-code.json
      - uses: actions/upload-artifact@v4
        with:
          name: p5-client-claude-code-${{ env.SOURCE_COMMIT }}
          path: |
            /tmp/claude-validation.json
            /tmp/claude-artifact.json
            /tmp/claude-code.json
          if-no-files-found: error
          retention-days: 30

  claude-desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0
      - name: Validate documentation-only Claude Desktop surface
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          python3 native/scripts/validate_client_capability_matrix.py \
            --platform claude_desktop --output /tmp/claude-desktop-validation.json
          python3 native/scripts/probe_client_capabilities.py \
            --platform claude_desktop --documentation-only \
            --output /tmp/claude-desktop.json
      - uses: actions/upload-artifact@v4
        with:
          name: p5-client-claude-desktop-${{ env.SOURCE_COMMIT }}
          path: |
            /tmp/claude-desktop-validation.json
            /tmp/claude-desktop.json
          if-no-files-found: error
          retention-days: 30

  codex:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify exact Codex package and probe its app-server surface
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          python3 native/scripts/validate_client_capability_matrix.py \
            --platform codex --output /tmp/codex-validation.json
          python3 native/scripts/verify_pinned_client_artifact.py \
            --platform codex --download-dir /tmp/codex-pack \
            --output /tmp/codex-artifact.json
          CODEX_ARCHIVE="$(python3 -c 'import json; print(json.load(open("/tmp/codex-artifact.json"))["artifactPath"])')"
          npm install --global "$CODEX_ARCHIVE" --ignore-scripts
          python3 native/scripts/probe_client_capabilities.py \
            --platform codex --binary codex --output /tmp/codex.json
      - uses: actions/upload-artifact@v4
        with:
          name: p5-client-codex-${{ env.SOURCE_COMMIT }}
          path: |
            /tmp/codex-validation.json
            /tmp/codex-artifact.json
            /tmp/codex.json
          if-no-files-found: error
          retention-days: 30

  opencode:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0
      - name: Verify the matrix-pinned OpenCode artifact and probe it
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          python3 native/scripts/validate_client_capability_matrix.py \
            --platform opencode --output /tmp/opencode-validation.json
          python3 native/scripts/verify_pinned_client_artifact.py \
            --platform opencode --download-dir /tmp/opencode-pack \
            --output /tmp/opencode-artifact.json
          OPENCODE_ARCHIVE="$(python3 -c 'import json; print(json.load(open("/tmp/opencode-artifact.json"))["artifactPath"])')"
          mkdir -p /tmp/opencode-extract
          tar -xzf "$OPENCODE_ARCHIVE" -C /tmp/opencode-extract
          OPENCODE="$(find /tmp/opencode-extract -type f -name opencode -print -quit)"
          test -n "$OPENCODE"
          chmod +x "$OPENCODE"
          python3 native/scripts/probe_client_capabilities.py \
            --platform opencode --binary "$OPENCODE" --output /tmp/opencode.json
      - uses: actions/upload-artifact@v4
        with:
          name: p5-client-opencode-${{ env.SOURCE_COMMIT }}
          path: |
            /tmp/opencode-validation.json
            /tmp/opencode-artifact.json
            /tmp/opencode.json
          if-no-files-found: error
          retention-days: 30

  cursor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0
      - name: Validate Cursor as documentation-only until an immutable artifact is pinned
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          python3 native/scripts/validate_client_capability_matrix.py \
            --platform cursor --output /tmp/cursor-validation.json
          python3 native/scripts/probe_client_capabilities.py \
            --platform cursor --documentation-only --output /tmp/cursor.json
      - uses: actions/upload-artifact@v4
        with:
          name: p5-client-cursor-${{ env.SOURCE_COMMIT }}
          path: |
            /tmp/cursor-validation.json
            /tmp/cursor.json
          if-no-files-found: error
          retention-days: 30

  generic-mcp:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0
      - name: Install native build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake libclang-dev llvm-dev pkg-config protobuf-compiler \
            python3-jsonschema
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: taiki-e/install-action@cargo-audit
      - name: Build exact source and prove fail-closed registry admission
        working-directory: native
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          python3 scripts/validate_client_capability_matrix.py \
            --platform generic_mcp_host --output /tmp/generic-validation.json
          cargo fmt --all --check
          cargo check --workspace --all-targets --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test -p soleaux-ipc --all-features --locked
          cargo build --release --workspace --all-features --locked
          python3 scripts/phase1_mcp_smoke.py \
            target/release/soleaux . /tmp/phase1.json
          python3 scripts/p5_client_matrix_smoke.py \
            target/release/soleaux target/release/soleauxd . /tmp/generic-mcp.json
          cargo audit --deny warnings
      - uses: actions/upload-artifact@v4
        with:
          name: p5-client-generic-mcp-${{ env.SOURCE_COMMIT }}
          path: |
            /tmp/generic-validation.json
            /tmp/phase1.json
            /tmp/generic-mcp.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs:
      - contract
      - claude-code
      - claude-desktop
      - codex
      - opencode
      - cursor
      - generic-mcp
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: p5-client-*-${{ env.SOURCE_COMMIT }}
          path: /tmp/client-evidence
          merge-multiple: true
      - name: Aggregate exact evidence for the tested source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("/tmp/client-evidence")
          validation = json.loads((root / "client-matrix-validation.json").read_text())
          reports = {}
          for platform, filename in {
              "claude_code": "claude-code.json",
              "claude_desktop": "claude-desktop.json",
              "codex": "codex.json",
              "opencode": "opencode.json",
              "cursor": "cursor.json",
          }.items():
              report = json.loads((root / filename).read_text())
              assert report["status"] == "pass"
              assert report["writeCapable"] is False
              assert report["productionClaimAllowed"] is False
              assert report["registrationCapabilitiesBytes"] <= 2048
              reports[platform] = report

          generic = json.loads((root / "generic-mcp.json").read_text())
          assert generic["status"] == "pass"
          assert generic["externalGenericHost"]["writeCapable"] is False
          assert generic["externalGenericHost"]["forgedReadWriteRejected"] is True
          assert generic["internalCli"]["writeCapable"] is True
          assert generic["publicToolCeiling"] == 12
          assert generic["productionClaimAllowed"] is False

          result = {
              "schemaVersion": "soleaux.p5-client-capability-evidence/v1",
              "sourceCommit": os.environ["SOURCE_COMMIT"],
              "matrixSha256": validation["matrixSha256"],
              "platforms": reports,
              "genericMcp": generic,
              "tasks": validation["tasks"],
              "externalRuntimeWriteAdmission": validation[
                  "externalRuntimeWriteAdmission"
              ],
              "publicToolCeiling": 12,
              "productionClaimAllowed": False,
              "status": "pass",
          }
          output = Path("/tmp/p5-client-capability-evidence.json")
          output.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n")
          print(json.dumps(result, sort_keys=True))
          PY
          sha256sum /tmp/p5-client-capability-evidence.json \
            > /tmp/p5-client-capability-evidence.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: soleaux-p5-client-capability-evidence-${{ github.run_id }}
          path: |
            /tmp/p5-client-capability-evidence.json
            /tmp/p5-client-capability-evidence.sha256
            /tmp/client-evidence
          if-no-files-found: error
          retention-days: 30
