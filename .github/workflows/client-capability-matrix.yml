name: Client capability matrix

on:
  pull_request:
    branches:
      - main
    paths:
      - native/contracts/client-capability-matrix-v1.json
      - native/daemon/ipc/**
      - native/scripts/probe_client_capabilities.py
      - native/scripts/validate_client_capability_matrix.py
      - native/scripts/p5_client_matrix_smoke.py
      - docs/testing/CLIENT-CAPABILITY-MATRIX.md
      - .github/workflows/client-capability-matrix.yml
  push:
    branches:
      - main
    paths:
      - native/contracts/client-capability-matrix-v1.json
      - native/daemon/ipc/**
      - native/scripts/probe_client_capabilities.py
      - native/scripts/validate_client_capability_matrix.py
      - native/scripts/p5_client_matrix_smoke.py
      - docs/testing/CLIENT-CAPABILITY-MATRIX.md
      - .github/workflows/client-capability-matrix.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-capability-matrix-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  contract:
    name: Matrix contract and Rust admission
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Validate the machine-readable matrix
        run: |
          set -euo pipefail
          mkdir -p /tmp/p5-capability-contract
          python3 native/scripts/validate_client_capability_matrix.py \
            --output /tmp/p5-capability-contract/matrix-validation.json

      - name: Verify exact runtime admission
        working-directory: native
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo check -p soleaux-ipc --all-targets --locked
          cargo clippy -p soleaux-ipc --all-targets --locked -- -D warnings
          cargo test -p soleaux-ipc --locked

      - uses: actions/upload-artifact@v4
        with:
          name: p5-capability-contract
          path: /tmp/p5-capability-contract
          if-no-files-found: error
          retention-days: 30

  claude-code:
    name: Claude Code 2.1.223 probe
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install and probe the pinned Claude Code package
        run: |
          set -euo pipefail
          npm install --global @anthropic-ai/claude-code@2.1.223
          mkdir -p /tmp/p5-capability-claude-code
          python3 native/scripts/validate_client_capability_matrix.py \
            --platform claude_code \
            --output /tmp/p5-capability-claude-code/matrix-validation.json
          python3 native/scripts/probe_client_capabilities.py \
            --platform claude_code \
            --binary claude \
            --output /tmp/p5-capability-claude-code/probe.json
      - uses: actions/upload-artifact@v4
        with:
          name: p5-capability-claude-code
          path: /tmp/p5-capability-claude-code
          if-no-files-found: error
          retention-days: 30

  claude-desktop:
    name: Claude Desktop supported-surface contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate the documented connector and export surface
        run: |
          set -euo pipefail
          mkdir -p /tmp/p5-capability-claude-desktop
          python3 native/scripts/validate_client_capability_matrix.py \
            --platform claude_desktop \
            --output /tmp/p5-capability-claude-desktop/matrix-validation.json
          python3 native/scripts/probe_client_capabilities.py \
            --platform claude_desktop \
            --documentation-only \
            --output /tmp/p5-capability-claude-desktop/probe.json
      - uses: actions/upload-artifact@v4
        with:
          name: p5-capability-claude-desktop
          path: /tmp/p5-capability-claude-desktop
          if-no-files-found: error
          retention-days: 30

  codex:
    name: Codex 0.146.1 app-server probe
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install and probe the pinned official Codex package
        run: |
          set -euo pipefail
          npm install --global @openai/codex@0.146.1
          mkdir -p /tmp/p5-capability-codex
          python3 native/scripts/validate_client_capability_matrix.py \
            --platform codex \
            --output /tmp/p5-capability-codex/matrix-validation.json
          python3 native/scripts/probe_client_capabilities.py \
            --platform codex \
            --binary codex \
            --output /tmp/p5-capability-codex/probe.json
      - uses: actions/upload-artifact@v4
        with:
          name: p5-capability-codex
          path: /tmp/p5-capability-codex
          if-no-files-found: error
          retention-days: 30

  opencode:
    name: OpenCode 1.18.14 HTTP surface probe
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download, verify, and probe the pinned OpenCode release
        run: |
          set -euo pipefail
          mkdir -p /tmp/opencode-bin /tmp/p5-capability-opencode
          curl -fsSL \
            https://github.com/anomalyco/opencode/releases/download/v1.18.14/opencode-linux-x64.tar.gz \
            -o /tmp/opencode.tar.gz
          echo 'f23980ba2aebfbfa53948e55e213d3f2a53740fd7326553828e89ad27e970572  /tmp/opencode.tar.gz' \
            | sha256sum -c -
          tar -xzf /tmp/opencode.tar.gz -C /tmp/opencode-bin
          chmod +x /tmp/opencode-bin/opencode
          python3 native/scripts/validate_client_capability_matrix.py \
            --platform opencode \
            --output /tmp/p5-capability-opencode/matrix-validation.json
          python3 native/scripts/probe_client_capabilities.py \
            --platform opencode \
            --binary /tmp/opencode-bin/opencode \
            --output /tmp/p5-capability-opencode/probe.json
      - uses: actions/upload-artifact@v4
        with:
          name: p5-capability-opencode
          path: /tmp/p5-capability-opencode
          if-no-files-found: error
          retention-days: 30

  cursor:
    name: Cursor runtime-observed read-only probe
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install the official current Cursor CLI and record its version
        run: |
          set -euo pipefail
          curl https://cursor.com/install -fsS | bash
          export PATH="$HOME/.cursor/bin:$HOME/.local/bin:$PATH"
          mkdir -p /tmp/p5-capability-cursor
          python3 native/scripts/validate_client_capability_matrix.py \
            --platform cursor \
            --output /tmp/p5-capability-cursor/matrix-validation.json
          python3 native/scripts/probe_client_capabilities.py \
            --platform cursor \
            --binary cursor-agent \
            --output /tmp/p5-capability-cursor/probe.json
      - uses: actions/upload-artifact@v4
        with:
          name: p5-capability-cursor
          path: /tmp/p5-capability-cursor
          if-no-files-found: error
          retention-days: 30

  generic-mcp:
    name: Generic MCP host and registry write gate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install native build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake libclang-dev llvm-dev pkg-config protobuf-compiler python3-jsonschema sqlite3
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - name: Build and run the exact generic-host probes
        working-directory: native
        run: |
          set -euo pipefail
          mkdir -p /tmp/p5-capability-generic-mcp
          cargo build --release --workspace --all-features --locked
          python3 scripts/phase1_mcp_smoke.py \
            target/release/soleaux . \
            /tmp/p5-capability-generic-mcp/phase1-mcp.json
          python3 scripts/p5_client_matrix_smoke.py \
            target/release/soleaux target/release/soleauxd . \
            /tmp/p5-capability-generic-mcp/client-matrix.json
      - uses: actions/upload-artifact@v4
        with:
          name: p5-capability-generic-mcp
          path: /tmp/p5-capability-generic-mcp
          if-no-files-found: error
          retention-days: 30

  aggregate:
    name: Aggregate P5-002 through P5-006 evidence
    needs:
      - contract
      - claude-code
      - claude-desktop
      - codex
      - opencode
      - cursor
      - generic-mcp
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: p5-capability-*
          path: /tmp/p5-capability-evidence
          merge-multiple: false
      - name: Validate and aggregate every independent workstream
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('/tmp/p5-capability-evidence')
          expected = {
              'claude_code': root / 'p5-capability-claude-code' / 'probe.json',
              'claude_desktop': root / 'p5-capability-claude-desktop' / 'probe.json',
              'codex': root / 'p5-capability-codex' / 'probe.json',
              'opencode': root / 'p5-capability-opencode' / 'probe.json',
              'cursor': root / 'p5-capability-cursor' / 'probe.json',
          }
          reports = {}
          for platform, path in expected.items():
              report = json.loads(path.read_text())
              assert report['status'] == 'pass', (platform, report)
              assert report['writeCapable'] is False, platform
              reports[platform] = {
                  'clientVersion': report['clientVersion'],
                  'matrixVersion': report['matrixVersion'],
                  'writeCapable': report['writeCapable'],
                  'probeEvidenceSha256': report['probe']['evidenceSha256'],
              }

          contract = json.loads(
              (root / 'p5-capability-contract' / 'matrix-validation.json').read_text()
          )
          generic = json.loads(
              (root / 'p5-capability-generic-mcp' / 'client-matrix.json').read_text()
          )
          phase1 = json.loads(
              (root / 'p5-capability-generic-mcp' / 'phase1-mcp.json').read_text()
          )
          assert contract['status'] == 'pass'
          assert generic['status'] == 'pass'
          assert generic['genericHost']['compatibilityState'] == 'verified'
          assert generic['productionClaimAllowed'] is False
          assert generic['publicToolCeiling'] == 12
          assert phase1['status'] == 'pass'

          matrix_path = Path('native/contracts/client-capability-matrix-v1.json')
          matrix_sha = hashlib.sha256(matrix_path.read_bytes()).hexdigest()
          assert matrix_sha == contract['matrixSha256']
          assert matrix_sha == generic['matrixSha256']
          result = {
              'schemaVersion': 'soleaux.p5-client-capability-evidence/v1',
              'sourceCommit': '${{ github.event.pull_request.head.sha || github.sha }}',
              'tasks': ['P5-002', 'P5-003', 'P5-004', 'P5-005', 'P5-006'],
              'matrixSha256': matrix_sha,
              'platforms': reports,
              'genericMcpHost': {
                  'clientVersion': 'mcp-2025-11-25',
                  'compatibilityState': generic['genericHost']['compatibilityState'],
                  'writeCapable': True,
                  'phase1Mcp': 'pass',
                  'registry': 'pass',
              },
              'publicToolCeiling': 12,
              'productionClaimAllowed': False,
              'status': 'pass',
          }
          output = root / 'P5-002-P5-006-CAPABILITY-MATRIX-EVIDENCE.json'
          output.write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          print(json.dumps(result, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: soleaux-p5-client-capability-matrix-${{ github.run_id }}
          path: /tmp/p5-capability-evidence
          if-no-files-found: error
          retention-days: 30
