name: Apply P4-018 final review corrections

on:
  push:
    branches:
      - fix/stale-index-read-freshness-0.4.0-dev.5
    paths:
      - .github/workflows/apply-p4-018-final-review.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stale-index-read-freshness-0.4.0-dev.5
          fetch-depth: 0

      - name: Apply exact text corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path("native/daemon/mcp/src/lib.rs")
          text = source.read_text(encoding="utf-8")
          old = (
              '        *self.registry.write().expect("registry lock poisoned") =\n'
              '            scan_registry(self.root(), &self.index)?;\n'
              '        Ok(report)\n'
          )
          new = (
              '        let registry = scan_registry(self.root(), &self.index)?;\n'
              '        *self.registry.write().expect("registry lock poisoned") = registry;\n'
              '        Ok(report)\n'
          )
          if text.count(old) != 1:
              raise SystemExit(f"registry assignment match count: {text.count(old)}")
          source.write_text(text.replace(old, new, 1), encoding="utf-8")

          verifier = Path(".github/workflows/verify-p4-018-final.yml")
          text = verifier.read_text(encoding="utf-8")
          old = (
              '          sha256sum evidence/P4-018-RECEIPT.json > '
              'evidence/SHA256SUMS\n'
          )
          new = (
              '          (\n'
              '            cd evidence\n'
              '            sha256sum P4-018-RECEIPT.json > SHA256SUMS\n'
              '          )\n'
          )
          if text.count(old) != 1:
              raise SystemExit(f"checksum command match count: {text.count(old)}")
          verifier.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          grep -n 'let registry = scan_registry' native/daemon/mcp/src/lib.rs
          grep -A3 -n 'cd evidence' .github/workflows/verify-p4-018-final.yml

      - name: Commit normal source and remove applicator
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-p4-018-final-review.yml
          git add native/daemon/mcp/src/lib.rs .github/workflows/verify-p4-018-final.yml
          git diff --cached --check
          git commit -m "fix(index): minimize registry lock scope and repair evidence checksums"
          git push origin HEAD:fix/stale-index-read-freshness-0.4.0-dev.5
