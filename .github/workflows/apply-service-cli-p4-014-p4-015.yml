name: Apply stable CLI and local IPC P4-014 P4-015

on:
  push:
    branches:
      - feat/service-cli-p4-014-p4-015-0.4.0-dev.5
    paths:
      - .github/workflows/apply-service-cli-p4-014-p4-015.yml

permissions:
  contents: write

concurrency:
  group: apply-service-cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install native build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake libclang-dev llvm-dev pkg-config protobuf-compiler

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Apply stable CLI and IPC integration
        run: |
          set -euo pipefail
          python3 -m py_compile .ci/apply-service-cli-p4-014-p4-015.py
          python3 .ci/apply-service-cli-p4-014-p4-015.py
          cargo fmt --manifest-path native/Cargo.toml --all
          cargo check --manifest-path native/Cargo.toml --workspace --all-targets --all-features
          git diff --check

      - name: Validate local IPC service CLI and full native workspace
        working-directory: native
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo check --workspace --all-targets --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test -p soleaux-ipc --all-features --locked
          cargo test -p soleaux-state --all-features --locked
          cargo test --workspace --all-features --locked
          cargo build --release --workspace --all-features --locked
          ./target/release/soleaux --help
          ./target/release/soleauxd --help
          if ! command -v cargo-audit >/dev/null 2>&1; then
            cargo install cargo-audit --locked
          fi
          cargo audit --deny warnings

      - name: Commit compiler-proven normal source
        run: |
          set -euo pipefail
          rm .ci/apply-service-cli-p4-014-p4-015.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/Cargo.toml native/Cargo.lock native/daemon/ipc native/daemon/engine native/apps/cli .ci/apply-service-cli-p4-014-p4-015.py
          git diff --cached --check
          git commit -m 'feat(service): add typed per-user daemon IPC and stable operations CLI'
          git push origin HEAD:${{ github.ref_name }}
