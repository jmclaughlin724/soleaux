name: Repair P4-026 storage applicator targets

on:
  push:
    branches:
      - fix/atomic-preview-claim-p4-026-0.4.0-dev.5
    paths:
      - .github/workflows/fix-p4-026-storage-script.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Bind the version-zero replacement to the first matching migration
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.ci/apply-p4-026-storage.py')
          text = path.read_text(encoding='utf-8')
          old = '''def replace_once(text: str, old: str, new: str, label: str) -> str:
              if text.count(old) != 1:
                  raise SystemExit(f"P4-026 storage target drifted: {label} ({text.count(old)})")
              return text.replace(old, new, 1)
          '''
          new = '''def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              expected = 2 if label == "version zero migration" else 1
              if count != expected:
                  raise SystemExit(f"P4-026 storage target drifted: {label} ({count})")
              return text.replace(old, new, 1)
          '''
          if text.count(old) != 1:
              raise SystemExit('replace_once helper drifted')
          repaired = text.replace(old, new, 1)
          compile(repaired, str(path), 'exec')
          path.write_text(repaired, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ci/apply-p4-026-storage.py
          git diff --cached --check
          git commit -m 'ci: bind P4-026 migration replacements deterministically'
          git push origin HEAD:${{ github.ref_name }}
