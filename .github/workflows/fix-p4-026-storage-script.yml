name: Repair P4-026 storage applicator syntax

on:
  push:
    branches:
      - fix/atomic-preview-claim-p4-026-0.4.0-dev.5
    paths:
      - .github/workflows/fix-p4-026-storage-script.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Generate valid raw-string terminator literals
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.ci/apply-p4-026-storage.py')
          source_lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
          replacement = '        ' + repr('            "#,') + ',\n'
          replaced = 0
          for index, line in enumerate(source_lines):
              stripped = line.rstrip('\n')
              if stripped.startswith('        "') and '#,' in stripped and stripped.endswith('","'):
                  source_lines[index] = replacement
                  replaced += 1
          if replaced < 2:
              raise SystemExit(f'expected at least two malformed raw-string lines, observed {replaced}')
          repaired = ''.join(source_lines)
          compile(repaired, str(path), 'exec')
          path.write_text(repaired, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ci/apply-p4-026-storage.py
          git diff --cached --check
          git commit -m 'ci: repair P4-026 storage applicator syntax'
          git push origin HEAD:${{ github.ref_name }}
