name: Repair P4-026 storage applicator syntax

on:
  push:
    branches:
      - fix/atomic-preview-claim-p4-026-0.4.0-dev.5
    paths:
      - .github/workflows/fix-p4-026-storage-script.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Normalize raw-string terminator source lines
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.ci/apply-p4-026-storage.py')
          source_lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
          replacement = "        '            \"#,',\n"
          replaced = 0
          for index, line in enumerate(source_lines):
              if '#,' in line and line.lstrip().startswith('"'):
                  source_lines[index] = replacement
                  replaced += 1
          if replaced != 3:
              raise SystemExit(f'expected three raw-string terminator lines, observed {replaced}')
          repaired = ''.join(source_lines)
          compile(repaired, str(path), 'exec')
          path.write_text(repaired, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ci/apply-p4-026-storage.py
          git diff --cached --check
          git commit -m 'ci: repair P4-026 storage applicator syntax'
          git push origin HEAD:${{ github.ref_name }}
