name: Repair P4-026 storage applicator syntax

on:
  push:
    branches:
      - fix/atomic-preview-claim-p4-026-0.4.0-dev.5
    paths:
      - .github/workflows/fix-p4-026-storage-script.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Repair malformed raw-string terminators
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.ci/apply-p4-026-storage.py')
          text = path.read_text(encoding='utf-8')
          bad = '        "            \\"#,","'
          good = '        "            \\"#,",'
          count = text.count(bad)
          if count != 2:
              raise SystemExit(f'expected two malformed raw-string lines, observed {count}')
          path.write_text(text.replace(bad, good), encoding='utf-8')
          compile(path.read_text(encoding='utf-8'), str(path), 'exec')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ci/apply-p4-026-storage.py
          git diff --cached --check
          git commit -m 'ci: repair P4-026 storage applicator syntax'
          git push origin HEAD:${{ github.ref_name }}
