name: Apply P4-018 watcher-backed incremental refresh

on:
  push:
    branches:
      - fix/stale-index-read-freshness-0.4.0-dev.5
    paths:
      - .ci/p4-018-watcher-v3.patch.xz.b64
      - .github/workflows/apply-p4-018-watcher-v3.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-p4-018-watcher-v3
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stale-index-read-freshness-0.4.0-dev.5
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Decode and apply the hash-bound watcher repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < .ci/p4-018-watcher-v3.patch.xz.b64 | tr -d ' ')" = "3336"
          echo '3d13cd51b30e00285ee0e6e54c53477166794e0214e6953636b293e638b8cc7b  .ci/p4-018-watcher-v3.patch.xz.b64' | sha256sum -c -
          base64 --decode .ci/p4-018-watcher-v3.patch.xz.b64 > /tmp/p4-018-watcher-v3.patch.xz
          echo 'd8a5984e38d045f9740bc3106ddbcfe4d6a64e49c7ca92768a8c178293ee7d07  /tmp/p4-018-watcher-v3.patch.xz' | sha256sum -c -
          xz -t /tmp/p4-018-watcher-v3.patch.xz
          xz --decompress --stdout /tmp/p4-018-watcher-v3.patch.xz > /tmp/p4-018-watcher-v3.patch
          echo 'e3b21af58176d3a87fdf0272eb3cd7282822a4f3cf7c726684e1aa76e0a18912  /tmp/p4-018-watcher-v3.patch' | sha256sum -c -
          python3 - <<'PY'
          from collections import defaultdict
          from pathlib import Path

          patch_lines = Path('/tmp/p4-018-watcher-v3.patch').read_text(encoding='utf-8').splitlines(keepends=True)
          current_path = None
          old_lines = []
          new_lines = []
          hunks = defaultdict(list)

          def flush_hunk():
              global old_lines, new_lines
              if current_path is None or (not old_lines and not new_lines):
                  old_lines = []
                  new_lines = []
                  return
              old = ''.join(old_lines)
              new = ''.join(new_lines)
              old_lines = []
              new_lines = []
              if not old:
                  raise SystemExit(f'{current_path}: empty replacement anchor is not allowed')
              hunks[Path(current_path)].append((old, new))

          for line in patch_lines:
              if line.startswith('diff --git '):
                  flush_hunk()
                  parts = line.rstrip('\n').split(' ')
                  current_path = parts[3][2:]
                  continue
              if line.startswith('--- ') or line.startswith('+++ '):
                  continue
              if line.startswith('@@'):
                  flush_hunk()
                  continue
              if current_path is None:
                  continue
              if line.startswith(' '):
                  old_lines.append(line[1:])
                  new_lines.append(line[1:])
              elif line.startswith('-'):
                  old_lines.append(line[1:])
              elif line.startswith('+'):
                  new_lines.append(line[1:])
              else:
                  old_lines.append(line)
                  new_lines.append(line)
          flush_hunk()

          changed = 0
          changed_files = 0
          for path, file_hunks in hunks.items():
              original = path.read_text(encoding='utf-8')
              cursor = 0
              replacements = []
              for index, (old, new) in enumerate(file_hunks, start=1):
                  position = original.find(old, cursor)
                  if position < 0:
                      raise SystemExit(
                          f'{path}: original-source anchor {index} not found after byte {cursor}; '
                          f'total matches={original.count(old)}'
                      )
                  if old != new:
                      replacements.append((position, position + len(old), new, index))
                      changed += 1
                  cursor = position + len(old)

              previous_end = -1
              for start, end, _, index in replacements:
                  if start < previous_end:
                      raise SystemExit(f'{path}: replacement hunk {index} overlaps a prior hunk')
                  previous_end = end

              updated = original
              for start, end, new, _ in reversed(replacements):
                  updated = updated[:start] + new + updated[end:]
              if updated != original:
                  path.write_text(updated, encoding='utf-8')
                  changed_files += 1

          if changed == 0:
              raise SystemExit('watcher repair made no source replacements')
          print(f'applied {changed} source replacements across {changed_files} files')
          PY

      - name: Resolve and lock the pinned watcher dependency
        working-directory: native
        shell: bash
        run: |
          set -euo pipefail
          cargo check --workspace --all-targets --all-features
          grep -q '^name = "notify"$' Cargo.lock

      - name: Format and run focused native gates
        working-directory: native
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all --check
          cargo check --workspace --all-targets --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test -p soleaux-intelligence --all-features --locked
          cargo test -p soleaux-mcp --all-features --locked structural_reads_refresh_external_mutations_and_deletions
          cargo test -p soleaux-mcp --all-features --locked concurrent_structural_reads_share_a_serial_refresh_barrier
          cargo test -p soleaux-mcp --all-features --locked stale_structural_hits_are_never_returned_as_verified_evidence

      - name: Commit normal source and remove the transient carrier
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .ci/p4-018-watcher-v3.patch.xz.b64
          git rm .github/workflows/apply-p4-018-watcher-v3.yml
          git add native/Cargo.toml \
                  native/Cargo.lock \
                  native/daemon/intelligence/Cargo.toml \
                  native/daemon/intelligence/src/index.rs
          git diff --cached --check
          git commit -m "fix(index): drive incremental freshness from repository watcher"
          git push origin HEAD:fix/stale-index-read-freshness-0.4.0-dev.5
