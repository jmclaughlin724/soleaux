name: Materialize quoted gateway backend identifier support

on:
  push:
    branches:
      - fix/gateway-quoted-backend-identifiers-0.4.0-dev.5
    paths:
      - .github/workflows/materialize-gateway-quoted-keys.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Install native build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake libclang-dev llvm-dev pkg-config protobuf-compiler
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Apply quoted-key parsing and regression coverage
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('native/daemon/mcp/src/gateway.rs')
          text = path.read_text(encoding='utf-8')
          old = '''        if let Some(name) = line
            .strip_prefix("[mcp.")
            .and_then(|value| value.strip_suffix(']'))
        {
            validate_identifier(name, "backend")?;
            current = Some(name.to_string());
            sections.entry(name.to_string()).or_default();
            continue;
        }
'''
          new = '''        if let Some(raw_name) = line
            .strip_prefix("[mcp.")
            .and_then(|value| value.strip_suffix(']'))
        {
            let name = parse_table_key(raw_name)?;
            validate_identifier(&name, "backend")?;
            current = Some(name.clone());
            sections.entry(name).or_default();
            continue;
        }
'''
          if text.count(old) != 1:
              raise SystemExit(f'gateway table parser drifted: {text.count(old)}')
          text = text.replace(old, new, 1)
          marker = '''fn parse_string(value: &str) -> Result<String> {
'''
          helper = '''fn parse_table_key(value: &str) -> Result<String> {
    let value = value.trim();
    if value.starts_with('"') || value.ends_with('"') {
        return parse_string(value);
    }
    if value.starts_with('\'') || value.ends_with('\'') {
        if value.len() < 2 || !value.starts_with('\'') || !value.ends_with('\'') {
            bail!("invalid quoted TOML table key: {value}");
        }
        return Ok(value[1..value.len() - 1].to_string());
    }
    Ok(value.to_string())
}

'''
          if text.count(marker) != 1:
              raise SystemExit('gateway string parser insertion point drifted')
          text = text.replace(marker, helper + marker, 1)
          test_marker = '''    #[test]
    fn credentials_are_outside_the_workspace() {
'''
          regression = '''    #[test]
    fn quoted_backend_table_keys_are_decoded_before_validation() {
        let parsed = parse_backends(
            r#"
[mcp."openai-docs"]
url = "https://developers.openai.com/mcp"

[mcp.'vendor-api']
url = "https://example.invalid/mcp"
"#,
            "soleaux.toml",
        )
        .expect("quoted keys");
        assert_eq!(
            parsed.iter().map(|backend| backend.name.as_str()).collect::<Vec<_>>(),
            vec!["openai-docs", "vendor-api"]
        );
    }

    #[test]
    fn repository_gateway_configuration_with_quoted_key_is_discoverable() {
        let directory = tempdir().expect("tempdir");
        fs::write(
            directory.path().join("soleaux.toml"),
            "[mcp.\\\"openai-docs\\\"]\\nurl = \\\"https://developers.openai.com/mcp\\\"\\n",
        )
        .expect("configuration");
        let backends = discover_backends(directory.path()).expect("discover");
        assert_eq!(backends.len(), 1);
        assert_eq!(backends[0].name, "openai-docs");
        assert_eq!(backends[0].namespace, "openai-docs");
    }

'''
          if text.count(test_marker) != 1:
              raise SystemExit('gateway regression insertion point drifted')
          path.write_text(text.replace(test_marker, regression + test_marker, 1), encoding='utf-8')
          PY
          cargo fmt --manifest-path native/Cargo.toml --all
          git diff --check
      - name: Validate gateway parsing and complete native workspace
        working-directory: native
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo check --workspace --all-targets --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test -p soleaux-mcp --all-features --locked gateway
          cargo test --workspace --all-features --locked
          cargo build --release --workspace --all-features --locked
          ./target/release/soleaux doctor .. > ../gateway-doctor.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('../gateway-doctor.json').read_text())
          assert value
          PY
      - name: Commit validated normal source
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-gateway-quoted-keys.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/daemon/mcp/src/gateway.rs .github/workflows/materialize-gateway-quoted-keys.yml
          git diff --cached --check
          git commit -m 'fix(gateway): decode quoted backend table keys'
          git push origin HEAD:${{ github.ref_name }}
