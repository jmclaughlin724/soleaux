name: Materialize quoted gateway backend identifier support

on:
  push:
    branches:
      - fix/gateway-quoted-backend-identifiers-0.4.0-dev.5
    paths:
      - .github/workflows/materialize-gateway-quoted-keys.yml
      - .ci/apply-gateway-quoted-keys.py

permissions:
  contents: write

concurrency:
  group: materialize-gateway-quoted-keys-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Install native build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake libclang-dev llvm-dev pkg-config protobuf-compiler
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Apply quoted-key parsing and regression coverage
        run: |
          set -euo pipefail
          python3 -m py_compile .ci/apply-gateway-quoted-keys.py
          python3 .ci/apply-gateway-quoted-keys.py
          cargo fmt --manifest-path native/Cargo.toml --all
          git diff --check
      - name: Validate gateway parsing and complete native workspace
        working-directory: native
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo check --workspace --all-targets --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test -p soleaux-mcp --all-features --locked gateway
          cargo test --workspace --all-features --locked
          cargo build --release --workspace --all-features --locked
          ./target/release/soleaux doctor .. > ../gateway-doctor.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('../gateway-doctor.json').read_text())
          assert value
          PY
      - name: Commit validated normal source
        run: |
          set -euo pipefail
          rm .ci/apply-gateway-quoted-keys.py
          rm .github/workflows/materialize-gateway-quoted-keys.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            native/daemon/mcp/src/gateway.rs \
            .ci/apply-gateway-quoted-keys.py \
            .github/workflows/materialize-gateway-quoted-keys.yml
          git diff --cached --check
          git commit -m 'fix(gateway): decode quoted backend table keys'
          git push origin HEAD:${{ github.ref_name }}
