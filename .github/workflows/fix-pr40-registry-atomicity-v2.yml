name: Apply PR40 registry atomicity review fixes v2

on:
  workflow_run:
    workflows:
      - Soleaux documentation consistency
    types:
      - completed

permissions:
  contents: write

env:
  TARGET_BRANCH: fix/p5-client-matrix-post-merge-remediation
  EXPECTED_HEAD: cbe173fdfc1155ee156aa1e3ddf63e86700db681
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fix-and-verify:
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Verify exact source and load reviewed codemod
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch origin main
          git show origin/main:.ci/fix-pr40-registry-atomicity.py > /tmp/fix-pr40.py
          python3 -m py_compile /tmp/fix-pr40.py

      - name: Install native build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake libclang-dev llvm-dev pkg-config protobuf-compiler python3-jsonschema

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Apply and validate serialized revalidation
        run: |
          set -euo pipefail
          python3 /tmp/fix-pr40.py
          cd native
          cargo fmt --all
          cargo fmt --all --check
          cargo check --workspace --all-targets --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test -p soleaux-state --all-features --locked registry_client_revalidation
          cargo test -p soleaux-ipc --all-features --locked
          cargo test --workspace --all-features --locked
          cd ..
          git diff --check

      - name: Commit exact validated source to PR branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            native/daemon/ipc/src/registry.rs \
            native/daemon/state/src/database.rs \
            native/daemon/state/src/tests.rs
          git diff --cached --check
          git commit -m 'fix(registry): serialize compatibility revalidation'
          git push origin HEAD:${TARGET_BRANCH}
          git rev-parse HEAD | tee /tmp/PR40-ATOMICITY-SOURCE-COMMIT

      - uses: actions/upload-artifact@v4
        with:
          name: soleaux-pr40-registry-atomicity-${{ github.run_id }}
          path: /tmp/PR40-ATOMICITY-SOURCE-COMMIT
          if-no-files-found: error
          retention-days: 30

      - name: Remove one-shot orchestration from main
        if: success()
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          rm -f \
            .ci/fix-pr40-registry-atomicity.py \
            .github/workflows/fix-pr40-registry-atomicity.yml \
            .github/workflows/fix-pr40-registry-atomicity-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove completed PR40 atomicity orchestration'
          git push origin HEAD:main
