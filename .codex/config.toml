#:schema https://developers.openai.com/codex/config-schema.json

sandbox_mode = "danger-full-access"

[features]
hooks = false

[mcp_servers."next-devtools"]
enabled = true
required = true
command = "npx"
args = ["-y", "next-devtools-mcp@0.4.0"]
cwd = "."
default_tools_approval_mode = "approve"
startup_timeout_sec = 30.0
tool_timeout_sec = 60.0

[mcp_servers.soleaux]
enabled = true
required = true
command = ".venv/bin/python"
args = ["scripts/soleaux/client.py", "bridge", "codex"]
cwd = "."
default_tools_approval_mode = "approve"
startup_timeout_sec = 20.0
tool_timeout_sec = 60.0

[mcp_servers.soleaux.tools.describe]
approval_mode = "approve"

[mcp_servers.soleaux.tools.search]
approval_mode = "approve"

[mcp_servers.soleaux.tools.context]
approval_mode = "approve"

[mcp_servers.soleaux.tools.query]
approval_mode = "approve"

[mcp_servers.soleaux.tools.owners]
approval_mode = "approve"

[mcp_servers.soleaux.tools.navigate]
approval_mode = "approve"

[mcp_servers.soleaux.tools.inspect]
approval_mode = "approve"
