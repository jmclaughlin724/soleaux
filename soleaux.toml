schema_version = "soleaux.config/v1"

[structural]
project_config = "sgconfig.yml"

[skills]
enabled = true
roots = [".agents/skills"]
supporting_files = "template"

# Remote documentation backends are exposed through the single Soleaux host
# registration and arrive namespaced as context7_*, openai-docs_*, and zod_*.
[mcp.context7]
url = "https://mcp.context7.com/mcp"

[mcp."openai-docs"]
url = "https://developers.openai.com/mcp"

[mcp.zod]
url = "https://mcp.inkeep.com/zod/mcp"
