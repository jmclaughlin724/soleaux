[workspace]
resolver = "2"
members = [
  "apps/cli",
  "daemon/adapters/codex",
  "daemon/adapters/opencode",
  "daemon/engine",
  "daemon/intelligence",
  "daemon/ipc",
  "daemon/mcp",
  "daemon/redaction",
  "daemon/state",
  "daemon/storage",
  "daemon/vault",
]
exclude = [
  "apps/desktop/src-tauri",
]
default-members = [
  "apps/cli",
  "daemon/adapters/codex",
  "daemon/adapters/opencode",
  "daemon/engine",
  "daemon/intelligence",
  "daemon/ipc",
  "daemon/mcp",
  "daemon/state",
  "daemon/storage",
  "daemon/vault",
]

[workspace.package]
version = "0.4.0-dev.5"
edition = "2024"
rust-version = "1.97.1"
authors = ["Soleaux"]
repository = "https://github.com/jmclaughlin724/soleaux"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
axum = { version = "=0.8.9", features = ["http1", "json", "tokio"] }
blake3 = "1"
clap = { version = "=4.5.48", features = ["derive", "env"] }
dashmap = "6"
dirs = "6"
glob = "=0.3.2"
hex = "0.4"
http = "=1.4.2"
ignore = "=0.4.31"
libc = "0.2"
moka = { version = "=0.12.15", features = ["future"] }
notify = "=8.2.0"
oxc_allocator = "=0.142.0"
oxc_ast = "=0.142.0"
oxc_ast_visit = "=0.142.0"
oxc_parser = "=0.142.0"
oxc_span = "=0.142.0"
oxc_syntax = "=0.142.0"
pg_query = "=6.1.1"
rusqlite = { version = "0.40", features = ["bundled", "serde_json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "=2.6.1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = {
  version = "=0.3.20",
  features = ["env-filter", "fmt", "json"]
}
tree-sitter = "=0.26.11"
tree-sitter-bash = "=0.25.1"
tree-sitter-python = "=0.25.0"
tree-sitter-typescript = "=0.23.2"
url = "=2.5.8"
uuid = { version = "=1.24.0", features = ["serde", "v4", "v7"] }
