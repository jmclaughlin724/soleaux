# cargo-audit policy for the native workspace. The CI gate runs
# `cargo audit --deny warnings`; every advisory class stays denied except the
# entries listed here, each of which must carry its justification.

[advisories]
ignore = [
  # RUSTSEC-2024-0436: `paste` is unmaintained (warning-class, not a
  # vulnerability). It is a compile-time-only proc macro with no runtime code
  # path, reached transitively through libcst 1.8.6 (the pinned Python CST
  # parser for P5-022). Revisit when libcst drops the dependency.
  "RUSTSEC-2024-0436",
]
