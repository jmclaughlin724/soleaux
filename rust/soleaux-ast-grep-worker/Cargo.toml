[package]
name = "soleaux-ast-grep-worker"
version.workspace = true
edition.workspace = true
description = "Supervised JSONL worker for structural search and rewrite via the ast-grep Rust crates"
license.workspace = true
publish.workspace = true

[dependencies]
ast-grep-config = "=0.45.0"
ast-grep-core = "=0.45.0"
ast-grep-language = "=0.45.0"
base64 = "0.22.1"
# Same requirement as ast-grep-core so `BitSet` unifies to one type in the
# `Matcher` implementation.
bit-set = "0.11.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
